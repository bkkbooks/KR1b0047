body:
  text: 尚書稗䟽卷四上岳州王夫之撰周書泰誓上惟十有三年武王克商之歲日月時先儒紛訟不一其以為己卯歲者劉歆三統厯與邵子皇極經世也其以為辛卯歲者竹書與唐一行也以為武王即位之三年者孔安國也以為十一年起兵而十二年克商者竹書也以為十二年起兵而十三年克商者泰誓經文與家語管子也孔氏通文王受命之歲而計之其誣妄不經宋儒辨之詳矣天子受天命侯伯受王命盖曰受命中庸曰武王末受命受於天也文王受命專征伐受於紂也詞同而事異昧者因惑焉其以為十二年伐商而十三年克之者一行以為通成君之歲是也文王薨於己卯而克商以辛卯歴年十三嗣子定位於初䘮逾年改元或為周制而武王初立猶用殷質也至於以甲子紀之則為辛卯而非巳卯一行据國語歲在鶉火月在天駟日在析木之津辰在斗柄星在天黿上推千歲合不爽建亥之月戊子日在箕十度晨初月在房四度建子月朔日庚寅日月㑹南斗一度辰星夕見斗二十度惟辛卯歲為然則一行之精宻非劉邵之所能與矣三統厯以文王薨之己卯為克商之年差十二年而邵子以克商之辛卯為昭王之三年乃以商武丁三年當王季即位之十七年己卯歲為克商之年其差七十二年月不在房辰不在斗星不在天黿以歲差六十七年一度凖之日尚在斗杪為星紀之初而非析木之津也則折𠂻歸一其為武王逾年改元之十二年辛卯歲定矣朱子以四月有丁未推之謂諸家厯以此年二月有閏不知所謂此年者己卯乎抑辛卯乎如必辛卯而有閏則非己卯亦審閏之積差未有相去七十三年而同於建卯之後月無中氣者也文王薨以己卯生以癸卯武王崩以丙申生以甲子文王二十二而生武王世傳十三而舉武王者妄也陳氏謂二十四而生武王者亦誤也文王以己巳歲得太公以為師其先囚於羑里太公未嘗歸周也以武王生於甲子計之年已六十有五而後邑姜歸焉既無莫年方娶之理若以為繼室則禮無二嫡諸侯固不再娶斯禮記夢齡之説固不足信武王實不以甲子生而亦無九十三年之壽也至於克商日月之差汲冢書云一月丙辰旁生魄若翼日丁巳王歩自於周伐商越若來二月既死魄越五日甲子朝至接於商四月既旁生魄越六目庚戌武王朝至燎於周又曰維四月乙未日武王成辟四方以武王發周之日較之武成亦異今按武成所云一月者建子之月也以前建亥之月晦前一日戊子月晨在房四度周師初起又五日而武王始出知其為建子之月也建子之月朔日庚寅四日癸巳王乃躬莅六師其月二十九日戊午渡河而北建丑之月朔日庚申五日甲子昧爽克商建卯之月丁未祀於周廟庚戌大告武成甲子去丁未一百四日建丑月五日去建卯月十九日止六十四日而多四十日則是年之閏盖在周正三月之後而不在夏正二月之後也與朱子所引厯家之言為殊若如汲冢書之以丙辰為一月望後之一日則云甲子八日二月五日不得為甲子而與其曰既死魄越五日甲子者自相背戾矣其曰既有生魄越六日庚戌以一行所推建卯之月十六日甲辰望十七日為旁生魄六日而得庚戌為二十二日則與武成合而不爽今以一行之法推泰誓武成之月日則周師起於庚寅歲夏正十月之二十九日或二十八日武王即戎於夏正十一月之四日滅商於夏正十二月之五日武王反豐以夏正二月之三日祀廟於十九日柴望於二十二日而蔡氏以戊午為一月二十八日甲子為二月四日既用三統厯所推辛卯為建寅月朔後一行厯一日而謂建子之月為二月則以商正紀事而不知史成於有周受命之後稱年而不稱祀則其為周正無疑也以周正紀事四月為夏正之二月則十有三年春大㑹於孟津亦以夏時冠周月如春秋之所謂春王正月者其實冬也盖癸巳為建子月之四日則甲子必為建丑月之五日而林氏謂日行三十里豐去孟津九百里孟津縣至西安府八百四十里凡三十日而自豐至孟津程期􅘈合使以夏正十一月四日自周於征而次年二月五日乃至孟津則在􅂗凡九十一日師老糧匱於未見敵之地太公不如是之拙而况註已明言一月二十八日則非夏正建卯之二月為已明徒於春㑹孟津之下辨其為夏正之春借註之矛攻註之盾而已足矣春秋以夏時冠周月朱子力辨胡氏之非因疑春㑹於孟津之誤不知孔子憲章文武作春秋以尊王固必以周之所謂春而為春則朱子之未逹而胡氏剏制之説亦非矣詩曰四月維夏六月徂暑言維夏則本非夏而維時謂之夏也徂暑者往而向暑也使為夏正之四月則固然其夏而不待曰維夏六月暑已極而不當言徂暑也是周之紀四序固一以建子為春矣若豳風七月之詩以夏正紀時物則以公劉遷豳在夏之世承公劉而用夏爾周師之起以武王成君之十二年建亥月武王于征在其明年一月之四日故謂之十有三年若以夏正紀月而用逾年改元之法紀歲則孟津之㑹在武王十一年之十一月而牧野之役在十二月序用漢人已改夏正之時月從周制逾年改元之典禮謂之十一年亦可此經文與序竹書與唐厯志異説同揆原不相悖也而漢儒通算文王九年為武王之年經世上渉武丁之己卯汲冢書丙辰丁巳之訛則皆參差齟齬其誤易見不勞辨而自破矣上推往古之日月是非固為難辨誠有如朱子之疑乃幸而有七政行度之可推見於國語則十三年春大㑹於孟津實辛卯歲夏正十一月二十九日戊午攷於厯而合攷於經而合攷於國語而合斯可信已宜於冡上註云冡土大社也按天子為民立社曰大社自立社曰王社諸侯為民立社曰國社自立社曰侯社有大師則設軍社軍社為軍而設不在大社王社國社侯社之列緜之詩曰廼立冡土戎醜攸行明軍社之為戎行設也盖二社為國所憑依無可遷行之禮故春秋傳曰不有居者誰守社稷則君行而社不與俱行矣乃以大師所次民聚而君在焉則軍舍而居然國容以祈以報不容無主則别立冡土以為軍行之社師出則載以行斯國社不移而軍自有社故詩曰戎醜攸行而禮謂之設明其非大社矣周當太王之世遵用殷禮則預立冡土以待戎行武王承之至周公定禮以冡土預立無事則嫌於凟設乃廢預立之制而有大師則暫立焉故小宗伯之職曰若大師則帥有司而立軍社肆師之職曰凡師甸用牲于社宗而鄭元曰社軍社也武王以前冡土預立則師將行而宜祭亦於此社周公以後軍社不預立則先宜於大社而後立軍社故周禮大祝曰大師宜於社造於祖設軍社先宜而後設則所宜者非所設矣而春秋傳之祓社釁鼓社奉以從祝為師祝而社亦軍社其國社侯社固自若也武王之所宜者太王所立之軍社周禮所云大師宜于社者自王畿之大社既不可泥禮以説書而太王為殷之侯國有國社而無大社則冡土不得有大社之名毛傳曰美太王之社遂為大社則與泥禮以説詩均於失已牧誓庸蜀羌髳微盧彭濮按此八國傳註多有踈失今攷庸上庸也在今鄖陽竹溪縣西蜀國本在成都帝嚳支庶所封世為侯國羌者參狼白馬之羌漢為武都之羌道今文縣千戸所其地也髳按説文云漢令有髳長大縣曰令小縣曰長今攷漢郡國志無髳縣惟蜀郡屬國有旄牛縣華陽國志云旄地也在今黎州安撫司微者華陽國志上庸郡之㣲陽縣也計其為國當在竹山房縣之間盧者漢郡國志南郡有中盧縣襄陽耆舊傳曰古盧戎也春秋傳羅與盧戎兩軍之盧地近羅羅在宜城西山中今南漳縣地則盧戎之國當在榖城保康之間矣彭蘇氏以為武陽之彭亡聚則是眉州之彭山縣唐元和志云周末彭祖居此而死漢志亦云有彭祖冡乃彭祖為殷大夫而殷固有彭國不因彭祖得名則蘇説非也又一統志以成都之彭縣為古彭國乃天彭門之號剏於李冰亦非古國名而經文與盧濮並舉不與羌蜀相連則亦非也春秋傳云伐絞之役楚師分渉於彭今酉陽平茶有彭水于地太逺故杜預曰彭水在新城昌魏縣昌魏在房縣北則彭之為國濱於彭水當在上津縣之南也濮與麋為鄰故春秋傳云麇人率百濮聚于選麇今鄖陽府治其東則楚也其西則濮也是濮之為國夾漢水而處居鄖陽之上流在白河之東南矣在周之西南者由庸而蜀由蜀而羌由羌而髳皆以自東而西為序在周之東南者由㣲而盧由盧而彭由彭而濮皆以自南而北為序而庸蜀羌髳互處千里之外微盧彭濮聚於數百里之境則大小逺近固有不齊要則詩序所謂南國也庸宜連㣲盧以紀而連蜀者或以其國之大而先之或以庸居七國之中而為之統率也傳註謂微在巴蜀彭在西北濮在江漢之南羌為先零䍐开彭為彭亡聚同歸於誤以役西土四字孔傳義既不諧蔡註謂勿迎擊之以勞役我西土之人則不䘏彼之見殺而以舉刃為勞其言亦甚不仁矣役服役也以以歸也言降者勿殺當以之而歸使服役於西土也經文本皎然可見何必巧於立説以為慘刻之言哉武成歩自周蔡註云周鎬京也今按武王遷鎬在武成之後文王有聲之詩可考也其詩之五章曰豐水東注維禹之績四方攸同皇王維辟言四方㑹同於豐以臣服於周而武王成其為君也其八章曰豐水有芑武王豈不仕言武王之有事者始基於豐也其六章曰鎬京辟廱自西自東自南自北無思不服者言武王遷鎬當天下大定之後四方皆服不但底定東土而已也其七章曰考卜維王宅是鎬京言武王已正號稱王而始卜宅也則遷鎬在武成之後明矣且此篇下文云王來自商至於豐其歸也於豐則其往也亦於豐而蔡氏乃云文王舊都周先王之廟在焉夫遷國者必遷其宗廟武王居鎬而廟在豐將廟不與並遷而鎬無廟與是棄其祖考而逺之也抑豐鎬之皆有廟與此漢豐沛髙廟唐東都太廟之所以為失禮而武王不宜爾也且豐鎬而皆有廟則自可告武成於鎬廟抑不當舍鎬而至豐矣蔡氏之云爾者以召誥亦云歩自周疑其同為鎬京不知召誥在遷鎬之後自可謂鎬為周詞同而實異也盖周本以岐之周原為國號都屢遷而號仍故亦猶商之十三遷而仍商雒之名則岐本周也豐亦周也鎬亦周也乃至東遷郟鄏而猶然周也豈得以召誥歩自之周為此步自之周哉放牛歸馬孔傳云華陽桃林非長養牛馬之地欲使自生自死天下不復乗用釋書之童騃可笑未有如此之甚者華陽桃林在王畿千里之内亦民居之井廬也放而使之逸則其蹂踐嘉糓者為害既不可勝言而雖以比屋可封之民牛馬在野棄而弗問亦未有不招繫而奄有之者使周民之樸愿至於此極將費誓所云􅀼牛馬者徒非武王之天下周公之國乎假令羣􅇌牛馬於山野之地不待匝月而盡為人有不但人貪牛馬牛馬固依人也人有之而不禁則無主之物人所必争是教之以攘奪也如其禁之則是懸之餌而驅民於阱也且牛隨牛馬隨馬以至於人之闌廐必欲􅇌之入山亦奔走其民而日不給矣况乎欲示銷兵則當自兵甲始兵甲之用唯以資戰而他無所庸不如馬之可以駕乘車牛之可以駕收穫之役車而尤可耕也有可他用之牛馬棄之而唯􅂲其死亡之不速無可他用之兵甲何不焚之沈之之為快乎故曰兵㐫器也不曰牛馬㐫器也然且於兵則衅而藏之於甲則櫜而斂之是所云不復用兵者亦以安一時之反側而非謂永不復用也呂氏謂與晉武之去武備唐穆之銷兵不同其説是也而又云但歸放止於伐紂之牛馬而十二閑與邱甸之賦不廢則亦惑於孔氏之狂愚矣伐紂之牛馬豈非十二閑與邱甸之賦乎使王廐不用民賦不取武王何所更得牛馬以成伐紂之軍倘前所取之廐中者棄之而後更責圉人之蕃息則是浪擲固有而别求之其愚已甚前所賦之邱甸者棄之而後更𣲖取於民以補之其殃民不尤酷哉君子敝帷不棄以葬馬也敺盈萬之牛馬蔽塞山谷晝亡與秣夜亡與棲虎狼所噬霜雪所侵盗所攘食不一年而死亡且盡夫牛馬者固不能如虎豹犀象之耐處山林而仰飼畜於人者也用其力以定天下而與虎豹犀象同其􅇌逺且置之必死之地而不恤焉抑豈君子之所忍乎華山之陽桃林之野其北則漢唐之沙苑也其南則鄧析之壤也固為畜牧之善地孔氏何所見而謂非長養之地耶歸云者歸其所自來廐歸廐甸歸甸也放云者釋之於衡軶之間也馬言歸牛言放者互文也放而弗乘歸之於牧乃在由豐適雒東諸侯朝周之孔道使天下知兵車税駕而紂所與同惡者且置勿討以俟其自新也如其兵之再舉則必取之於廐牧而號令早及於東人往來之道天下亦共知之而非火炎崑岡因𫝑便及之淫威矣至愚者秦銷兵以為金狄而已不及馬也乃以有用之牛馬視之如虺蛇之螫手無可奈何而趣其自死啓戎心召争􅀼勞民害物傷馴致之財貽他日重賦之苦嬴政之所不為晉惠之所能知而謂武王其然乎故曰童騃可笑未有如此説之甚者也攻於後以北血流漂杵北背也背叛也北之正訓本為背叛北方向隂而背陽陽非所宜背者故借北為坎位之方名殷都雖在牧野之北而奔潰之卒𫝑將四散知以北之非以方言也攻於後以北猶春秋書入於戚以叛謂背紂而為周用也朱子以為自相踐蹂則敗軍奔逃方自求免之不暇踐人者既倉皇而幸於得脫為人踐者業已仆而不能攻人漂杵之血何從而有陳氏謂先臨商之平民陳後紂之惡黨民怨之深遂因此反攻之其説是已漂杵本或作鹵楯也軍中無杵臼之用當以漂楯為正杵字从午得聲古或與鹵通漂者血濺而漂之如風吹雨之所漂及先儒謂漂浮而動之説太不經雖億萬人之血亦必散灑於億萬人所仆之地安能成渠而浮物􅁘洪範十有三祀孔安國曰箕子稱祀不忘本孔穎逹因謂此篇非史官叙述乃箕子既對武王退而自撰其事故稱祀夫箕子既不臣周則其陳洪範也亦非樂於自見奈何撰之簡編以侈其訪道之榮乎况業以周之十三年為十三祀則巳奉周正朔矣奉周正朔而加之以商祀之號名不從乎主人既為失實且用其編年而徒愛祀之一字是舍其大而爭其小箕子之義有媿於陶潜甲子之紀也盖此之稱祀者武成所謂政由舊者是已政者名器制度之謂由舊者時所不暇且以安天下之心而非若急於革除以自侈新國者之褊也故列爵惟五雖小改商制而分土惟三一仍商典其改祀為年易用天正定名革制秩禮作樂皆周公之事終武王之世則但除紂之虐而不易湯之典如漢髙帝之沿秦以十月為歲首雖所因之得失不同而其時之不暇與古人存忠厚以敦謙讓義則一也故魯兩生曰禮樂必百年而後興則武王於克商之餘不即易祀稱年亦明矣泰誓之稱年者成王時史官追序之詞也此之稱祀武王時史官記述之文也而豈箕子之以存商也哉隂騭騭牡馬也􅙨牝易牡隂騭云者言隂陽之用也在隂陽之體曰隂陽以隂陽之用施生者曰隂騭天所以大生者一隂一陽之道絪緼而化生者隂之騭之之用五行一隂陽隂陽一五行隂騭下民即五行之居上以統八疇者也八疇以體五行之用而五行實秉二氣之用以用於八疇武王聞道巳夙故知二氣之用必有以協於五行之位而不亂者特於其始終次第對待合得以人贊天上下一揆之理俾人得順其叙以成事者或有疑焉舊已聞箕子之深於其學故自謂不知而問焉隂騭之用二而疇有九則叙立而無缺疇有九而自初一至次九以順而立一九二八三七四六損益於五以合而成五四三八一六七二九以序而行一三五七九二四六八以𩔖而辨則居之協其位者相求相因而倫以叙矣合之而四十五四十隂也五陽也離之而一二三四五六七八九一三五七九陽也二四六八隂也隂有其體而用亦隂陽有其體而用以騭陽别言用而隂即體為用者陽施隂舍之義也九疇統於中五之五行五行統於二氣之隂騭水木土騭也火金隂也水之一火之七木之三金之九土之五騭也其六二八四十隂也則箕子所陳正與武王所問者相得而章也傳註不此之察而曰騭定也既不諧於騭字之本訓抑訓隂為隂用之隂而云天不言而黙定下民則天特不以口言而鼓以雷霆潤以風雨運以日月者天下之色皆天之色天下之聲皆天之聲何嘗韜戢光響暗有所定而使人不得聞乎暗用而故黙之是天可以有言而故不言諺所謂懸羊頭賣狗腿者奚可以此誣天哉史稱西伯隂行善君子謂之誣以有心而近於姦也文王且必無隂用而况於天若徒以無唇舌齒齶之嘵嘵者謂之隂則將以大聲疾呼為陽其益陋矣九疇九疇之叙因于雒書先儒相沿無有謂其不然者夫唯疇不因書則亦可疇不合數乃疇既因書而作則疇之叙必與書之數相叶而滅裂本數多寡之實相生之序相得之合以至執河圖之中為雒書之中曰以其一居數始而為初一乃至以其九居數終而為次九豈非格物窮理之有未至乎以履一為五行則失自此始矣天地之道一本而萬殊殊則不可合為一矣合萬於一者釋氏之言也萬不可合而為一則二亦不可合而為一萬亦殊二亦殊也凡物皆然而莫甚於五行今乃合水火木金土為一冶而函之於雒書履一之中其不相爭而相息者無㡬矣豈此一者即太極之未分隂陽者乎而又何滯於所履之一方况其自隂陽而五行業與太極之未分者差之三絫乎隂陽之於五行一父母也生者父成者母也方其未生則父與母二也及其既生則業已五譬如子之有兄弟形體分而性情異不可復一豈待言哉且自春木夏火長夏土秋金冬水在天之五行言之則尚為一貫之緒今一水二火三木四金五土因生者之多寡以為所生者㣲著之序則才各别位各建其五而非一尤不可誣已且雒書之居於後而曰履履者履於實也後者成也是成性以後而非天人授受之始也五行者天以化而人以生固非可履者也以履為初既無當於理數乃無專隔三位而以右肩之二為次二顧曰二位在坤其數則火氣之著也稟形賦色妙合而凝夫水火相息而不相養以水火之妙合為凝者丹家之言也且右肩之去履非父子之相承非夫妻之相配非兄弟之相踵偏正異地左右不均而火不位離反位乎坤方則七月序則十月徒析河圗以附㑹雒書而不相就其失甚矣河圖之數以大衍為父隂陽為君故五十極隂陽之盛居中以生成夫水火木金之四位雒書之數以隂陽為父母五行為材故五位因五行之各立以居中而順生八疇隂陽為五行之母而五為天五十為地十故可分配東西南北之四維使水火木金分取以奠位五行既有而行於人事則不待離中而更分他位則一九三七二四六八隨一位而五行皆全在焉猶夫河圖之隨一位而皆有隂陽爾安得復分為水火木金生成之位又况二在坤而為火四在巽而為金六在乾而為水七在兑而為火九在離而為金位數乖離漫不成理者乎五行五而不可一天之不容合也聖人之所不敢汨也皇極一而不可五人之必致夫一也勿貳以二勿參以三德二三罔不凶而况可得而五之且使以履一為初一乃至戴九為次九則但列一二三四五六七八九之目而疇在矣雒未出書之先豈大禹不知有此數而何以必待天錫􅁘二之為五事八之為庶徴四之為五紀要皆無徴而不足信未有智如神禹苟且師心不則於天錫之象如世所列條約隨意以為初為次之理箕子亦何所傳武王亦何用訪此也哉書之言曰惟天隂騭下民言五行之所自生因二氣之用也曰相協厥居言五行之上生六七八九下生一二三四相得以成十而五行各以偶建裒多益寡居之所由協也曰􅂜倫攸叙言初一次二至於次九順相因之次序周回而不躐等也曰汨陳其五行言不知五行之􅄐而合損而益序而行合而得以為八疇之叙也五行者二氣之有迹者也疇始於五行而不及二氣者敦人事以著隂騭之用畧天道而聽隂陽之化禹之所以就人心而凝道心也五行之化為水火木金土者天之所以生人繼善者也五行之徳為仁義禮知信者人之所得於天成性者也八疇之用要以五常為本而居中以應乎事為之損有餘益不足使相得而合乎中一九二八三七四六俛處而受中五之裁成則仁不失制義不賊恩禮不愚智不蕩而信不為小諒也故疇以五行中而不以皇極中盡仁義禮智信之性以立天下之大本而不執一以為中使亢而或悔也以五行中者以五行始而居中者五行本天以治人居上以治下雒書出於龜背中央隆而四旁是故居中髙以為上而為初一上以制治下以稟法制治者為初禀法者為次是故五以上而初一易之自下上者以人迓天也疇之自上下者以天治人也易以數數積少以至多疇以象𧰼統全而分異若夫皇極則君之極也五常麗乎君臣父子昆弟夫婦朋友而君極其一也統雖貴而為君道雖至而為極要亦五行貴治賤賢治不肖之一理本王相之化而建諸好惡之情者也五行之理擇而建之則皇極故五行足統皇極而五行之化非因皇之有極而始有則皇極非中而五行非偏固矣皇極之取數一者非水之生數也五行偶化損以施於戴九之餘也其𧰼在龜之後後者北也王者居幽嚮明南靣而治天下之𧰼也極者屋之棟也天之北辰也北辰以少統衆而位於子故一居子位而為七疇之所拱下棟上宇棟履乎地之實以仰戴夫宇一履於下以上載夫五行履之實履之信居之幽居之約也是故皇極為履一亡疑也則五行之為中五亦亡疑也舊説之苟簡滅裂者不一而其誤之大者莫大於五行皇極之互易其位若七疇之或合或不合要其合者亦出於偶合而於數無徴總之其誤以一為初一二為次二而不復顧雒書之位蔡氏皇極九九之數亦其緣此而失焉今為攷正雒書洪範九宮九疇理數之符順行之序相得之合隂陽竒偶之故為圖如右俾得覧焉一五行中土東木南火西金北水也龜背隆中而殺外以髙者為初故從中宫始五行隂陽之殊而未合為人者也故居初一二五事視一聽二言三貎四視思明聽思聰言思從貎思恭思以行乎四者四者皆有思也故書數四而範用五法天左旋由中宮五行順左而嚮前左五行為道五事為器道陽而器隂故五明而中四暗而偏三八政司空一司徒二司冦三司空治地利統食貨司徒治教民統祀賓司冦治刑統師王制之所謂三官也用八而統於三以三而治五也左前順下次正左四五紀一歲二日三月四星辰五春六夏七秋八冬歲者閏餘所成也星辰者五星之周復於十二次也四時者厯數也厯以十二中為數分十二中為四時以迎四氣故五曰厯數其分四也此合為五紀而分為八也順正左嚮後次左後八政人事五紀神用人陽而神隂故三明而正八暗而偏五皇極皇大也君也大哉君極以修五事治八政詧五紀者也以宣三德合稽疑召庶徴行福極者也居幽嚮明主一治衆止其所以待動子曰譬如北辰居其所而衆星共之此之謂也艮上之一易處乎後者夏道用艮以疇用易也聖人所以洗心退藏於宻也六三徳平康一髙明二沈潛三正直四柔克五剛克六質德三得於天也文德三得於教也以文造質性三而合教為六也彊弗友燮友氣之偏者不可以為徳其克之者則與髙明沈潛同功故德六而無八也皇極道也三徳徳也道陽而徳隂道顯而徳藏故一明而正六暗而偏三徳之教修於五事五事脩則三徳成矣故四六合而十七稽疑一雨二霽三蒙四驛五克六貞七悔卜五隂陽之兆於五行也占二五行之联於二氣也左人事右天道故八政左而稽疑右稽疑者稽八政之所疑也故三七合而十八庶徴休徴一咎徴二徴有庶而不出於恒與時也稽疑以象告庶徴以形告在天成象陽也在地成形隂也故七明而正二暗而偏五紀之順逆生庶徴之休咎庶徴之省以歳月日時星故二八合而十九五福六極一壽二富三康寧四考終命攸好徳者四福之本也五凶短折六疾七憂八貧九弱惡者五極之本也故福極十一而嚮與威之用九攸好德者莫之嚮而好惡者非有威之使惡而固惡也庶徴之事隠五福六極之事顯隱隂也顯陽也故九居上而明上者君道也皇極體也福極用也皇極之用錫福錫辜福極之本嚮以明好威以明惡好惡斂於皇極而嚮威顯於福極矣故一九合而十左旋至於前而一周刑賞者王道之末務故曰聲色之於以化民末也五常之用至刑賞而無餘五刑之施至刑賞而已泰也前者午位也午者人之承天之位也人君南􅆕而行刑賞人事備天道浹也土爰稼穡曰之為言于也爰之為言亦于也爾雅粤於爰曰也詩曰歸曰歸猶言於歸也書爰立作相猶言曰立也蔡氏謂不曰曰而曰爰非所以名也乃四行之言曰者又豈以名其體哉潤下者非徒水水亦非獨潤下也炎上非徒火火亦非徒炎上也珠亦潤而汞亦下日亦炎而草木之芽亦上也水流而不滯亦旁行而曲火外景而明亦麗木而革也曲直者非徒木木亦非徒曲直從革者非徒金金亦非徒從革也角亦可曲而骨亦可直玉亦可從而泥亦可革也木生旁逹而長以柔實金堅能不散而恒能不腐也然則土之非徒稼穡而稼穡之並資水木而非徒以土與彼四行又何别焉要此五行之情致用於人者言之而非紀其本體故曰曰曰爰曰之與爰皆于也于猶往也往而行其情於人也水性智也火性禮也木性仁也金性義也水體濕也火體燥也木體柔也金體剛也蔡氏以潤下炎上曲直從革為水火木金之性既誤以情之致用者為性之居體者又曰稼穡非所以名土則曲直其可以名木從革其可以名金乎水火木金土斯即名矣過以往更無名矣何必於曰爰之間區區為分同異哉鹹苦酸辛甘五行本無適味如木則五味俱有栗與澤㵼味鹹之𩔖土金無味火不可入口不得名味水之鹹者亦惟海及鹺池鹽井而已經文本云潤下作鹹云云不言水鹹火苦木酸金辛土甘也盖自其一定者而言之則天下之物無有正味油入目則澀入口則滑中毒嚼生豆而不辛病熱者食􅁡而苦有疳積者嚼土炭而甜奚况蓼蟲之甘人所辛牛馬之吐人所茹乎是故五味者合於人之舌與臟而見以為鹹苦酸辛甘爾有所合者必因乎動人動以欲五行動以情潤下炎上曲直從革稼穡者情也作者動也作動以變而五味生焉水不鹹而潤下者鹹可煮為鹽者水之潤下者也牛馬所飲非鹹水而溲渤可煮為硝者釀之潤而出以下也火不苦而炎上者苦芩連梔蘖之屬其性速亦炎上之性也王宇泰以芩蘖為北方之味不逹於太陽寒水之義木不酸而曲直者酸一曲一直拂其性則生意菀腐而成酸也金不辛而從革者辛聽命者非所樂改革者違所安非所樂違所安則氣躁發而螫人順其性則辛失故薑與半夏相得不强從不相革而兩俱不辛也土不甘而稼穡者甘資乎水木養其長成其收以和而成也今桃李之酸澀者再三移之則甘稼所作也果之未熟者不甘而熟乃甘穡所作也釀花為􅁡煮蘖為飴皆此義也經文次叙甚明先儒謂金刃傷人則辛痛兩木相擦則齒酸不知木石所擊破肌理者辛痛無異於金以兩金石之器相擦齒亦為之酸而豈必木􅁘况五味本從舌出而豈肌與齒之得與哉窮理者正不宜如是五紀歲者天之行也三百六十五日四分日之一為一歲計行三百六十六周天又一千二百分度之三百七十五粗率如此月者月之㑹也一月二十九日一千五百三十九分日之八百一十七分而月與日㑹此用三統厯法亦粗率也日者日之周也一日而恰一度一歲而一周天此用厯家倒算法星者五緯星也所以知非言經星者經星之行即天行也天行不可知西厯云有宗動天以經星所行者為天度也辰者五星所伏見小周伏合之次也厯數者春夏秋冬木火土金水分王之數也厯家所謂求冬至術求土王術求八節求中部之算是也其法以天行為歲而四分之而歲差之實六十七年而差一度郭守敬推則天行之贏數也以九十一日千二百分日之三百七十五為一時如三統厯則九十一日千五百三十九分日之四百八十一諸家不同大率亦相去不逺也而又有氣盈之一日零九萬五千分日之五萬二千八百七十五則贏于日行之數也以三月而成一時而既有氣盈又有朔虚則贏於月行之數也若五星之氣謂五行分為四序每時土王者十八日千五百三十九分日之四百四而五行之氣不因於五緯則四時之不可以星推者也十二辰為十二月之􅄤次而以天正冬至為始起於冬至而終於大雪若四時之厯數則以立春為始大寒為中則四時之不可辰求者也故歲月日星之外必加之以時而厯數乃成此庶徴以歲月日時星分省而時有四則與歲月日星之四者相並成八而當雒書左後之八也古者分象命官各司其一歲官統歲差厯元月官統朒朓日官統薄蝕星官統伏見復合四時之官各統其氣之應候之至與其晷影此五紀之以人紀天者也月先於日者以右轉言之天疾於月月疾於日日疾於五緯也以積言之積辰得日積日得月積月得歲也十二次在一歲為十二月而在一日則子半日在大梁亥半日在實沈冬至為正也厯一也而五分之紀所以分其合厯數四也而一紀之相授受而合其分也故亦五亦八而紀定矣惟辟作福至民用僭忒按上文所言克者當從朱子說人之資質沈潛者當以剛治之髙明者當以柔治之為勝盖皇極言作君之治而此言作師之教也君道盡而師道興故三徳次皇極皇極以嚮威行好惡故一合九三徳以五事為克治故六合四此疇既專言教則威福玉食之言不相為倫反覆求之盖錯簡也惟辟作福當在以為天下王之下皇極一章凡兩用曰字皆引伸上義而廣之也曰皇極之敷言云云者言凡皇極之彝訓君上承於天則順於天民上承於君則順於君君承天君弗敢違訓民承君民弗敢違訓則無有僭忒而近天子之光也曰天子作民父母為天下王惟辟作福惟辟作威云云者言君履道居尊乗權而無所可假故直當以王天下之任自重而作民父非以偏私於臣則威福玉食弗有疑畏而以讓於臣也臣者民之所視人用側頗僻則民亦不訓於君而僭忒矣兩段文字皆以曰字起義申衍上凡厥庶民惟皇作極凡厥正人歸其有極之義盖皇極之數一而居於北辰之所一以統萬民之所以訓之若帝一孤尊而無偶臣之所以不得分其威福也條理井然其為錯簡可知不然則威福玉食既非正直剛克柔克之事文義不屬而上章言曰天子作民父母為天下王亦歇後語而不足以終皇極一章之文也玉食諸家註䟽於玉字俱未攷覈但云美食則孔子之食精膾細豈亦僭惟辟之食乎食無恒味適口為美古重八珍然亦士大夫之所公食也天子之食特多太牢酒醴醯醬脯脩稻梁則亦與下等按周禮玉府王齊則供食玉鄭司農衆云王齊當食玉屑鄭康成云玉是陽精之純者食之以禦水氣唯天子之齊則有之然則玉食者碾玉為屑以供王之齊食取其貴而非取其美或疑玉剛堅刺齒則亦如服藥然非必飽餐之也唯王為有公侯而下不得與焉惟辟玉食之謂已今世俗呼白粲為玉食既鄙陋可笑而操觚家有玉食萬方之云真不知其何等語也衍忒衍之為推于義未盡衍者引伸而習知之也易云大衍斯其義也朱子謂忒變也卜之經兆百有二十其變千有二百體色墨折方功義弓之𩔖筮之變老少隂陽八為六十四六十四為四千九十六之𩔖其説較之蔡氏為得蔡氏云推人事之過差則卜筮者以攷吉凶得失而非以推人事之有過無過善惡者人謀之所得而推而不以聽之鬼謀也但龜之為兆其象雖煩而定于一灼不復有變象而不數則無往不象而不可以過差言也則衍忒之文專承占用二而言而非兼謂卜也忒過也差也過揲之七八九六于歸竒之差而見也揲以四數其餘有一二三四者過乎數者也引伸其所忒以求七八九六之正而貞悔以知焉朱子啟蒙特發歸竒之數盖亦用衍忒之術過揲之七八九六以為二十八三十二三十六二十四合乎揲者正也據正而數之則煩難而或以分筮者之心其忒乎揲之一二三四而為十三十七二十一二十五衍之以知七八九六之老少隂陽則簡易而筮人之視聽得以專壹神事尚簡故衍其忒以知揲而不必詳數其揲筮術也卜則無定象而亦何忒不忒之有故知衍忒之專為占言也日月之行四句日月之行有冬有夏舉二至以該一歲言歲之統日月也由日之行南牛北井積以為三道則北極東井退而南南極牽牛退而北冬至之月行夏至之日道夏至之月行冬至之日道往復相積而歲成故王省惟歲卿月尹日雖各分休咎之應乃日有咎而不終月月有咎而不終歲則其徴為王乎為卿尹乎故此言日月積而因以有歲以明卿尹之得失積而為王則咎終一歲固專責之王而卿尹不與而一月之咎一日之咎雖為卿尹之咎而王不得辭其責也盖卿尹之得失惟王之表帥而一卿一尹之不臧亦王政之闕猶一月一日之咎徴皆歲功之忒也卿尹所治而皆以成王政日月之行而於以有冬夏其義一矣月之從星則以風雨者月以㑹日為朔月統日卿統尹也月隂也雨亦隂也臣民皆隂象也雨者風之反風所以限雨者也諺云月如彎弓少雨多風月如仰瓦不求自下風多則雨少矣畢為天街北胡南越其中則正中國也孟秋之月畢以旦中則夏初夜半中冬初日午中春初薄暮中與此土四孟之氣相應而其入地之中恒反此焉故隂離畢則下施於此土而雨其相差一百五十度而為箕則隂氣行乎他方彼雨而此風矣畢之值為心不于心而于箕雨者九道之所歴則然也從者由也如言風從東來之從非隨從之從言月之取道從畢從箕而行也盖臣之於民上下分定而星經月緯月非隨星也月行于星卿尹行於民月行乎星則風雨應卿尹行乎民則治亂應言民之怨咨和樂有可以感召休咎之事而實惟卿士之所施被者使之為怨為和故不於民省而惟於卿省猶星雖有好風好雨之殊然必月從之而其好惡乃行星力㣲而受氣於月也於某歲某月某日有休有咎則謹司其歲月日之異以警君臣而修徳若星之一日一周天分為十二次不復考之於十二時以當二十㝛羣星之所舍而責之於民此古占驗之所為不鑿而不細也其與後世風􅊁之小術不同矣蔡傳殊未清通朱子之說其以經歴解從字者甚善而云箕簸揚而鼓風畢漉魚汁水淋漓而下乃星家形似之言朱子誤聽而不揆之以理也孔穎逹東木西金之説亦附㑹而無實旅􅋙九夷八蠻傳註皆云九八言其非一今按論語稱九夷而朱子謂八蠻今猶云然則實種𩔖有其九八不但以弗一言也夷狄之并兼分析不恒固不可執今以論古乃見之魯論者在昭定之世固自與周初相同而職方言四夷爾雅言六蠻則統九于四統八于六部領族也九夷之名見於後漢書者曰畎夷于夷方夷黃夷白夷赤夷𤣥夷風夷陽夷乃范􅁮所紀一本之竹書夏后氏來貢之夷而虞書有嵎夷薛氏曰今登州之地禹貢有萊夷顔師古曰萊山之夷即今萊州汲冡書有良夷孔晁曰良夷者樂浪之夷左傳記紀人伐夷杜預云在城陽壯武縣又淮夷病杞范􅁮云殷衰東夷復盛分遷淮岱則淮北海東日炤安東贛榆之地北迤青沂放乎登萊皆古之所謂夷也乃禹貢揚州亦有島夷則淮南江介金山崇明亦古之夷地而春秋所紀牟介根牟郳葛皆為夷之附庸要其始皆九夷之部而後以分也但攷其為地則青徐沿海之濱而非漢書所紀三韓扶婁濊貊夫餘之逺也若八蠻之别他無所攷要在三代時荆梁揚三州之人近山者皆謂之蠻王㑹解云蠻播之翟播今播州倉吾翡翠倉吾即蒼梧魚復鼓鍾魚復今巫山長沙鼈西至蜀南至粤皆蠻也不僅武陵之西苖犵之種也左傳記盧戎杜預云盧戎南蠻又庸人率羣蠻以叛楚則鄖均内鄉淅川金房之間統為八蠻之地傳又稱楚人襲梁今汝州收霍汝州之霍陽山以困蠻氏是楚塞之北内方之南亦蠻部也經云惟克商遂通道于九夷八蠻原文王之時西北之命令已北行於狄西行於戎所以經文不及戎而九夷在商郊之東舊阻而未達南蠻之在庸濮以西者雖已歸化其魚復之外江沱之南漢汝之間未盡入周之職貢故汝墳之詩且聽命於如燬之王室迨克商而後改道西嚮無不絡繹於闗中矣道通則旅達矣旅達則貢咸致矣旅云者賓旅之謂也中國備禮則謂之賓蠻夷不備禮則謂之旅西旅云者猶言南賓北鄉之謂也八蠻自商雒取道九夷從殽函取道皆西嚮而旅進於宗周以致貢其獒焉此獒之貢實自東來而不自西來也篇名旅獒者猶言貢獒乃傳註不察於此以西旅為西方蠻夷之國名不知西方安得有蠻有夷而未克商以前西土已無不通之道既克商以後武王自商歸豐又未嘗有從事西陲之役則唯克商而通道於東南惟東南道通而貢獒者乃西旅於事文兩順不然則史氏當於西旅底貢之上宜言通道於戎而不當云通道於蠻夷如必違心而謂西方有蠻夷或誣古人之隨意立名一如今人之不通謂戎夷之可以互稱其又何以繫之克商之下而曰遂􅁘詳繹本文西旅之非國名奚待辨哉金縢穆卜金縢一篇其可疑者不一惟朱子亦云有非人情者情所不協必理所不出也而今為臚辨之如右方武王遘疾厲虐世子㓜則君國之憂周公所恤亦二公所同也二公曰我其為王穆卜亦臣子情義之各致周公何用辭二公而自以為功此其可疑者一也如蔡氏所云二公卜則必禱於廟廷上下宣騰而人心摇動乃周公之卜為壇為墠諸史百執在列則在廷之人無不知者使卜於廷而廷臣知之百姓尚未必知也今曰公歸乃納冊則此壇墠必在國門之外除墠築壇騶馭戒道其為宣騰摇動豈不甚哉且武王之疾既篤輟朝召醫誰不知者乃徒以一卜為疑將誰揜乎此其可疑者二也且使欲閟之以安人心􅁘二公之賢非不足與語者此意亦何妨明告之乃曰未可以戚我先王舍其憂國之誠不以盡布腹心而所云未可戚先王者迨夫屏璧與珪之言出而為戚滋甚則當其陳詞之際何以踐不戚之言上欺先王而下欺同心同徳之友公亦何事為此詐諼以自昧其夙昔乎此其可疑者三也禮去祖為壇去壇為墠以奉巳祧之逺祖有禱則祭無禱則止親踈之殺所自别也今文王考也王季顯考也太王祖考也以廟食之親不告於廟而禱於壇是之親而致踈之矣豈周公以野祭脅先王而徼其必聽乎於禮為忒於情為逆此其可疑者四也事先之禮以西嚮為尊葢無往而不然南陽也北隂也人鬼以幽為尚其異於天神者也今三壇南面而周公北面亂隂陽淆人神此其可疑者五也禮之有昭穆以别父子之嫌也今以圭璧有事於先王雖在造次倫不可亂則太王西嚮王季昭文王穆亦其一定而不可易者乃三壇同墠父子祖孫並列於南面草野倨侮而神固不安此其可疑者六也卜筮之禮以邦事作龜之八命其八曰瘳有恒命也卜非祈祈非卜祈則請命於天神地􅅘人鬼而卜則于龜之靈今使周公而卜焉則所命者龜也其詞曰假爾泰龜有常或曰無有近悔而已三王非主乎龜者則亦何用告之而况於用玉使周公而祈焉以祖則宜用造禮以三王同事則宜用禬禮觀其陳詞以責三王則宜用說禮未聞有且祈且卜之禮也且祈且卜凟神無經舍所宜命之泰龜而問之不預吉凶之人鬼卜亦何由告之此其可疑者七也人鬼之玉天子用圭瓉公侯用璋瓉至於諸公所執之桓圭則以宗覲㑹同於王也今云秉圭其為圭瓉乎為桓圭乎使如孔氏所云桓圭則是以䞇人者事鬼而不智也倘其為圭瓉也則僭天子而不仁也若夫璧者所以祀日月星辰者也秦人沈璧於河盖周衰禮壊之所為且亦以告山川而不以奉祖考植之三王之壇尤為非物且造禬之禮牲幣也攻説則但幣也若卜則玉幣牲醴皆所不用緣卜者以迓幽明㡬介之爽於無方無體之神莫適主而無所可致則亦以質告而已矣今牲幣不將而用玉為祈為卜無之而可此其可疑者八也大祝掌六祝之辭六曰筴祝筴祝逺罪疾者也今欲為王逺疾故用冊祝冊亦筴也而筴祝之辭大祝所掌非史之所司如以卜也則大祝視墨而已命龜者卜人也以卜則不使卜人為命以祈則不使大祝為辭而以屬之史何􅁘且武王之世太史則史佚也是與太公召公同心以輔王室者也周公何所忌於二公而欺之何所暱於史佚而與宻謀且丁寕之而使共欺二公乎此其可疑者九也卜筮之休咎繫幣以比其命者占人之職歲終則計其占之中否杜子春謂以帛書其占繫之於龜鄭氏謂書其命龜之事及兆則金縢之書當掌之占人公乃以屬之史而亂其官守豈史為公之私人可相託以紿二公乎此其可疑者十也諸史百執之對曰公命我勿敢言孔氏謂周公使我勿道蔡氏斷公命為句意以公無事於秘密而非王莽之詭秘所得託其説於理為近但非公有命而有司亦何為其不敢言􅁘或公雖未囑有司以共秘而有司之見公弗言因以不敢言則公之始止二公穆卜者既以安動摇之人心則既得􅁻卜體王無害矣自應昌言於廷以慰憂疑豈公所云予小子新命於三王云云者猶且附耳密語百執諸史而唯􅂲二公之或聞者又為何心將以前者未可戚先王之語言猶在耳而狙詐以不使二公分憂國之功者翻雲覆雨無顔以復告之二公乎則又小人技窮而怙過之奸狀公以忠孝大節天日可質之心抑何苦而為此藏頭露尾之態􅁘且金縢既啟之後彼二公者能不愈疑公之隂險而相待以薄哉此其可疑者十一也王執書以泣曰昔公勤勞王家惟予冲人弗及知夫公之大勲純忠效於王家者豈但金縢之數語區區一身代之詞情至者能為之不待公也成王即早涉不慧待言而後寤而鴟鴞一詩哀鳴淋漓較此筴詞感愴百倍乃昧於彼而欲誚者胡為信於此而遂泣也此其可疑者十二也蔡氏曰周公之卜二公未必不知冊祝之文二公盖不知也身代之語亦偶然情至不得已之極思耳公不諱卜則此區區之言抑何足隐哉且使二公早無疑於公則雖素所未知自可一見而信何事問之諸史百執而唯􅂲其為諼如其疑也則前云未可戚先王而背二公以私卜者為詐已窮保非並賣此諸史百執而故為是書者乎且懿親元老之肝膽不保區區史執之一言其安知非受賂而黨奸乎疑大臣而察於有司疑君子而問之小人此庸主姦相之以敗亡其國者而二公何為其然况為流言者曰公將不利於孺子非謂不忠於武王也則此冊詞可以信公之忠於武王而不可以信公之忠於孺子即以管蔡之惡亦且成於武王既崩之後則前日身代之言不足以為後日解胡為乎金縢未啟之前鬼車滿載金縢一啟之後隂曀咸消將公生平至德元功曾不如此兒女陳情之一冊乎此其可疑者十三也羣疑所聚有心有目者所共知其得存於既刪之餘者盖孔子以節取之而為著居東作詩雷雨反風之實以見公忠而見謗之苦𠂻與周初王室多故之蹟其出自史臣文勝之傳聞者亦以連章而無以施其芟割則存乎後人之善論也孟子於武成取二三䇿而不信其餘曰盡信書則不如無書可為讀金縢者之一法居東居者閒處而無所作之謂經言居東則其非討殷可知故金縢繫大誥之前以此知古註謂我之弗辟為致辟者不如馬鄭言辟之當也特所云東者未目言何地唯鄭康成以為東都東都者雒也地正值宗周之東而時未營雒不得言都故但曰東在詩則曰東山東山者山之東也豐鎬與雒在太華之西一在熊耳之西雖地分雍豫而山相櫛比雒雖平壤而北有虎牢南有嵩少則亦山中也周公之於此而居雒者東盖周公之國邑也伯禽之封於魯以侯服嗣周公為小宗者也周公之封於周君陳繼之而傳於周公孔周公閲者以别子為大宗者也其先食邑在岐之周原而克商以後與召公分陜周公東而召公西各有國邑以主其方之諸侯則周公故邑於雒東至此以避謗故罷相而即於陜東則赤舄衮衣自行其治陜之事於其邑内不攝政而外亦未嘗用兵也或雒本周公之封其後以致於王而營為東都周公縣内之封又他徙焉雖無可具攷而康成之言亦必有所受之矣詩稱􅇼豆有踐則在國而行饗祀之禮其曰我公則東人固以為君以此知居東之為致政歸國避謗而非致辟音璧也亦明矣天乃雨反風反風禾起朱子以為怪異盖風能偃禾不能起禾其故然也金縢之文雖多難信然不應如此無理之尤盖前云秋大熟未穫大雷電以風禾盡偃者其時則周之秋大􅍄者稼之善而要未成實也若其成實而可穫則偃不害穫不必起矣雷電以風不雨而徒風也風而不雨雷電空作則黍稷之稼燥而偃也偃則實不可以成故邦人為之大􅂲今之乃雨反風者風反而後雨降也云乃雨則前之不雨可知是則前之風為旱風而今之風為夾雨之風反風以得雨則禾以潤其燥而起立矣禾起而後實以成也故曰歲乃大熟也然則前之言大熟逆億其可以熟而未熟也後之云大熟者乃果熟也未穫者未可穫也稼而未穡也禾之偃風偃之也其起雨起之也不然則安得有從泉壤而出之風以起既仆之禾哉金縢文理多互相糾繆讀者以意迎之可耳尚書稗䟽卷四上欽定四庫全書尚書稗䟽卷四下岳州王夫之撰大誥大誥多邦在國而播命曰誥臨事而申戒曰誓大誥之作盖周師未出而邦君庶士有疑於行因作此以告用兵之期故不揚文武之徳不數武庚之罪不懸賞罰不戒進止朱子疑其詞緩不切不知此特為誥後且有誓誓逸而誥存也先儒多以絀殷之舉為成王親行盖未察大誥為王在國播告之文耳竹書記成王二年迎周公於郊遂伐殷五年春王在奄夏五月王至自奄則亦襲編書之次序而訛也且竹書於四年正月記初朝於廟盖謂三年滅殷因以伐奄不克而歸四年夏始復伐之是以周公未歸政之先成王兩至東國也今按成王方在㓜冲周公攝政凡郊饗覲㑹之事公且代焉况千里東征其敢令冲人嘗試哉則誥者王而行者實公耳成王之初周公東行者凡再其始以避相位而居雒王迎而歸則我徂東山之詩是也罪人未得公歸無期故曰慆慆不歸其云行枚者君行師從卿行旅從也居東二年罪人斯得於後乃作鴟鴞之詩而王仍未悟則金縢所云秋大熟者作詩之後三年秋也故東山之詩曰于今三年以其時則𤓰苦在栗薪之上盖秋杪矣其以迎公西歸為二年事者誤承居東二年之文而不知金縢固有於後之語也三年秋公歸復攝政而後二叔以流言之不行疑怨益深始挾武庚以叛故書序曰周公相成王將絀殷則是公復入相乃有絀殷之役而曰公相王將絀殷則絀殷者公行而未行從可知巳公以三年秋歸相乃以明年東征則破斧之詩是也其詩曰四國是皇而鄭箋亦云周公既反攝政東伐此四國故曰周公東征而不曰王也若如竹書所記王迎公而遂共東行則於時武庚未叛詎為禍誥何以云越兹蠢且公席未安遽偕王而東是怒不旋踵挾王以急報其怨速取兵權以自張而不顧國之未靖公其將如劉裕之伐慕容超􅁘况大誥之作作於宗周則安得有迎公遂伐之事哉誥云予惟以爾庶邦于伐云予翼以于云肆朕誕以爾東征言予言朕者命自王出則以者固王以也王命公以之實王以也能左右之曰以不必躬行之辭也若多士所云朕來自奄則武庚已滅二叔巳刑之後而奄復叛時周公雖未歸政而成王年益長國勢益安且奄以小冦無助其凶燄不如殷孽三監之摇動天下則奉王而行可以無憂而公之大勲巳著於東征則向者阻行之考翼亦無容疑畏而聽公之偕王以行矣王之踐奄自在六年之夏王歸遂遷殷民於雒而營雒之事以起其明年春召公因行相宅此書之始終厯然可攷者也多方云惟五月丁亥王來自奄與多士所云昔朕來自奄者同為一事次書者先多士而後多方編殘簡脱之餘其次序自不可泥孔氏死守僅存之編次乃云周公歸政之明年淮夷奄又叛魯征淮夷作費誓王親征奄滅其國其為踈謬班然可曉而蔡氏信之亦同於鹵莽多方曰我惟大降爾四國命又曰今爾尚宅爾宅畋爾田皆初告之之詞多士曰昔朕來自奄大降爾四國民命又曰予惟時命有申又曰爾乃尚有爾土爾乃尚寧幹止今尚之尚庶㡬也乃尚之尚猶也則皆申告之語詞意相仍先後呼應是多方前而多士後審矣則成王之踐奄惟在六年之夏而三年絀殷但命公往不得以昔來自奄為三年事而謂王親行也周之於奄也一伐而遂滅之未嘗再舉滅奄則公奉王以親征絀殷則王命公以帥師見於詩書者甚為著明史記古史邵子皇極經世皆可佐證而蔡仲之命亦云惟周公位冢宰正百工乃致辟管叔亦見致辟者公位冢宰之後奉命以行矣至於費誓序云徐夷竝興東郊不開自别為一事孔氏以合於踐奄之役其謬尤甚奄在今曲阜縣盖即魯之國都成王六年踐奄遷其君于薄姑今􅀶興縣奄滅而後以其地封伯禽奄之未亡未有魯也祝鮀之言曰因商奄之民以封魯則有魯而無奄明矣成王踐奄固因之而伐淮夷奄滅而淮夷未滅奄非夷夷非奄也奄在曲阜淮夷則在淮北春秋稱淮夷病杞迨魯僖公世而尚有淮夷其非已滅之奄可知淮夷者濱淮北而處淮水自安東入海淮夷之地盖在徐州之東沂莒之南海州贛榆日炤之境故與膠宻相近而病杞其去奄也有汲泗沂汶之隔凡數百里故魯公征之道出自費因誓於費而序云東郊不開則夷在魯東而非即夷較若指掌何孔氏之懵然不詧􅁘費誓之役禮有明文曽子問所云三年之䘮金革之事無辟魯公伯禽有為為之者是也則是周公既薨伯禽服䘮徐淮交侵因往禦之其與成王踐奄相去十六七年必不可扭合為一元吳澄不通書以説禮而謂伯禽居武王之䘮不知周公東歸之時武王之䘮已除而記言周公抗世子法於伯禽則成王初年伯禽尚在宗周安得遽即魯而稱公且使武王之服未除則成王周公之絀殷伐奄皆不避金革老耼孔子嘗稱成王有為為之胡為其但言魯公乎則澄之孤陋昬迷為塾師而不足者也孟子言周公相武王誅紂伐奄要以終舉周公之相業而立言之㫖非以紀事則櫽括成文實則相武伐紂相成伐奄陳師凱乃云武王亦嘗伐奄而謂奄凡三叛周凡三伐則不達孟子之文而顯背武成一戎衣偃武修文之義宋元之世所謂儒者大抵如是世遷人降固不足論也今詳攷經傳折𠂻事理則周公奉王命而東征三監在居東既歸之明年以王命大誥於宗周而後行公奉成王征奄在營雒之前一年還自奄而作多方其明年營雒已訖周公至雒而作多士迨成二十一年周公薨䘮未除淮夷徐戎竝興伯禽征之而費誓奄唯一叛在殷亡之後成王凡一伐奄而即滅之費誓之歲去大誥之歲十八年去伐奄之歲十六年先後較若列眉伐奄王自行絀殷周公行征徐戎則周公薨而伯禽行亦顯然其無可混也小腆孔傳云殷後小腆腆之禄父則腆腆亦為不足之詞説文云膳腆腆多也則古有腆腆之語盖謂𤨏屑猥多如殽饌之繁也春秋傳言不腆皆謂不能多有而蔡氏曰腆厚也則失其義矣凡幣言不腆尚可釋為不厚賦言不厚則車徒亦何以為厚􅁘况此言小腆明為猥𤨏羣聚之討若武庚之黨而能厚則大康之一成一旅矣矧小厚相連以為詞又其不成文理者乎考翼考父也翼猶輔也謂父之輔翼舊人也前云考翼不可征成王斥指武王之舊臣而言也後云考翼其肎曰予有後者謂弗有堂播者父之亞旅也言考者父巳殁之稱蔡氏謂父老敬事者不但不達於下舊人之説且呼他父老為考尤所不可盖東征之役决於往唯周公而武王之舊臣皆不與公同心故昔之流言舉國不能為公辨至此為天變所警二叔之惡巳不可揜雖能釋疑於公而終執已見以與公相異同倡為不可征之論以摇邦君庶士之心故公就其所挾以武王之輔翼自居而以義折之也所以然者湯放桀於南巢之後終不殄桀之裔故武王亦封武庚于故殷武王之舊臣泥於夏商之已事執武庚為先王所建不可用兵之説以隂為營蔡地而公之絀殷以非常人成非常事即在二公亦未免為舊人之言而猶豫且遲回於天命人心之不易故公亦不復與諸考翼爭是非但就大誥邦君御事之中指摇惑之所由興而以棄基之説盡底裏以警告之言使我棄基則今日之阻我征者他日又將責我矣乃以始終執其邪説之必然而消之而民養勸弗救之言變考翼而言民養則正以君臣之分義使不敢公為異同而以勸弗救之言備責而深警之民養也考翼也均為武王之舊臣而或尊之或賤之則以義𩔖相從而異其稱舊註有未悉也微子之命微子㣲子在殷故封於東平之㣲而爵為子商書所謂詔王子出廸者乃出即所封之國也盖當紂之初年㣲子雖受封於㣲而猶居於商邑為商貴戚之卿紂惡既稔不安於廷乃就國於㣲以絶嫌疑而紂亦無庸其妒􅎱泰誓曰剝䘮元良者猶䘮欲速貧之䘮言其失位於王廷也殷爵三等曰侯曰伯曰子始終稱子則㣲子固未嘗失爵林氏所謂遯於􅂽野者謬巳且史稱㣲子抱祭器以歸周林氏既信其然矣使遯於􅂽野則歸周之前將委宗器於草莽而懐寳以處曠野不但理所不可而抑有攘􅀼之憂矣則㣲子初之出廸自退處於其國迨武王克商諸侯咸賓而㣲子亦至時武庚尚守殷祧則㣲子於周初亦仍國於㣲而未改也商之宗器在殷而不在㣲㣲子僻處東平亦何從抱之歸周哉伐紂之師不按微境諸侯之歸周者不但微子又何面縛銜璧如逄伯之云􅁘况其面縛牽羊語自相悖有如楊用修四手之笑者乎紂雖亡而微子之侯封如故武庚未絀而微子之於微也自如東征巳克殷祀再墮微子乃由殷之子而進爵為周之公自東平之㣲而徙國於睢陽之宋吳澄之説盖亦近是特其所謂即微子已封之宋國建之為上公則讀樂記不審之過也盖樂記所云武王下車投殷之後於宋者非㣲子也實武庚也宋云朝歌不三百里固在殷千里之畿内武王伐紂既分殷畿北邶南鄘而東衞武庚自千里之圻降而就百里之侯服而妹土巳分三叔則武庚之封非宋而何武庚以宋而為殷後㣲子自守東平迨武庚滅而後成王以武庚之地改封㣲子自子而進爵為公故曰建爾於上公自微而遷於宋故曰尹兹東夏經文自明無容疑矣古史記武王禮微子使復其所者復之於㣲也又曰更封㣲子於宋者明其前之未國於宋也蘇氏之紀較為正也若書以㣲子之命名篇而不曰宋公之命者史氏志受封之始當以人紀不當以爵紀言爵則嫌於後之嗣為宋公者言人則由是而位上公尹東夏其為宋公易知也康誥之不言衞誥蔡仲之命不言蔡侯之命其義一也其後終稱㣲子而不以諡顯則周公制諡法之始不必人皆得諡而猶以故號示别於康叔魯公蔡仲曹叔皆無諡也丁公而後諡始徧矣史冊之言㣲子者多没其實而㣲子之仁亦隱故為攷其初終如此康誥乃洪大誥治康誥簡首四十八字宋儒以為非康誥之文用破漢儒公攝稱王之疑是已但以為在雒誥周公拜手稽首之上則亦非是雒誥乃周公告卜之書始終皆公與王酬荅之辭與周公咸勤洪大誥治之文為不相屬勤者勞而撫之也洪者廣敷其命也誥者以告百工播民也今洛誥始終無勞下之詞亦無大敷治道以戒侯服之語拜手稽首復子明辟其與洪大誥治之㫖何涉之有哉既謂之錯簡則不知所錯者何編意别有書為周公咸勤洪治之誥此其簡首而今亡矣新安陳氏召誥所謂用書命丕則即此所謂洪大誥治者其説為通乃陳氏不能固信其然拘牽於眉山之論又曰冠此九句於洛誥方有頭緒則曽不念洛誥非用書合丕作之詞徒冠九句於上雖有頭而不連項雖有緒而不引端則亦安得謂之頭緒哉定為逸書簡端之錯文斯為允合惟君惟長舊皆以君長指康叔而言合之文義不相倫比古者王臣侯侯臣卿大夫卿大夫亦臣其私臣為之臣者謂之君猶趙簡子之稱主也長者官之長也君則有家人長則小臣外正此言食邑之君於其家臣六官之長於其屬貳不以徳相能而唯用威虐則不可復以徳乂而當施之以刑也殷土承紂之亂民則冦攘殺越不孝不弟庶子訓人則違上行私世家巨室則虐用刑威所謂亂國也故武王申言之而皆使以刑止之若廢刑典於不用則是汝不克敬法而姑息以寛惡人則非汝封殺人刑人而人之自相刑殺世禄巨室之私虐殺人者多有之矣斯豈文王之以敬天刑而忌疚惡者哉則殺終不止而其以裕民者反底於不裕矣盖誥之所謂慎罰皆戒康叔以勅法明刑除姦保善故曰告汝于徳之説于罰之行言以罰而為徳也罰以為徳文王之所以裕民也眉山矯金陵之説一主于寛朱子固力辨其失而蔡氏間復用之者非也今但循文思義則蘇氏之説不攻而自破矣酒誥百姓里居凡六經所言百姓皆大夫以上賜姓之家也古今語文迭變至孔孟之時民亦得有百姓之稱則相沿之差聖賢亦因時立名實亦三代之賜族日就蕃衍則賜姓之家降為編氓者多也今此言百姓里居則百姓者百官之族里居者井疆夫里之氓也蔡註以百姓為民民則無非里居者而蔡以國中野外分之亦不審矣陳大猷以為百官族姓不仕而居閭里者又誤讀孔傳而附㑹之百姓總以目世禄之家固兼已仕未仕而言里居則未有姓氏之氓所謂牽車服賈者也由諸侯百官世族以逮庶氓經文備舉井井有條理括之無餘而不亂讀而繹之斯無不得巳梓材梓材一編朱子疑其都不成文蔡氏因摘今王惟曰以下為臣下進戒之辭疑他書之脱簡今反覆諷誦文義固有可通者為釋之如右舊以後簡為左從讀者之左右也凡予所撰列以後簡為右從書冊之正也春秋傳曰地從主人安得以我之左為書固有之左體也哉王曰封以厥庶民至惟邦君言邦君下洎庶民上洎王皆其可左右而傳達者也以者能左右之詞也左右民則當勑法止姦以安鰥寡左右王則當任法用乂使王可任徳去刑以和其民以天子之尊不能詧小以明刑以大家之强或且凌弱以逞威惟邦君之為監者下臨大家上近天子當為天子宣其徳威而為臣民傳其壅滯則抑彊扶弱合天下以從王之責其職有專屬矣汝若恒越曰至􅆷敗人宥夫以邦君之職如此汝既君矣乃且以私恩貸其大家而不念庶民之荼毒若常作是言曰我有此一國之衆也有此司徒司馬司空尹旅也是與我親近而相與為國者此臣暨大家也曰予可不市之恩而顧行威以殺其股肱􅁘為君之道亦惟是先以禮敬之以恩勞之故敬勞乎彼彼亦莫不以敬我勞我相報狥此意也則假其大家以威而主威不立矣故彼往姦宄殺人歴人而亦赦之亦有假僣公事以顯為之名而􅆷敗人者亦咸赦之夫然則是以私恩寵其臣與大家而縱之殃民下無以達小民之隱上無以敷天子之教矣王啟監之意其如是哉王啟監至惟其塗丹臒夫王啟立邦君以為監其所治之職非使之專􅃂大家而私其臣也盖為民也其曰無相􅆷虐而以髙明害㷀獨逮至於寡而必敬婦而必屬共遵王道而相與容也盖挾富貴彊衆而􅆷虐人者其惡之所被必先於孤兒寡婦而㷀獨者無所容若此者宥而不殺則㷀獨無告而王仁不下究是豈王啟監亂民之㫖乎王者以位髙聽逺不能下謀㷀獨之苦則不得不委其事於邦君其教邦君越御事者􅂚以哉亦命之引王之所以養民下養其民使無有鰥寡而弱􅁏强食以致於凍餒引王之所以安民者下安其民使無有鰥寡而不適有安以底於危亡自古王者其立法以詔監俾奉天討以整齊天下皆若此固非監之所可任意而自立法以作威作福宥姦宄以虐鰥寡也惟王制法監率行之宥惟王宥殺惟天討惟曰若治田王既已勤敷菑而稂莠必除監惟陳修疆畎明其賞罰之制而已若作室王既已勤垣墻而遏惡衞善監惟塗暨茨飾其賞罰之宻而已若作梓材王既勤樸斵以削平邪慝監惟塗丹雘昭其賞罰之章而已惟王制法而非監之所可意重意輕則脩其經界以不僭不越飾其訓典以不踈不漏詳其文教以不暗不紊監之責也而可自恣己意宥有罪以害細民乎今王惟曰至受命承天而子民者惟敦天德而不尚威遵王而監邦者惟修侯度而不敢市恩倘為之監者詘法以縱其世禄之家使􅆷虐於鰥寡則王且不能為鰥寡主矣是侯不侯而王以不王也今王之所以可用德而輯四方者惟曰先王既勤用明德而庶邦作享兄弟方來大啟土宇置君啟監亦既用明德矣則王之道盡矣而有一國以為之後者當以王之政典為式誅暴禁亂惠此小民使之和輯則爾庶邦乃克大享於王而修其職是王惟務徳而邦君不可不式典則亦邦君式典而後先王之用徳者不虗也是共主列侯之分所秩而達庶民於天子以中治之者惟邦君非若天子之不能徧式其典於天下亦逺近親踈之𫝑所由分也逺念古王之制如彼近念先王之用如此使汝而為王也則網漏吞舟以宏其徳猶之可也今皇天既付中國於我先王矣則承天用徳者予一人之事故我今惟以王道自責惟德之用以和懌之民雖有迷在先而今已覺或及今不覺而尚迷以相􅆷虐者皆可和懌之而不事刑殺以安先王所受之民而非汝為監者之所得效也已至永保民夫道則已然使汝而能順此道以為監也豈過為威嚴而失人心哉惟曰􅆷虐之不禁民不保矣民之不保將何以助王而永天命哉則所式典而不私宥大家洎臣以殺止殺者亦欲萬年作享于王俾子孫遵守以保民於無疆而已葢殷之末造朋家作仇脅權相滅故無辜籲天以訖大命及周之初餘風未殄則君其土而為監者不得藉口用徳縱其大家不懲之使改乃新民懐保之切務王既盡授其權於監使一以重典整亂國而後王可勤得以和懌之康誥之奬其義殺酒誥之督以盡拘皆此意也而康誥為封國之䇿則辭加親梓材為命監之言則辭加厲故自稱曰王不曰予則天子命監之詞非寡兄誨弟之語也其後管蔡以小惠誘殷之故臣而倡亂康叔不從其亂以輔周見漢書則武王之戒為已夙矣召誥牛二孔傳云用牲告立郊於天以后稷配故牛二蔡氏乃謂郊祭天地故用二牛以實求之蔡説非已祭地於北郊不見經傳禮器云饗帝於郊郊特牲云郊之祭也迎長日之至也大報天而主日也周禮大宗伯亦但云以禋祀祀昊天上帝以血祭祭社稷自社以外初無祭地於郊之文若大司樂所云夏日至奏咸池之舞於澤中之方丘則地􅅘皆出可得而禮者則月令所謂祈祀山川百源大雩帝用盛樂者初非有北郊祀地伉於南郊祀天之説也鄭康成以讖緯釋經析天為二謂禘為祭天皇天帝主北辰而配以嚳郊為祭耀寳魄等之五帝而配以稷乃更以東井輿鬼之外天社一星為地祗而主方丘之祀其說妖妄淫邪宜王肅之力辟其誣也朱子以經析緯以道裁禮灼知古無北郊而云郊但祭天社則祭地用破從來之妄如長夜一鐙何蔡氏之不能守師説而亟叛之耶盖王者父天母地則報地之恩者均乎親而異以尊若崇地以與天伉則貴養賤徳人道不立而㡬乎禽獸其尤悖者合天地於一壇而􅀼同牢之義尤使地天之通不絶而隂陽爚亂今此召誥所紀具為分析丁巳之用牲於郊者郊以祭天也戊午之社於新邑者社以祭地也郊之配以后稷社之配以句龍未之亂也郊有牛二而社云牛一羊一豕一者盖地徳隂隂主味其薦用􅍄則折以為俎一牢而可供后土句龍之祀不如求天子氣必特牛而配者别一牛矣今蔡云天地用二牛者其二郊􅁘其一郊而合祭􅁘使如後代之禮二郊並建則丁巳一日僕僕於南北二郊祭天巳竟誠敬且弛而用其餘力以有事於方澤苟且煩黷其亦無以事神矣故欲曲成蔡氏之説則必合祭於一郊而後可乃合祭之説則王莽所以蠱元后武曌所以􅀼唐鼎者而謂周公為爾哉且如王莽之邪説天地同牢而經云牛二又何以曲為之説乎夫天地同壇既以夫婦同牢為其邪辭將亦猶考妣共廟而同享矣乃考妣合食固曰以妃某氏配則地祗亦將配天神矣以地配天則無所復容后稷未聞同牢合􅈟之席容他人介於其側也既以地配又以后稷配一壇二配位於何立豈天地之皆南面而后稷西嚮如俗所繪家神然􅁘且其祝也不可以一后稷而並告配於天地又將天神有配而地祗獨無哉况使其然則上帝一牛后土一牛后稷又當一牛而牛且三豈周之不以后稷配天而抑配者之但有其名而無牲禮所謂稷牛者又何以稱焉蔡氏之鹵莽惑流俗而悖師説於此不能辭其責矣亂天地於一壇而崇地以與天伉隂敵陽女奪男下僣上三代以還典禮不脩而天下大亂皆此等啟之也可無辨哉太保乃以庶邦冢君以者相以之辭如春秋蔡人以吳子伐楚之以取幣者諸邦冡君各取幣而太保以之與俱出入也其錫周公以告王者亦與庶邦冡君同陳其詞如今連名㑹稿之比盖庶邦冡君皆有事於營洛而及其事畢則合詞告成功而因以進戒也其曰拜手稽首旅王句旅者衆見之詞猶旅揖旅見之旅猶言旅拜稽首而進言於王也若公誥句告庶殷越自乃御事句若順也言今者營洛之事順周公之誥以告於庶殷偕侯甸男邦伯之御事而丕作鳩工既順公命而勤王事矣此乃告丕作之辭自嗚呼皇天上帝以下乃始偕庶君而進戒于王至後拜手稽首曰以下乃為召公一人之詞亦如今㑹議後之著勘語也蔡註謂洛邑之定欲誥告殷民其根本乃自爾御事於文義良多牽强而召公與諸侯以幣告功必無不相及營洛役事之理言事畢而後及於進戒則文字之體固然其不可亂者也孔傳諸侯在故託焉之釋亦近似而終不諧者也夫知知字之訓註疏皆未之詳倘以為知識之知則抱子􅂝婦以籲天亦何論知與不知且業已籲之而豈但知乎按易乾知大始知之為言主也主其事主其人則皆其所謂知者也猶今郡守曰知府縣令曰知縣之謂夫對婦之詞知對子之詞父為子之綱則父以主乎子而謂之知猶言一家之主也當時盖有此方語猶侯彊侯以之以謂傭保為以因用而立名使漢人失傳則後世亦安知以之為傭哉洛誥朕復子明辟復辟之説自漢儒承訛以啟王莽之禍王介甫首辨其非程蔡因之以益證周公無居攝之事乃天順之初徐石猶竊漢儒之餘瀋為復辟之文以䧟君父於不義則亦文義未明之咎使亂臣有挾以相違也古今文告之語既巳差别所可證其是非者即本文之前後及他處之同詞以相證爾如介甫以周禮復逆證此之言復是也程子曰猶言告嗣天子王矣則亦與孔氏之説小異而大同立政之言告嗣天子王者歸政之辭也洛誥之作本用告􅁲故曰伻來以圖及獻卜何為有此言哉蔡氏謂稱子者親之也明辟者尊之也意謂此誥首一語如唐宋人上書稱獻書皇帝陛下之比乃攷之於尚書臣之稱君未有加以聖明之號者不過曰后曰王曰天子而已臣之於君猶子之於父名如其質而愛敬已至不待稱父曰慈父曰聖父而後為尊則亦何事稱明君而後見其尊哉唐始以聖人稱𤣥宗於是而有尊號之加同於生為之諡此小人之無禮於君者而謂周公有此乎則蔡氏釋明辟為明君亦未之思也夫欲證明辟之非尊稱無待他引即下云其基作民明辟詞再見而相因如知右目之為目則左目之不名為耳亦可知矣辟法也其基作民明辟者言營洛以為東京示四方朝見㑹同之法則也詩稱商邑翼翼四方之極四方攸同皇王維辟皆謂作京邑為法則與此義通然則復子明辟亦謂營洛以為四方明法而􅁲􅁻位成因以復於王也順本文而成章其義自顯九峰之説徒為冗文而無義程子之説斷句立義而不與下文相連論靡有定邪説乗之故小人猶得依附孔傳以害名教如徐有貞之所為者經正斯無邪慝故訓詁之學不可忽也河朔黎水黎水所在傳註未詳唯蘇氏謂為黎陽而云作洛以處殷民民重􅁶以河朔為近便卜不􅁻然後卜洛以實求之蘇説非也夫黎陽者今之濬縣而殷周之世河奪漳水以流當濬縣之西轉而北去故禹貢曰至於大伾北過洚水則黎陽之在周初實在河南不得謂之河朔逮定王之世河南徙砱礫至桑欽時河乃益南而黎陽始在河北蘇氏据宋河以證周河而不知陵谷之變其謬一濬縣之名黎陽以大伾之山後人謂之黎山山南曰陽非水北之謂也山海經水經郡國志俱不言河北有黎水今俗以衛淇二水合流入漳之渠名之曰黎水者則後人因濬有黎陽之名而以被之於淇之下流其實非也黎陽之黎以山而不以水蘇氏以黎陽為黎水据俗稱以證古其謬二周公至雒在三月之乙卯召公攻位於洛汭在前六日庚戌而其至洛也以戊申凡卜地者必就其地而卜之儀禮所記筮宅者可徴也濬之去洛四百餘里召公安能飛馳至於黎陽三日之内卜畢而歸卜洛乎蘇氏曽未之思也其謬三周公之營洛雖以鎮撫東郊比殷民而俾之多遜然實以成武王母逺天室之志作一代之天邑天豈苟徇殷民重􅁶之志而就彼以為都乎多士曰昔朕來自奄移爾遐逖則洛邑未定之歲殷民巳西􅁶矣故天保所命之庶殷皆其巳􅁶者也業已􅁶之而西復卜黎陽而返之以東晨此夕彼不適有寧是重困殷民而召其侮矣且殷民舊巳居洛而抑又何重􅁶之有哉蘇氏不詧於此其謬四宋之黎陽今之濬縣於周為衛地康叔既已受封矣而復卜都於此則將徙康叔於他乎抑王畿侯國可犬牙雜處而不嫌乎如徙康叔而營於其國則當預為佈置不宜潦草於三日之中一聽之卜也且康叔既主其土自當召令涖卜太保漠不相告馳入其疆唯已所卜則豈非挾天子以奪諸侯之土宇三代未聞有此而况二公之賢乎洛雖去豐六百里而舊為天子之圻黎陽雖殷之故都而已為衛之分土蘇氏不此之詧或惑於成王封衛之邪説以黎陽為圻内其謬五積此五謬則黎水之非黎陽明矣盖二公之所卜者其地皆相密邇故三日而訖卜以踐武王三塗嶽鄙之命其河之南岸則澗􅈆之交在河之北岸者則黎水之厓洛陽去孟津七十里去孟縣百二十里大河介其中則此黎水者盖孟津之西孟縣之南濟源王屋之東有此水焉今其名不顯耳盖統自大河之曲折而言之則有三河之名而懐孟為河内相衛為河北故𡊮紹居鄴而謂之河朔若以洛陽夾河之地而言之則懐孟濟源正值洛汭之北而隔以大河故自洛渡河而北者其地皆可云河朔矣特懐孟之間水之有名者曰沇曰淏未有以黎名者以今度之上黨為故黎國而沁水之源發自沁州沁地屬上黨則沁自黎來出山而過濟源孟縣至武陟以入於河濟孟之間沁水之㑹負太行面黄河實可以為都㑹而與洛陽同為土中考之禹貢及春秋傳俱無沁水則沁在商周或因其出自上黨之黎而名為黎水亦未可知也又此言我卜云者當以陳氏經之説為正盖周公允太保而繼往則二公共此一大事周公之至洛雖在召公既卜之後而召公既得洛食之兆因以示公公無所疑而遂用告王以前既言允保則周公之告即如召公之告而召公之卜即周公之卜矣其言我者統詞也不然八日之内而再卜焉易所謂凟則不告書所謂􅁲不習􅁻詩所謂我龜既厭者非此謂歟且召公已得􅁻卜周公不用而更卜是一卜而不以信任召公其他謀度之相牴牾者又何勝道哉且召公雖卜而不足為有無則何不待周公之來而自輕以取辱又何為􅁘新安陳氏妄云洛誥言是日再卜經無其文鑿空立説不亦悖與王肇稱殷禮至無逺用戾按此段經文傳註皆離析而不相屬抑背戾而不可曉且以為公告成王之辭則倨侮失體既與召誥無逸之文不𩔖亦與前復子明辟之文不謀至以予其明農為周公告歸之詞則文既不誠理亦太妄盖周公為王叔父為周大宗所謂繼别為宗也爵元侯位三公即欲告老歸政自當返彼侯服豈若後世布衣而取卿相者可於致政之日為之辭曰歸田間而秉耒乎此所謂文之不誠也且漢儒之以明農為歸田乃以曲全其篇首復辟之邪説宋儒既闢復辟之妄而復守歸田之陋是憎胡頭而留其鼻也公受武王之託相成王以定天下其為任為辭此何等大事使於理於事在可歸休則於王在豐命公相宅之日既不面陳事畢歸休之志又不待營洛已竟王來公返之餘特為申告乃因告王宅洛之便付伻人而順及之䙝宗社慢君上而不自敬其進退亦莫此為甚矣漢儒以後世君臣駔儈之心億度君子若將知成王之必命公以居守而故先為告去此桓温劉裕之所不屑為者而公豈然哉斯所謂理之太妄者也其曰王肇稱殷禮祀于新邑咸秩無文乃巳事之辭非以教王使然辭氣顯明可見而呂東萊乃謂格君心萃天下宜周公以為首務其背戾者一以予惟曰庶有事為止句既歇後而不成語且舉行大典初無可秘之隱謀使百工從王於周則其必有事也人具知之百工方待恩澤於下流乃為且吐且茹之語而曰庶㡬其有事乎若誘稚子而嗾駑僮者何公之辱朝廷而輕天下之士􅁘其背戾者二大臣之於幼主雖其政令言辭皆得與為裁定然陳訏謨以定命自居平啟廸之功若播告在廷為誓為誥代天言而視詔草必其在髙文大冊者也今區區汝受命篤弼之五字成王乃不能自出諸口史佚諸人不能代為之詞而必待公千里外之遥授則居平所抗法以教者何為浸令百工别有所陳將成王周章㒺措復馳使以請教於洛待之數十日而後答乎如云公於此誥之外别有所撰授如楊修之預為條教應變不差而成王以區區五字不能自言之童騃則雖公有成教亦且如髙緯之誓師而以笑終之矣此其背戾者三朋比也比黨也臣結黨以背公則謂之朋君之偏有所愛是可云私也而不可云朋也君朋臣則父亦朋子乎且自洛往豐之百工素非成王左右之近臣論功行賞即有所不均而非闗黨昵而何事戒孺子之無朋不一詞而足此其背戾者四立政曰告嗣天子王矣重言王者以申警成王使知位尊而任重也若冲子之稱則為相恤之詞乃云汝唯冲子則其詞㫖既若相寛假而抑為敖慢且云惟終則豈非冲子而可不惟終乎其背戾者五公於成王親雖叔父義實君臣成王初齡未有太甲顛覆之事也乃尹於太甲不惠之餘亦但云辟不辟忝厥祖且云惟朕以懌萬世有辭不致危言以相詛而公於成王無過之日且方告營洛之盛事乃若嚴父之責頑子士師之告罷民而曰朕教汝汝乃不蘉時惟不永詞傲而言之不祥宇文䕶之不敢施於其君者公乃出諸口而無慙是與鬻拳之兵諫無異而君臣之禮廢矣且成王固曰公其以予萬億年敬天之休而公乃云時惟不永何其相反之甚而相報之虐也其背戾者六經云無逺用戾其非云無逺弗至也明甚東萊乃云無逺而至則不知其成何文句豈逺人皆至而可云無逺而至是猶人言無食不飽而曰無食而飽其可乎其背戾者七若其首尾轉折之間倐此倐彼句别為義而節别為事後人以不喻公之㫖而離析釋之公亦不自喻于心而離析言之哉今繹本文而求其可通凡此盖公初往迎王之詞也為釋之如右王肇稱殷禮祀於新邑咸秩無文稱舉也言王今欲來洛舉大祀於新邑則當與祭之百工固宜往迎也予齊百工至汝永有辭從去聲王於周從謂扈從也周豐也此百工者在洛有事之官事畢而西迎王也知然者以言從王於周而不曰從王來洛也洛之稱周在東遷以後當時但言新邑洛耳多士可證也庶衆也有事亦謂百工也自庶有事以下皆公戒敕百工之詞而述之以告於王以示義不敢專抑用將其上下交警之義也公自述以告王曰予之齊百工使來扈從也予惟告之曰凡我衆有事者今之往迎王也盖比者王使人來即我而授命曰我且來脩祀事而助祭以與於有事之榮者不必别行澤宫選士之典但於營洛之士紀錄其功之尊者即因功以知其為賢為能而作使之以有事於此初舉之大祀而惟以其事責之於我其申命我曰汝受相宅之命而厚輔王室既總其成則固大明於百工之功載矣載上聲事也績也今使之來可以惟汝簡擇而必當矣乃百工雖有功於前而恐其不恪於後乃在汝之悉進而自教之焉夫王命我以悉教汝庶事故我不容已於教用是進汝往迎者而戒之曰孺子其相率而朋往哉稱孺子者以尊臨卑之稱抑親之之詞猶孔子稱弟子為小子朋羣也汝在昔者或為讐民或為侯邦之陪貳其得事天子自今日始則當敬始以慎終無如火之始燄燄而卒至有所焚灼延而弗絶也汝尚順脩常法而無越禮撫循職事而無廢功如予之事王者以事王則焚灼之患其尚免夫且西周之百工先未與汝共事而自今以往汝作扈從而同執事於元祀則固有同僚之義矣汝惟以彼在周之百工此言周工知前百工為在洛之工矣同往新邑往猶來也洛之百工既至周則謂來洛為往矣使相嚮和諧而就汝以為僚友則汝能有其僚矣得朋慶而信友益以事上矣既若􅂜撫事之不差抑嚮好有僚之相恊則明作有功物無敗之惇大成裕物胥附之汝永有令名於天下後世矣公曰巳至汝往敬哉再言公曰者盖前承王命以教百工此則以巳意申教之也前教百工以敬事和𠂻則宜以王命戒之此教以敬享則非王之所自宜言而以巳意為臣子之自相警也公分陜而主東諸侯則東方百辟之享本其所掌百辟往豐雖以迎王而玉帛之贄亦必行焉故不容不戒巳惟者專用其心之詞汝指百工冲子謂王也識音志記也謹識而弗忘也篤厚也叙以禮相接也正父天子六官之長也乃帷孺子頒朕句不暇聽朕教汝于棐民􅂜句頒别也謂不合也篤叙乃正父句罔不若句若如是也言亦當役志於享也諸侯大夫入見天子則必發幣於公卿儀禮春秋傳皆有其文可攷也公又述其巳意教百工之辭曰若是之若􅂜撫事嚮即有僚者既巳然矣乃予思之汝今之所當敬者則專心壹力惟冲子是事而思君臣相與以有終也夫欲君之終信乎我則必我之􅁢敬乎上汝其敬識百辟事君之禮其享不享皆在巳之敬不敬倘不用志以敬識之則民且有以議其不成享而事爽其情反以召侮矣朕之教汝者如此乃惟汝孺子不與予合志而急遽苟且不聽朕所教汝輔相斯民敬恭奉上之常道則是惰慢不勉而臣職廢民之所侮上之所譴其將受誅責而何以永終哉此不特進享于王者宜然凡以禮厚叙其情于乃六官之正長者父上聲猶祈父農父之父亦宜罔不如是以儀之及物者為享也葢尊王以敬王人道相通爾我之教汝者止此矣今亦不知汝之聽朕􅁘頒朕􅁘善敗惟汝所自致而我不能取必我惟不敢廢王以功作祀之命遣汝往而已而汝可不敬哉抑此周公命百工之詞而云百辟者侯甸男衛與庶殷分作則諸侯亦受百工之事如康叔為司㓂丁公為虎賁諸侯而兼王官者固周制也兹予其明農哉彼裕我民無逺用戾明農者經理疆洫之事如禹之任土文王之即田功也彼者對此之稱時方戒遣百工以迎王則謂迎王為此事明農為彼事也無猶弗也言無能逺至於豐也周公既述其戒百工之詞而又明其不能親往迎王之故因百工以逹於王曰予之所以不能偕百工以往者以洛邑初定民事未脩欲乗丕作之餘力往明飭其溝洫井疆之政盖以明農者所以裕我王之民則亦王之所急者是以不能逺至於周京而使汝扈從焉終言此者亦俾百工知己之非慢而亦以達己之情于王也觀此則公之勤王家輯讐友敬冲人而寓教戒者忠厚深逺固非淺儒所可窺王曰公功棐廸篤此亦其徴矣王若曰公明保予冲子至乃單文祖德按此傳註俱言成王畱公而公許之既承上文明農之譌且王欲畱公則必有惻怛懇至之語述王業之未成引冲人之不逮而篇内竝無此文則舊説之不足信固也今按自公明保予冲子至㒺不若時以答公前誥而稱其功也伻至而王即行故當時無容荅待至洛畢祀而後荅焉予小子其退至四方其世享則命公尹洛且以定周禮之事屬之公也周公作周禮實成於洛故五官之首皆曰惟王建國辨方正位體國經野其曰辨方正位體國者召誥之所謂攻位位成也其曰經野者則此篇之所謂明農也鄭𤣥乃云周公居攝而作六典之職謂之周禮七年致政成王乃以此禮授之誤也大司徒之職曰日至之景尺有五寸謂之地中乃建國焉謂洛都也則周禮作於營洛之後明矣今為釋之如右王若曰至罔不若時百工既至周京迎王至洛定都肇祀而王稱公功以荅前誥焉將進也行也旁謂旁求也作謂勤使之穆穆敬也迓衡不迷文武句迓迎也謂來迎巳之百工也衡量也勤教予冲子夙夜毖祀句教猶相也王若曰公顯明保助我冲子使得宅中以建國者惟公所以訓戒百工能稱揚大明之徳使相予小子上揚先烈而對天命下和定四方百辟而奠讐民友民之衆使得所居又俾予厚禮夫功之尊者將行大禮舉修元祀以及於無文而咸秩則公訓戒之功大矣乃百工之所以承公教而無違者非但稱徳以教之也惟公秉徳之明光於上下所勤之政施於四方故能旁求有位鼓之舞之使咸敬焉而來迎者皆衡量其職以順文武之憲而勤相予以謹祀事也若此然公之功豈止今日為然哉自秉政以來所以輔助冲人廸啟百工者其深厚㒺不如是也則一代之宗禮舍公而誰託哉王曰公予小子其退至其世享舊以命公後為封伯禽者固誤蔡氏留後之説亦未為得留後之説始於唐之藩鎮為副􅏗之名既不可施於此而史浩所云命公在後則又姑且緩歸之詞非使治洛之謂也命公後者猶言有後命也廸啟也言治之初啟也宗尊也四方所尊尚之禮也廸將者啟其道而進之也士謂卿士六官之長師謂官師三百六十之長工三百六十之屬也四輔當以朱子四鄰之釋為正新安陳氏所謂輔弼疑丞是也蔡氏以漢三輔為證失之漢之三輔京兆馮翊扶風皆有分地而洛北河内南鄧析西宏農東陳許皆侯封境土未有所謂四輔者經傳不經見不可以漢例周也公定云者定所未定之禮也困者執而不廣之詞言無自執謙讓不遑而不廣定一代之禮漢章帝詔東平議明帝廟號引此曰公無困我正與此議禮意合足見漢儒傳書初不以困為去而相窘之詞孔氏專家之誤不足据巳康事者猶無逸之所謂康功言治安之恒務異於制作之大典也王既稱公功因自告歸豐而命公以治洛制禮之事曰洛邑建以中又而宗周根本之地不可輕去予今退而就宗廟社稷以為辟於周矣而予更有後命焉今四方之治初啟而一代所尊尚之禮未定則無以憲四方而垂後世未足飾我公戡亂啟周之功於無窮也則公當進而開啟一代之典禮以垂於後其監平聲猶今之監修國史我士師羣工定其職掌建其典文俾皆大保文武所受之民以出治而輔我王室焉是一代之宗禮惟公其尚定之葢洛邑無周京之繁冗公可留治而壹於定禮若周京之庶政則予且歸而治之乃或疑制作為天子之大權則公且重難其事而以責於我顧公之功施徳著於天下人皆肅奉而敬愛之非予薄徳所能逮則公無執而不廣以疑而不成哉况予既有君人之責則康定臣民之事惟日萬㡬惟無斁忘之為兢兢而遑及於此則公尚為天下崇其典刑而四方其世享公之徳矣故吾願公之勿困也周公拜手稽首至文祖徳來呼而進之之詞時王及公俱在洛不得言來洛也宏朕恭之言朕者述成王自稱之詞也孺子述王之稱公也以相宅本周公之事而王來則肇祀也蔡氏以公自言大其責難之義於上文既不類且孟子言責難於君謂之恭謂責難者可謂之恭爾如以恭為責難則天下之所謂賊者皆其曰吾君不能者乎典即六官之典也重言曰者前代述成王之命故曰乃曰朕曰孺子謂文王為祖者臣從君之詞也此言曰則述成王命巳之意也多子即王之所云士云師也御事王之所云工也王言監專所任而總其成也公言以分其事而集衆益也恭者敬其事於始也孚者信其法於成也昭子指成王武王于世為昭成王為昭之子對文祖而言故稱昭子周公受治洛定禮之命乃拜手稽首以承之曰今者王之命我進而詔之曰汝其奉保此文王之受命光大烈考武王之徳而以宏大我之所以恪恭乎天職者惟此定禮之一大事而已盖孺子先同大保以來相宅則既有和恒居師之責矣今此其尚益大前功厚其典禮而定之於洛與殷獻民損益斟酌撥亂反治為四方新法而俾天下之恪恭周道者于此作之先焉夫王之命予以此非旦夕之謀一方之治也盖曰其自是宅中建治而典禮定則萬邦率由之以寡過惟王有成功以刑之天下而垂之子孫也王命之重如此予旦其敢辭難乎固將以多子越御事攷典參職勒成一代之宗禮以上厚前人之成功下荅四方之瞻仰俾天下之信從周道者於此作之先焉乃以成我王之法而究文祖之徳則豈敢不勉哉中庸曰周公成文武之徳即此謂也伻來毖殷至懐徳按此與上文不相屬孔氏曰史説之蔡氏殊未分曉詳其文詞簡質别為一體有𩔖鐘鼎銘識之文盖即後所謂逸祝冊也於此記其文而後記其事繫以月日古史記事之文或如此然其間亦有闕文矣前云命公後猶春秋傳所謂天子有後命也後云惟告周公其後則誥公以世為周公而立其後以為周之大宗也按王命伯禽自别有伯禽之誥祝鮀所云命以伯禽者是而君陳稱周平公其後又有周公孔周公黒肩則詩之所謂在宗載考禮之所謂繼别為宗也知此言命後之非魯公者以惟告周公其後之文明非封魯之詞而諸侯以始封為祖則伯禽自為魯之祖而不得為周公之後魯之祀周公於太廟則惠公以降失禮而為之也公既留洛以定周禮王更封其别子為宗後而命史逸述其事與祝辭於冊其為公言而不為王言者使公之子孫守之以為信典冊之所以異於誥命也故如􅂜器銘識之文自藏之以貽後焉云伻來毖殷記其使者之兼事也乃命寧予者寜定也命周公而定其為後也秬鬯者使之主祀也曰明禋者秬鬯之名猶酒曰清酌脯曰尹祭也拜手稽首休享者公受命也宿留也知非顧命三宿之宿者鬯非可飲之酒不待言不敢而固然其不進也且蔡氏於顧命既從孔頴達之説以為進酒神前矣而此復云不敢受以自進為義殊不可曉不敢宿以禋於文武者周公受命為周之大宗禮宜主祭而受命即禋不敢遲留也此册以記公受其後之命之始事也惠篤叙以下則祝也繫祝於冊後所謂祝冊也惠篤叙至殷乃引考祝公之詞也惠篤叙祝其徳也無有遘自疾祝其福也遘者天行之疾自者巳致之疾也萬年厭於乃徳祝公之徳及子孫殷乃引考祝公之福及殷民也王伻殷至懐徳則祝王之詞也盖引公福徳而致之於王也王使殷承順即叙于萬年祝王定雒之福其永觀朕之子孫懐有周之徳祝王命後之福朕子謂周公之子孫懐徳者篤奉周宗而不貳也舊說雜亂漫無倫脊故以此正之戊辰王在新邑此以月日統記文王所紀之事也烝祭於文武前所謂祀於新邑者自一事也王命作冊逸祝冊惟告周公其後乃王歸西周以後伻來至洛之事又一事也王賓殺禋咸格王入太室祼又以記烝祭之禮王命周公後作冊逸誥在十有二月又以記伻來至洛命周公其後之時也文既錯出乃史家雜叙之言若以序求之則戊辰王在新邑烝祭歲文王騂牛一武王騂牛一王賓殺禋咸格王入太室祼當在王若曰公明保予冲子之上王命作冊逸祝冊告周公其後當在伻來毖殷之上此或錯簡或古史之傳前記言後記事不可一律拘也然烝祭與告後作冊事既不一時亦不同則所謂戊辰者端非十有二月之日而孔氏以為月晦誤巳盖孔氏以烝祭在仲冬而以十二月為建亥之月故以晦日省牲晦日行禮遂縣定十二月之為建亥而戊辰為其晦乃周用天正雖以建子之月為歲首而終不謂建亥之月為十二月豳詩言一之日二之日者可考况是年三月丙午朏則甲辰朔見於召誥者不妄計其建亥月之晦日非庚子則辛丑即三月為建寅之月亦不過戊戌巳亥而止安得有戊辰晦之理則戊辰之烝自在建子月之終而作冊逸誥之在十有二月者建丑之月也盖王祭畢歸周又遲之一月而始遣伻命公也前以言烝故知其為仲冬故戊辰不繫月後言在十有二月乃以終言一歲之事與下惟七年相合成文其不言日者義不繫於日也舊説囫圇無眉目故為分而正之惟七年蔡氏從吳説謂周公居洛七年而薨按此自當以孔氏傳為正周公之薨在成王二十二年故王於十一年命君陳尹東郊未嘗言元老奄䘮而一皆周公生存之語且此篇周書而非周公之私史則其紀年自當用成王之紀年上云在十有二月記月也此云惟七年記年也經文並列其亦明矣云誕保文武受命者即前云誕保文武受民皆謂定宗禮以成王業也中庸言武王末受命周公成文武之徳明治定制禮乃受命之事則此以紀營洛竟而作周禮在成王之七年盖於是冬始鳩其事而登為成書則史亦未之及也或他編别見而今逸矣多士惟我事不貳適貳猶貳過之貳謂再舉也適與擿同言武成之後輯干戈櫜弓矢不復有所摘求於殷而亂之不巳則惟爾殷王之家乗釁挑亂而反致擿於我以為兵端不貳適者即我不爾動之謂也惟爾我適者即自乃邑之謂也此叙其事下則因事而自反之言也蔡氏謂割殷之事一於從帝而無貳心葢据詩上帝臨汝母貳爾心以釋此乃詩以言牧野之事警周人以果毅而書則言東征之役罪在殷而不在周其義自别使如蔡氏所云則為辭失當殷之頑民且將曰女之專心壹志不芟夷我而不止在牧野之日巳然將無益鼓其怨而深其疑忌乎且兩言適而文意皆相因蔡氏分之各自為義其亦踈矣多遜遜順也事逆則難順則易也故遜亦可釋為易也多遜云者革商之始殷民尚為武庚及三監侯國之民逮其􅁶洛則不復為侯國之民而臣於宗周為圻内之百姓故移爾遐逖以就近畿其君子簡在王廷而服大僚其小人職貢便利而親天子是曏者聽政令於千里之外故阻而難今者服奔走於五百里之内其為順而易也多矣多云者以彼較此而見其便利之多也舊註未審無逸卑服傳註皆以卑服為惡衣服衣服可云惡者以縑素對錦綺彼美而此惡也若卑則與尊為對上下自有章秩可以侯王而服匹夫之服乎且此篇言勤而不言儉始末不及服飾之豐約安得徒於文王著惡衣之文服事也位也猶有服在王廷之服卑服謂文王初服之卑也文王中身有國又其後乃受命專征而為西伯所服之位乃尊其在壯歲尚為世子迨既在位且為遐方之小侯故曰卑服也言此者與上舊勞於外舊為小人同義以見成王生長富貴易於自逸而益當加警也庶邦惟正之供蔡氏以供為供賦之供引春秋時五伯之事以例文王受貢賦於庶邦今按汝墳之詩南國之賦役一奉王室使諸侯既不能免商之職貢而復増常賦於周則如火益熱而何以云父母孔邇乎攷諸經傳凡供賦之共發為平聲字皆作共其从人从共之供字許慎曰設也義𩔖文㫖固當以設為法則俾庶邦取正為義孔傳云以衆國所取法則當以正供待之其説自長且經文上承逰田而云以初不從財賦立義豈庶邦所貢者但羽獵之所得乎蔡云上不濫費則下無過取􅁘且多方云惟進之恭文與此相𩔖惟進之恭盖云惟恭之進惟正之供亦謂惟待之以正而已當時自有此文體逆一字以成章此讀尚書者必别於古今文製之殊斯不鑿空以立説君奭大弗克恭進退是人臣之常節召公欲去而周公遽責之曰大弗克恭何其相責之已甚􅁘蔡氏召公告老之説乃以臆斷千年之上識者不敢疑其不然而况敢信其然乎且召公誠志在歸休於成王初年誠為已早迨成王在位既久天下奠安則固可遂其初志而康王嗣位猶領冡宰何前之矯矯而後之濡滯哉盖召公同國休戚之情終始無求去之心亦以已之所處乃無嫌無疑之地而其致疑於周公者則别有説也周公歸自東征不以往事為懲而猶位冡宰正百工留洛邑定宗禮力以率俾海隅日出為己任恝然無憂於天下之疑則實召公所未喻周召俱為先王之舊臣而相與為肺腑之親則不但國事所當同恤而彼此進退之大節亦不能不互為謀而交相益則謂商奄巳殄洛邑巳定誠周公可以謝政之日何事制作之皇皇以乆居大位而秉國成其愛周公也至而亟欲其退自賢者之恒情特以周公方志在必為難可直諫乃終怫其心而有不説之意書序所云固非誣也周公知召公之意而志期莫大之功事待已然而後著固有難於預為顯言者故以我不敢知為發詞之端而末云祗若兹往敬用治則以功之成否歸之天而已意不可悉言且欲召公之忘言以俟巳之經理且為之而無恤其他也故蘇氏謂召公欲周公告老為得其㫖蔡氏之説非所敢從巫咸孔蔡皆以巫為氏按大夫賜氏始於周黄帝至殷唯分族姓而不以氏顯巫官也殷道尚鬼故巫列於大臣而卜筮醫藥一統於巫山海經言九巫采藥楚辭言巫占夢皆其徴已乃九巫有巫咸楚辭亦云從巫咸之所居未知其即此巫咸與否王逸固云巫咸殷人特山海經世云大禹所作似不當及殷之巫咸而抑載夏后啟及殷王亥之事則亦商周之際或為之巫咸殷人不妨見也據此則巫賢亦良巫而不必為巫咸之子如孔氏之云矣有殷嗣天滅威舊謂紂為殷嗣今攷本文上下義㫖不屬滅猶􅌸也謂無所用之也盖言平格者著保乂之功故有殷得以繼天為君而天不降之以刑威也小子同未在位上言予小子旦則公既以小子自稱此乃以小子為成王此傳註家之大謬也公固嘗呼王為孺子矣而孺子之與小子文似而實逺言孺子則但以年言之曰小子則狎褻之詞也况菲薄其無所能而曰同未在位則是􅌸之為不足比數而謂事權一在於我軰此非大有無君之心者而敢作此詞乎髙澄之所云狗腳朕者亦不過如此而已在位者言已在冢宰太傅之位也公言我固乆在其位而功徳未昭遽欲告去同於未在大臣之位者不以誕大之責為已責收斂自全㒺朂所不及徒謂巳之年造造猶命也耉老託於庶官七十致政之例而徳不降下則物理且不察而况於天命乎此為公深於自任之言而以明大臣之位義異庶寮所以破召公之疑者奈之何斷析文句屈聖人以不道之辭􅁘鳴鳥謂鳴鳥為鳳者不知所本鳥為統名鳳特其一鳥皆能鳴豈但鳳然哉卷阿之詩所云鳳皇鳴矣于彼髙岡者亦詩人興比之詞耳興固有不因所見而起者而况於比如宮人之咏后妃亦安得至河洲而睹雎鳩乎且卷阿之詩作於召公繹其文㫖大抵在周公歸老之後則此言鳴鳥不聞者其在鳳鳥已至之餘乎抑鳳鳥已至之前也如在鳳未至之前則周公即刻畵已徳以明祥瑞而安知瑞應之至不為醴泉朱草黄龍白麟而必以鳳哉如在鳳鳥已至之後則其鳴固可得而聞矣而又何以云不聞􅁘蔡氏乃云在郊之鳳將不復得聞其鳴豈周公必欲此鳳旦夕嗈嗈於耳側乎使然則亦春之鶯秋之蝉而不足為鳳矣且鳴鳳之聞實天休所錫則既能有格而後可以致鳯今云鳴鳳不聞矧能有格則是有格難而鳴鳳易聞也豈鳳既至而尚不可謂有格乎求之經文但言鳥而不言鳳其云鳴而不聞者特不聞而非不鳴也猶所謂寸葉蔽目不見泰山兩豆塞耳不聞雷霆盖以甚言在家不知國政則隔垣之外音響不宣雖鳥之鳴噪且不能聞而况㝠不可知之天命其能有格乎傳註附㑹失實乃使本文失理不足采也蔡仲之命蔡孔氏謂蔡叔圻内之蔡仲徙封於淮汝之間孔頴逹引杜預之言謂叔度封於汝南上蔡胡徙新蔡圻内蔡地不知所在以實求之孔固失之杜亦未得也祝鮀曰殺管叔而蔡蔡叔上蔡字註音素逹切而禹貢二百里蔡蔡之為義本取草萊之名以荒逺草野之土為罪人所居故謂之蔡則圻内不得有蔡地而叔度之稱蔡亦非其國名可知矣文王之昭在武王時唯周公康叔耼季官於王廷五叔無官則亦未嘗列土為侯其後管叔以為監得食地於管然稱字而不稱爵則固天子之大夫例所稱也若霍叔得封於霍地在河東當亦三年不齒之後始受茅土爾則蔡叔在未叛之先盖亦以大夫監殷而未封其云蔡叔者則以其被流蔡之刑而名之爾叔死仲封周公因以蔡名其國而割淮汝之土以授之使後人顧名思義而求盖前愆也故杜預于隱公四年春秋傳註云蔡今汝南上蔡縣亦足見蔡仲之未徙封於新蔡也上蔡之去新蔡不能百里新蔡之名蔡其原起不可攷要自蔡仲受封以至於昭侯􅁶州來之日始終都於上蔡而未嘗一日居於新蔡杜預之説見於春秋傳觧者甚明不知穎逹所引預説者又何所出􅁘豈預彼此之有異說哉抑或穎逹之誤識之也而况如孔氏所云圻内蔡地尤為無稽者􅁘多方惟爾殷侯尹民蔡氏謂提殷侯之正民者告之此殷侯不知何指以為殷國之侯􅁘則禄父已滅矣以為殷之諸侯􅁘則殷尚得有諸侯哉且業已歸周而又何外之􅁘此言殷侯者皆追謂武庚也尹猶君也言昔武王誅紂已宜殄滅之而我且使爾武庚嗣為殷侯得尹其民者乃我大降爾命故使紂裔得君其故土此述始事以見周之仁而殷之悖故下言弗永寅念於祀見殷之不復能尹民乃其自取爾武庚受封必有國號承殷之祀自當號殷爵列五等自當云侯其後改封㣲子於宋位為上公周公之制乃然耳甲於内亂甲謂草木初生之萌許慎曰木帶孚甲之𧰼内亂如木之萌甲漸發而不已故曰甲於内亂舊注未悉立政用咸戒於王蔡氏謂周公率羣臣進戒于王前為賛詞而此為羣臣之所同戒今按立政一篇乃周公作周禮以後具職官之典進陳於王而因言官人之所尤重者以戒王之慎所用故無事帥羣臣以共戒且羣臣而胥進戒則亦必有辭不當但列數五者之官而漫無一言盖前云周公若曰乃史記周公所進戒之意而後周公曰以下方實為公言史言周公作此立政當其進戒之時拜手稽首告王以君道而因取此左右三宅及綴衣虎賁之官條其職任以戒於王見所當恤此三言曰者史之詞也孔傳云周公因王所立政之事皆戒於王斯為近之綴衣葛氏謂綴衣為周禮司服之𩔖乃司服以掌辨章服之尊卑而非典衣之官冡宰之屬有􅒌人以司􅒌紩而女御為之非士大夫之所典顧命稱狄設綴衣綴衣者㡩幕之𩔖也乃供之者幕人設之者狄狄則樂吏之賤者不得與虎賁同科盖綴衣張於王座則此言綴衣者非司綴衣之官而侍立於王之左右在綴衣之内者盖近臣也此為統言而下所云攜僕太史之流皆其人與攜僕傳註謂攜持器物之僕今按周禮五僕不兼攜持之事則攜自攜器物之小臣而僕自僕也其官若小臣小子之𩔖盖攜為其統名也大都卿大夫之采邑曰都春秋傳曰大都不過三國之一周禮有都宗人都司馬是已大都公卿之都小則大夫之都也宗人司馬皆為王官其他則其自為辟除伯猶正也宗人司馬皆正官也舊註未悉夷烝夷烝與㣲盧同舉而夾於首尾則其必為國名可知以夷為蠻夷之統名烝為衆者其失明矣地之以夷名者春秋許遷於夷左氏曰實城父城父在今亳州即三亳之一不當贅舉烝之為地未聞唯衡陽有蒸水故孫吳名其縣曰臨蒸而要在荆州之南陲則皆非是唯春秋傳記紀人伐夷杜預曰夷國在城陽壯武縣而漢東海有承縣承故音烝地在今嶧縣然則㣲盧紀西而夷烝紀東皆屬夷之國也三亳阪尹孔氏謂亳人之歸文王者三文王方率六州以事紂安得為亳人逋逃之藪此妄說也陳氏謂三亳商故地分而為三則周初未有𤓰分商地商民之事亦為無據按上文兼言文王武王之事則三亳自言武王已事而孔氏之謬既明三亳者殷之故都也阪者安邑之阪夏之故都也武王初定天下於二代之墟立王官以尹之所以安輯之也商都西亳而南北二亳皆設尹者意商嘗建二亳以為亳輔故皆以亳名之亳亦大也與京同義其猶洛邑之稱周而漢唐之有兩都宋之有四京與舊註殊踈君陳君陳李氏稱鄭氏註中庸云君陳周公子今中庸鄭註乃無此文當由他見而李氏誤志之也然君陳之為周平公而伯禽之弟既􅃀不可易王氏乃謂篇中不言爾攷周公與康誥言穆考文王蔡仲之命言乃祖文王者不同則不知成王之命君陳在十一年而周公之薨在二十一年安得生而稱考哉此孔穎逹周公既殁之說誤之也經云昔周公者昔之為言昨也又云式時周公時是也固當時之稱也殁則云乃考考善詞也生不可云乃父乃父䙝稱也稱君陳之徳而曰孝友則固為人子之詞父在子無專美故他無可稱而但舉其内行也其曰既見聖云者亦目擊而親炙之詞也公以成王之七年治洛凡閲歲五而歸於周京仍相成王故令君陳代其任然此之命尹東郊者特代公治洛而已未嘗嗣公爵而國於周以為周室之大宗也命之嗣爵而紹封則當稱其先烈命之代任而治事則但令法周公以敬典葢嗣爵因乎先徳而命官則唯其人不以世故而用之者初不如康叔蔡仲之以懿親開國者比無庸稱引先世義不繫於父子之相承也王氏不諳於辭命之體疑非所疑乃欲生稱人父為考而盡沒周平公以洎周公孔周公閲周公黑肩之世系是惡可哉蔡氏曰君陳臣名亦師心矯古而失實也顧命芮彤畢毛詩言虞芮質厥成盖商之舊伯早服於周因之而不替其封者至春秋時國尚存芮伯萬為母所逐而秦併之今平陽府芮城縣其地也彤國地未詳王肅以謂似姓之國他不經見未知所本疑此或胙字之誤傳寫小失盖周公之子而封於衞輝之胙亭者也畢國在長安西毛國傳註亡攷春秋猶有毛伯而隨周東􅁶非其舊地安定有毛氏則其國當在周京之西北也翼室蔡氏謂路寢旁左右室今嗣子既為䘮主而入側室於禮非安孔氏訓翼為明云即路寢翼之訓明猶明日之為翼日古有是詁路寢向明出治之室故曰明室禮君薨必於路寢故春秋傳曰正也成王以乙丑日崩太保即迎嗣子而入時尚在小斂之前無縁尸在路寢子居側室而不親馮含其必俟已死而始延入者世子先居别宫問安有時王疾病則居於内死乃􅁶尸于路寢臨終而子不在側者天子之禮别嫌明㣲異於士庶也天子在則世子不得輙入路寢故必待延入延入則為主矣孔説自正命士須材傳註皆言致材木以供䘮用不知所言䘮用者何所用之檀弓言虞人致百祀之木為棺椁之用者則事在未殯之前今業已殯而始須之何為若士䘮禮所云獻明器之材則事在筮宅之後啟殯之前日天子之䘮九月而葬乃急須於九日之日又何其大速耶且致棺椁之材則有虞人治明器則尊甒弓矢瑟琴各有司存以上統於司空而何以命士况此篇經文上下皆未言及䘮紀故九日之内所為復含大小斂哭臨殯塗一槩不書於篇何為獨於䘮用之材而特記其須揆之本文前後殊為不倫彼含斂奠殯其事之大且百倍於須材逸其重而記其輕不已傎乎盖此篇為紀顧命而作則所重在嗣子之受命而䘮禮槩所不紀固其宜也所謂士者周禮之司士也司士之職國有故則致士而頒其守材者材武之士須待也新君將立國之大戒故選材武之士頒其所守以待命焉而正朝儀之位擯王行禮皆司士之職故特命之後之執惠執戈者皆其𩔖也尋文繹義斯為可通爾狄設黼扆綴衣設張之事自幕人所掌狄之為官不見於周禮唯䘮大記言之則周禮所謂夏采者是已祭統所云翟乃籥師之别名不與此同狄不典黼扆綴衣而特司其陳設故䘮大記云狄人設階此云設者兼下文而言黼扆綴衣四席四几有司備之而皆授狄人使之排設也夏采所掌乃始死而復之事此兼命之者以方在殯禮雜吉凶且狄司復事為神所依亦使求神而授命也舊註未悉赤刀大訓傳註謂赤刀為赤削鞘今按刀鞘施赤不足為寳亦不可名為赤刀所謂赤者赤金也古以銅鑄兵而赤銅脆甚不任為刀此以赤金為之則其冶錬精良固非恒物亦上古物産未備時所為可以徴物始也陶宏景刀劍録記夏孔甲鑄一劍銘曰夾夾篆亦字古或通作赤盖其𩔖已大訓孔傳謂是虞典蔡疑孔説之偏乃謂兼數代之書及文武之訓固無從辨其非是然顧命在成王之末則文武之訓初為成王所藏不足以昭世守而三皇五帝之書外史所掌不入寳藏意虞典舊文為當時故簡者猶存武王克商𫉬以歸而寳之與外史所掌五帝三皇之書文是而簡非者不同孔氏必有師承説賢於蔡凡此𩔖非有確證不可輕駁古註也夷玉舊註謂夷為常藉其為尋常之玉則亦何必為之名哉而亦不足為寳矣周禮大䘮共夷槃氷䘮大記云大夫設夷槃鄭𤣥註云夷之為言尸也尸之槃曰夷槃牀曰夷牀衾曰夷衾此言夷玉者謂玉之美者能津潤養尸也漢人用玉匣以葬義取諸此然非真玉則不堪用故玉以能為尸玉者為美汲冡書有天智玉紂衣之自焚而尸不毁其此𩔖與綦弁爵弁士所以代冕而祭於公則綦弁者皮弁也韋弁色赤爵弁如爵頭赤黑色蔡以爵弁為赤色既屬不審韋弁皮弁皆以鹿皮為之韋弁則染韋赤色皮弁則如鹿韋之本色而不染然必去其毛則一也蔡云以文鹿子皮為之則誤以帶毛斑斕為綦色耳不知綦者蒼艾色也其見於曹風者曰騏則亦青蒼馬色既非鹿毛赤黄白相雜之色而禮註但言白鹿皮不言文鹿言文者蔡氏以已意附㑹之也鹿尟白者其云白鹿皮謂去毛而韋色白爾綦騏皆青蒼色而皮弁非蒼則知所謂綦者周禮之所謂璂也綦結也皮弁之􅒌中貫結以采玉以為飾詩云㑹弁如星此之謂已大夫之弁璂飾二玉亦二采士之皮弁則結飾此言綦弁亦大夫之弁以王之中士再命異於侯國之士故綦弁亦為士服而如呂氏之説大夫四命則希冕矣㝛祭咤酢按此傳註紛紜不决殊難分曉以咤為嚌者蘇氏之失也謂祭為酹酒神座者鄭氏之未諦也謂酢為報祭王答拜為代尸拜者蔡氏之謬也既以咤為嚌則下云咤嚌於文不通以祭為酹酒酹者綴祭也亦相因繼進之義言三祭則綴可知而但言祭則不可以酹為釋也以酢為報祭報祭之名不知何昉新安陳氏乃云報祭者亞獻也則其妄益甚酢者賓荅主人之稱爾以荅拜為代尸拜則不知唯祭有尸今此但為受命於几筵非祭也而何以有尸既葬反虞而後立尸為殯巳藏於土而神無馮也今成王之殯在宫而立之尸則亦致之死而不仁矣且几筵四設其亦將有四尸乎祭以子孫奉其先則立尸而致尊之以盡孝思也今新君受命於先王而一人儼然在位以傳天下於嗣子是彼尸一天子也一堂之上有二天子矣誰敢為此尸而公然以天下與人乎以實求之所云三宿三祭三咤者約舉成文實三獻也前云即位其所即之位傳註不言所在以子受命於父之義求之則當與冠禮相通盖阼階也由賓階上者嗣子之不忍死其親也即位則於阼者正其為主所謂踐阼也宿肅也謂揖進也言三宿者自阼階肅進於几筵之前凡三獻則三進而三降也其降以疑立待神之享因洒同而又進也三祭者謂三實酒於同而拜送於神也三奠者謂三置酒於牖問几筵之右也統言之而不詳記其儀史事尚簡非猶記禮者之必詳其進止之容以詔後之行禮者也三獻既畢故上宗傳命曰饗所以告利成而何又有下報祭之亞獻哉三獻而凡用三同祭畢而徹同大保受之此禮為受命而舉同為天子之大器不可同於凡祭之爵故宗奉以上而太保受以藏也以異同酢者神人之别也亦以同而加璋者重嗣王也酢者賓荅主人之獻也此則神受饗而報主人也以酢禮禮王賓先君而正王之為主也太保代神以酢王則其無尸可知矣授宗人而不奉之王者初䘮無舉爵之禮不可同於虞祭之酢孝子受爵故宗人代王受也拜者拜送酢酒也王荅拜者荅酢拜也此受命之禮雜於􅁻凶凶故王不受爵而無牢鼎同於奠食亦不立尸雜於吉故不舉哀異於䘮奠也禮之有酢則必有酬酬則必旅今以凶故又受命而非祭則旅酬以廢然廢旅而不廢以酢之不可無酬嫌於嗇神惠也經再云太保受同者又一異同盖酬酒也亦用同者尊太保之為神酢也不用璋者臣不敢受君之璋也太保受王之酬同不言王酬太保者亦省文也太保受酬而祭此祭乃祭始制飲食之人而隮而奠於其位太保當在賓位不卒飲者凶也祭且隮者臣異於子以敬殺哀受酬於王不敢虛君貺也授宗人同者禮畢反同不復舉酬也拜者拜王酬也王荅拜者以賓禮禮太保也史記其約畧如此而其間進退登降之文尊罍洗篚之文􅇼豆俎鉶之薦皆所不紀則以非義所繫不足紀也受命必以酒者所以交於神明不可無實也經文雖畧而次第不亂因文繹義自爾條析傳註如舟行霧中倐此倐彼則將令人何適之從宗人註以太宗為大宗伯宗人為小宗伯今按上文言上宗奉同瑁由阼階隮未有小宗隨之而始終與王成禮唯太保與宗人則此宗人即大宗上宗可知其宗伯則陪位之卿士也太保以宗臣為顧命之首故代先君以授命宗人以宗子掌王之家政故贊王以受命依蔡註則為宗伯者彤伯也王肅所謂姒姓之國也雖為典禮之官而奉同瑁受同則自非貴戚之卿不足任儀禮云繼别為宗詩稱大宗維翰則此宗人者盖國之大宗而非宗伯也周公薨則君陳為大宗而畢公之繼君陳在康王之十二年則是時君陳固存成王不豫之時召之而來也康王之誥黄朱註謂黄馬而朱其鬛朱鬛之説未知所出而㡬同兒戱抑或謂黄朱為篚實乃幣唯𤣥纁不應有黄且下云賓稱奉圭幣則幣者其所奉持也非其所布陳也黄朱者黄間朱之色所謂騂也周尚赤而無純朱之馬故大路乗騂此充庭實者必齊其色以共大路之駕故每國四而皆黄朱註兩說皆碍非所當從羑若蘇氏謂文王出羑里天命自是始順出羑里而天命順乃云羑若大不成語且此兼言文武而囚於羑里但文王之事蘇氏之説其穿鑿固不相入巳按説文羑進善也故周之圜土殷人謂之羑里言以懲警惡人誘之以進於善也其字與牖民孔易之牖通故羑里亦或作牖里此云誕受羑若者謂大受上天之命羑進斯民於順道也羑若言教克恤言養教及天下故曰誕受養在圻甸故曰西土文義自爾著明何事牽附於羑里哉若蔡氏謂即下文之厥若羑厥篆文相去甚逺不易成訛也君牙嗣守文武成康舊説穆王命君牙為大司徒今按經稱文武成康而不及昭王雖昭王之徳不及成康然亦不宜竟置之不道若無昭王然者史無穆王命君牙之事竹書記昭王六年錫郇伯命左傳記郇伯為文王之昭當為武王所封王㑹解記成周之會唐叔郇叔周公在左則郇叔固翼戴成王之宗臣與此言世篤忠貞服勞王家者吻合然則君牙者郇伯之名而命之者昭王也若冏命出自穆王但稱文武而不及成康則亦可不言昭王辭命之體固各有損益之宜也冏命大正蔡氏既以大正為大僕又疑太僕為下大夫不得為正復從孔氏之説以為大馭按大馭雖秩為中大夫而其所掌者特馭王路以祀而已其一切僕御之事非其所總理也大馭馭玉路戎僕御革路齊僕御金路道僕御象路田僕馭木路王之五輅凡五馭分馭之各不相為統攝持以玉路駕之郊祀故特重其事而秩大馭以中大夫乃秩雖尊而事權則輕盖以優禮之親臣為之若其政令則不但彼四僕者受成於太僕即大馭之尊亦必受轄於太僕也太僕之有正者為小臣祭僕御僕而言也若大馭則為因事而設之官不但無屬官而並無府史胥徒不得云正經曰僕臣正厥后克正僕者祭僕御僕也臣者小臣也昔大僕之屬而於太馭亡與也經云出入起居謂太僕之正王服位相王灋儀也經云發號施令謂太僕之出入王命掌復逆也經云正於羣僕侍御之臣謂大僕之逆御僕與御庶子也凡此者皆非大馭之所有事且太僕轄僕臣而有常職且其所掌兼出入號令服位之事而不專於御車者若大馭則臨事簡𨕖如今大祀親征題㸃執事官之例當亦聽於大僕事畢則已故有官位而無職守因以不設府史胥徒之屬攷之周禮固自著明若其云正者自以對其屬官而言雖下大夫而不可云非正也且大僕之官下大夫二人而伯冏居其一或一正一倅而伯冏為其正與蔡氏狐疑不决亦未􅍄讀周禮之過也吕刑呂禮記作甫詩不與我戍甫毛傳但言其為姜姓朱子云其地未詳按説文有鄦字其音與許同云太嶽之裔甫侯所封地在潁川今攷許之封壤正在潁川而鄦許同音則不應此兩國同出太嶽同封潁川而國名之音又一也毛鄭于蒸民之詩列言甫申齊許為四國葢緣揚之水之詩言許而又言甫然詩之立文有重出而異稱者如伐輪伐輻兩章互見而輻固輪也或在西周之世為呂為甫而在東周則謂之許音轉文異猶郼之為殷亳之為薄虢之為郭也特見於春秋者許男爵而非侯乃甫侯之稱但見於傳而經無其文則亦無以必其為侯爵也士制百姓于刑之中臯陶不與三后之列東萊以謂文有賓主然攷諸本文則奉法以行者臯陶也制法以折刑者伯夷也則秩宗議道之公卿而士為作而行之之大夫也其尊卑則固有差矣唯刑法定於伯夷故後但言伯夷播刑之迪而不及臯陶呂刑一編以言制法之事故祖述伯夷知此則吳氏兩刑官之説無足疑者如漢蕭何制法而别有廷尉也中當音丁仲及周禮所謂士師受中是已刑有要有中要者猶今之勘語中則供招罪名也後云觀於五刑之中其義亦同俾我一日非終句惟終在人句上言爾所罔不自慰而克作天牧者非日勤乎爾所無能戒而為上帝所不蠲者非不勤乎勤則敬敬則足迓天命而日勤者一日之積也一日不勤則不得為勤矣乃天與人以一日其為勤不勤者胥此一日也能與人以日而不能使人勤則終此一日之力以勤者非天也其惟終者在人也而可不敬而若勿敬美而若勿美以終一日之勤以逆天命哉聽訟之失自非鬻獄者恒因於惰惰則不詳為閲審而人之情無以自達矣故穆王深以勤戒之傳註迂折不順特為正之如此五過之疵過失則在所赦而有不在赦例者于刑非不簡于罰非不服乃曲引過誤之條以赦之是為五過之疵無心而誤出者聽于平反疵則有故而縱之者其故凡五一官位相聫懼相干涉而故出之以自便二前之聽獄者與已不協立意欲與相反則不論曲直而但翻駁其成案以出非所出三託於女謁以求請四受貨而疑之五舊與往來或囑託所與往來者緣此五者因非過謂過入于赦宥皆為法病病法則縱有罪虐無辜必審實其罪而故出者亦均坐焉此皆言故出人罪者蔡氏兼言故入人罪失之惟反之釋孔蔡皆未審惟來之釋孔蔡各得其偏當以事理求之自見鍰許慎曰鍰鋝也鋝者十銖二十五分銖之十三慎又曰此方以二十兩為鋝以十銖有竒則太少以二十兩則又多孔氏六兩之説為得其中然又不知其所本且此所罰者不知何經孔氏謂為黄鐵乃黄鐵之名他不經見則亦銅而已矣銅有赤有黄古以鑄兵亦以鑄鐘鼎乃此所罰者或不應須銅如此之多則當以鑄泉貨耳則雖名為罰金而六百兩之銅當五銖錢五千有竒盖所罰者泉布而計其重以為多少也舊註未悉文侯之命秬鬯一卣秬鬯鄭康成謂不和鬰者乃徒以秬為酒則亦黑黍酒而已惡足為重鄭之註此為鬯人所共而言耳鬯人為秬酒而鬰人以鬰和之亦必和成而後為鬯也蔡氏徒以鬯為香草則誤鬯為鬰所和秬酒之名而非草名草自名鬰不名鬯也言一卣者昭始賜也諸侯不敢為鬯未賜者資之於天子所資者止共一祭之祼而無餘也賜之圭瓚秬鬯則自為鬯自有此一卣之賜則繼此不待更賜而自為之矣白虎通曰孝道備者賜以秬鬯謂其馨香之徳物與相稱而足交于神明也故詩言秬鬯一卣以賜召康公而稱其徳曰召公是姒又曰告於文人此以秬鬯賜文侯亦曰克昭乃顯祖追孝于前文人則皆以嘉其孝而賜之也傳註言當以錫命告其始祖皆屬未審費誓淫舍淫大也亦放也軍行五十里為一舍所舎之地必有頓置牛馬之場為擭穽之所不及乃此征徐戎之師不但魯師諸侯之兵大集則舊所為次舍者不足以容淫濫四出隨地安舍則越阡陌踐蹊徑而舊非禁地擭穽之設固有之矣是故使之杜而敜焉抑此蔡註謂以令軍所在之凥民乃誓者涖衆於行間之詞也故前云嗟人無譁則其為面命可知則亦使閉牧牛馬者自杜敜之也不然牧人不謹使馬牛罹傷而獨罪居民非法之􅁢矣臣妾註以此為嚴部伍之事乃軍中有女子自亂世之政况營伍不守乃至婦人亦得逋逃則丁壯之潰㪚又何禁乎不責其防衞之不嚴而但戒其勿越逐尚為有軍政哉按此盖為淮夷徐戎所侵犯之境避兵入保者言也避兵者與征戰之士旁午交錯于道而避兵之民牛馬臣妾有迷失者若許其主穿營伍而求之則姦諜或詐為尋逐之民以生不測故禁民勿逐而令收得者還之也必如此釋於義乃順無餘刑非殺傳註以非殺為不至於殺前所言有常刑者皆不至於殺何但於此誓以警衆非以慰之也不至於殺則亦不殺之而已何事預告以寛之哉辭之失體莫此為甚如云除不殺外凡刑皆用則胡不正告以當坐之刑而使軍吏得以上下其手􅁘且蔡云刑之非一者任人之隨用一刑乎則罪均而刑異如謂但除大辟一切皆並施之則既墨之又劓之又刵之又刖之是臠割其人無完膚而必至於死何似一斬之猶得速死為􅁘糗糧不逮茭芻不多皆坐大刑傳註皆謂乏軍興之刑乏軍興者死刑也方築而乏楨榦築必不成且戰且築而遲悞於須臾則所害甚大曽不似乾糧之可均可補茭乾芻也芻之可以續運乃彼則誓以必死而此則寛之以不殺於義何居無餘者盡詞也正大辟也必言無餘而不但言大刑者謂應辨之夫里催督之里胥攷成之官正一坐以死而無所殺也殺音色界反糗糧芻茭之不備罪坐其人而餘從末减此則不分等殺而一坐以上刑緣楨榦之備記里步丈尺必全具而後俄頃成城乗敵之不及我攻缺一不具則全功皆虗故立法尤嚴此以軍機之神速為軍令之矯䖍而非經生之所能測也固其宜爾秦誓不啻若自其口出尚書文義多難解了然或錯綜成文而有字則必有義獨此一語繹之殊不易順畼如謂不但見之於言則當云不啻自其口出而何以云若如謂不但如其口之所言者則當云不啻自其口出而以云自今既云若若而又言自又言其則傳註所云甚於口之所言皆粗踈成解而于經文不合大學章句及諸家小註俱未清析繹文思義上言其心其者指一介臣而言也此云其口其者指彦聖而言也謂一介臣之好此彦聖有以深信而誇美之不但如彼彦聖者之自道其長也盖人之知人恒不如其自知而所藏之美所通明之理唯自有之則言之皆真不啻若從其人之自道則所謂唯公知我勝我自知者也或疑苟為通明之美士則方且恥躬不逮而何至自􅃷乃此所謂彦聖者亦秦之彦聖耳秦人夸大而好自譽今觀小戎終南無衣等詩其踔厲自雄曾無遜讓之意居然可見其流風達於上下則有呂不韋著書而懸千金以誇其一字之不能易始皇勒石自頌謂古帝王皆莫巳若沿至後世如東方朔之自稱曰可以為天子大臣而𡊮盎朱雲班超梁鴻陳遵馬援楊震楊修李靖嚴武李泌杜牧冦準之流皆自許髙達而無推讓不遑之事則心有其美必自口出秦之彦聖如是而已而又何疑哉尚書稗䟽卷四下
