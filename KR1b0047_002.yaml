body:
  text: 尚書稗疏卷二嶽州王夫之撰夏書禹貢既載壺口先儒俱云禹治水始自壺口朱蔡獨以為治水當先從低處下手故先決九川之水使通於海又濬畎澮之水使通於川下流之水殺則上流之水漸淺以實求之固不爾也中國之形𫝑從西北而下山𫝑逶迤於東者散為數條兩山之間中為平野川於是流在北則巨鹿以至於天津在中則滎陽以至於淮安在南則洞庭以至於吳會其相間之際各有岡脊兩川之必不相通者岡脊間之非人之所能強也洪水之患河實為之雖云懷山襄陵亦必不能北踰井陘南漫楚塞是他川之漲落固無與於河流之淤通矣今帝都淪汙人民墊隘乃欲遠疏他州畎澮之水待其漸歸於海而後治冀州之上流此猶癰在頭而刺其足不亦傎乎河之為洚水也塞於吕梁又障於龍門其在上流既漫入於汾絳為帝都之害而其下流又為太行諸山所厄坌出之水必且不循故道蓄極橫溢濫灌於大名曹濮以及汴宋之郊非但治他州之川漠不相與即令治河下流亦無與於龍門之阻且瀰漫四散河身不現智如神禹當亦無從下力而人治於下水瀦於上蓄極必泄者沓至而日增下淤漸去上潰驟通治水丁夫即極數萬人之力而此數萬人者分之則各亦一身爾長不滿七尺力不任百鈞就淤漲之下橫加疏鑿所鑿既泄濆涌傾下不轉盼間而此數萬人者皆魚鱉矣治之先自上者以水治水也先自下者以人治水也使以人治水將所謂疏瀹者如王安石之用濟川杷為兒戲乎亦將以钁鍤開高堅之地勒水而強之上如李昌言賈魯之為乎乃昌言之回河不十年而復決賈魯之挑黃陵岡至洪武初而已絶徒勞無益棄地殃民必非禹之所屑為而忍為者且以人治水由下及上即有神術能令水降而人不漂乃下流之渠濬治方瀞而龍門壺口吕梁以西停積之水乍然得通其泥淤浮沙朽木頽石乘漲俱下逮及山東平衍之地𫝑廣安流淤梗不行則晉冀之木石沙壤盡注於大伾之東向之所開者有限今之所淤者無窮盡棄前功而兖豫仍為澤國矣惟先上而後下闢吕梁鑿龍門使河之自保德岢嵐溢入汾晉者漸得其道循孟門以出河曲因積水浩瀚之力推淤梗而漰湃以東待之良久積水既盡則淤者成岸激者成川髙下之形大略巳定其有阻滯者亦可施其分合疏通之力矣得尺則尺得寸則寸漸東漸下放於海而皆安流故曰惡其鑿而行所無事也龍門之西地形之髙於九河者不知其幾百里塞於千仞之下安能使千仞之上汜濫橫流而况荆揚之川分阻漢東之山梁州之川畫絶劍閣終南之險其不相與為通塞也皎若列眉朱蔡不知禹之治洪水與濬川澮者各為一役乃欲措百萬生靈於建瓴纍卵之下以施迂濶徒勞之功足知治水之智自别有條理非可坐籌之於几席也乃經云既載壺口大義炳然猶立意見以破古人之成説則非我之所敢知既修太原至於嶽陽蔡氏以此為治汾乃汾水之所以待治者河壅之也河壅於孟門則汾水無所宣逆上北溢於太原逮河既通汾隨河下而濁河故淤留於汾岸故因加修治之功乃但自太原嶽陽而止平陽以下龍角襄陵羣山所東水落崖髙不待修也冀州言修治而他州不言者天子之都一皆司空之所有事若他州在侯封之內大水既平小有未修一付之諸侯之自治不待禹之遍治也覃懷以東且在所略况八州乎於此亦可見禹之治水不先畎澮也馬碧梧謂餘州無事陳新安云以例餘州皆失之衡漳孔氏曰漳水橫流入河蔡氏因之今按河水自孟津至大伾嚮海東北流而濁漳水自壺關出伏牛山南嚮阜城亦東北流其入河也夾流俱下而相湊非橫入也水經言濁漳水在冀州城西北衡水入焉信都記云衡水歷下博今深州城北而迤邐東北注謂之丸爭曲水味苦鹹俗稱苦河亦謂之黃漳河則衡漳蓋二水也言衡漳者猶言媯汭河雒從其合流之地而紀之也衡漳九河恆衛大陸碣石自周定王時河徙砱礫失禹故道至漢奪漯水以南自今利津縣入海其一枝奪濟南流入淮而禹河故道議者以無稽而爭訟乃考之於經文參之以地𫝑則當禹之時大河固奪漳水以流也大河之東自出河隂入於沙衍之墟土弱形夷既無髙岸以束之其上流所遷差以尋尺則下流浸相懸遠而所趨之地必就低下他水之流先有川焉是自然一定之低下必見奪而與俱流者也故或北或南俱奪他水之流以入於海而水所不流故為崖岸則必其高焉者𫝑不得捨其低下舊通之徑橫激而上越陵阜以復求低下於他所故漢初奪漯而與俱行其後奪濟而與俱行又其後奪淮而與俱行宋奪大清河而與俱行元奪會通河而與俱行今則全注徐州南奪淮而與俱行自非溪澗小水必不冒之以過他水自縱而河自橫也禹河故道既得漳水奪與俱行必不能溢於漳北明矣凡大山大澤之𫝑髙下之形以山水為凖去山近則其髙也迤邐漸下以至於川去水近則其下也迤邐漸髙以至於山必無有山焉崛起汚下而忽髙之理北條之山沿大行而北而井陘又北而恆山又北而紫荆又東北而居庸東而天夀又東而古北又東而密雲遵化又東而山海關則經所謂恆山至於碣石者也而凡此諸山之趾必無忽然遽下之理則保定以東放於薊州永平之南境皆山之趾而髙於大名廣順深冀河間者也漳水之流東北經濬縣故經云至於大伾又北過廣平縣又東北過威縣又東過南宫縣又東北過冀州南故水經云北過堂縣扶桞東北過信都而蔡氏所引古洚澤自唐貝州經城縣北貫穿信都亦顯與漳合故經云北過洚水而所謂大陸者自當在景州交河之境固不當謂即巨鹿亦不可謂在西山之麓也濁漳水自清河故城景州至交河而與清漳水合自此而北則天津靜海之南其為九河之故道無疑矣禹之導河自雒汭北流經懷孟陽武東至濬又東北至內黃魏縣得漳而奪與俱流其合漳也不於臨漳既以彰德地形因林慮之餘髙為之阻隔則陳氏以孟康所云王莽河為禹河者既不察於鄴城髙下之𫝑而既奪漳流以後恆水自深州東來與清漳合流而下衛水自靈夀縣與滹沱合流而下至於交河二水又合乎濁漳而與河俱行故經云恆衛既從從者河水在南東北流恆衛在北亦東北流施道同行至交河而隨之以下也河奪漳流與至交河則去海近矣去海巳近地形必極乎下故於此而東北播為九河以逹於海此自然之𫝑也天津之南鹽山無棣霑化利津九河之委流也東光則有胡蘇滄州則有徒駭樂陵則有鬲津海豐則有馬頰漸次分疏而非如指掌之平列故許商云自南以北相去二百里李垂云在平原而北趙稱云自冀抵滄棣始播為九河蓋其去天津密邇河益大地益平非漳流之能勝故因上流既治之後推洗坌下任其支分而洪水略定沙渚漸出髙者岸而下者河巳成九道則下者闊之髙者培之行所無事而河巳安流入海矣古迹具存衆論固定程氏無端矯立之説而朱蔡因之以為九河在碣石入海則當自交河而北舍近下之徑逆挽而又北之不然則當自冀州而掘髙堅之土挽河而懸載之於保定絶嘔夷桑乾直沽灤水潢水過樂亭榆關而以逹於碣石吾不知河之越此嘔夷桑乾沽灤潢之五大水者何以不隨五水東下而能凌空飛渡以北也且所經之地皆濵海鹵舄之土禹何法能遏之而使不通如其築海岸數百里之地斸山麓數百仞之瀆塞五水入海之道盡挽而北之則河之為害遠之惟恐不速乃業巳近海而又勒之以殃五百里之人民即至愚者不為而况神禹矧築海岸塞大水掘山麓即役使鬼工演幻術而亦萬無可成之理也哉諸儒不察乃信新莽侫臣王橫之言以盡反古今之成論非豫之所知也且橫之言曰天嘗連雨東北風海水溢西南出浸數百里漸沒九河之地今據北海曲岸之形𫝑自蒲臺而東至於長蘆北抵直沽則岸曲嚮東歷馬城樂亭至山海關而益以東矣山海之東北連寧錦陸地數千里去海逾逺使九河而在碣石必東南風吹簸登萊以北之海水溢於西北而後九河以沒今云東北風海水西南溢則碣石之水且隨風南去而沙汀以出其受溢而漸沒者必天津以南之海岸可知巳是橫固無以證九河之在碣石其從而附會者酈道元之過也况乎當橫之時韓牧已知九河之有迹而未嘗沒乎若經所云夾右碣石入於河者以紀島夷之貢道所經過之地文從其略言島夷自北而來夾碣以渡大洋逹於天津而後入於海也碣石去河雖逺要可約略紀之如揚州言沿江海逹淮泗江淮入海異道不妨捷言之也且所云島夷者遼水之東海蓋金復之地欲至於天津故徑碣石假令河水在永平之境則徑當從弓弦山渡洋為近不必更繞碣石之左矣經云至於碣石本以紀山而非以紀河也明甚山自有山之條理水則以下為趨惟壺口雷首底柱山夾河行出山以後河自南而山自北河南而東至天津之南山北而東至永平之北河云入於海者流之合也山云入於海者支之盡也安得概以為一哉經言導水不言載水孟子言水由地中行不言水由山側行故曰禹之治水行其所無事也今乃云載之髙地又云穿西山之趾則明異經文而大背乎孟子之説為此言者不過見江南田野有壅水而載之山趾以為堰灌田而妄意河之亦可如此不知禹將全堰大河之水使過冀之北土其亦如塞堰者收灌溉之例乎且堰能分溪流而不能回全溪以他往况大河之莽莽者哉西山之趾其髙過於魏博滄瀛者不知其幾許如必欲挽河使北不知當掘最髙之地深至幾百仞而後河流可通計非八年之所能竟且為此言者使行冀北永平之地求其故渠將何所指以為是豈禹運神力以開之後復有神力以堙之者耶且使禹不揣而掘山以載水使北矣乃其在大伾之野水有自然低下之道即可保其穿山以後之束於岸而不潰而當初北之地雖橫築數十丈之堤亦不足以當下流不快上流日增之𫝑崩潰漂流千里魚鱉慘哉其背天常斁彛倫而圯族於無窮曽謂禹之不仁不智乃至此乎經紀九河在兖而不在冀而與雷夏既澤之文相連若碣石則固繫之冀矣河之入海終始於兖禹之不移兖害於冀也亦以徒移害冀而終不能分兖之災也如云禹因河畫州天津靜海順天永平之南境皆為兖土則又何以紀兖之貢道但及濟漯而不紀灤潢直沽桑乾嘔夷之五水也以此考之言禹載河於髙地者無一而可乃宋人之為此言者則有故矣熙豐間王安石倡為回河之邪説吕大防踵其誤以敝宋而始終力主順河自流之議者惟蘇氏兄弟也雒閩諸賢遷蜀黨之怒暗中安石之毒而不察乃欲誣禹以障水回川逆天殃民之事其所據為指證若王橫酈道元之言皆安石之所尸祝者也使然則吳安持之功不在禹下矣藉令諸君子能公心宅物不以人廢言而一存蘇氏之説則豈有此蔽哉若南渡諸儒畫江以居而不識兗冀之事又其偏信之病所自深也灉沮會同蔡注以汴為灉雎為沮按經紀此二水於兗州而汴水出滎陽縣大同山過中牟祥符故水經云出隂溝於浚儀北東過寧陵與睢水合又東過亳州蒙城縣故水經云東至梁郡蒙縣為睢水又東至懷逺縣荆山口入淮其與水經言至彭城入泗小異則以為黃河所奪挾之南下淤其入泗之口也睢水出睢州東北經歸德府東過宿州故水經云出梁郡鄢縣又東過睢陽縣又東過故相縣當蕭縣南入於泗睢之或合於汴或合於泗古今小異然其所自出一在滎陽一在睢州則豫州之域其合也於蒙城其入也於蕭縣則徐州之域不於兗土而會同也沂在泗北泗在睢北睢在汴北徐州之境北盡東平巨野東直費縣海州安得兖土南侵徐鳯乎則灉非汴沮非睢可知此紀灉沮上連雷夏下接桑土雷夏既在濮州桑土者鄭玄詩譜説為衛之東境自濮以南則為曹魯之地而桑土屬衛必在濮北後漢書注引博物志云桑土在濮陽者是也則灉沮之會亦近是爾爾雅水自河出為灉濟為濋朝氏以沮有濋音謂沮即濋但言灉自河出則凡河之枝流皆可謂灉猶自江為沱而成都之繁昌荆州之枝江皆有沱水也漢以後河日南徙故枝流亦在南而汴謂之灉禹之故道河在北則灉亦在北也禹河自大伾而北奪漳渠以去去濟絶遠兗之貢道乃云浮於濟漯逹於河則河之經流雖相去邈絶而其枝流尚有會同之處蓋兗土卑下斜出成川旁午不一非如峽岸之流彼此無相合之𫝑也然則此灉水者蓋在大名廣平之交河水旁出南溢逹於東郡濮陽之境而沮者則濟水於曹州之北旁出北流以與灉會於濮以俱下而流於濟南其會同之處固兗之西土也濟以逹沮沮以逹灉灉以逹河故曰灉沮會同言河濟之於此會同也王氏炎曰沮出濮陽灉出曹州蓋為近之然濮在北曹在南河在北濟在南則沮當在曹州而會灉於濮東濮去禹河既遠不得有旁流之河倘以為灉沮非河濟之旁出者則兖西為沙壤無有水源其不能别成一渠於曹濮而必因於河濟亦明矣若今無此二水者以河濟遷則灉沮竭可以今之地理求難以今之川澤求也汴睢云乎哉經紀兗州之水獨詳於曹濮之間者以此土北鄰濬魏南距睢歸河流其北濟繞其南二瀆交控無髙山廣阜以限之故易為灌漫而治水之功倍也功倍則辭詳矣草木穀之産因於地之宜地之宜驗於草木之生故經於辨土之後紀其草木之别所以物土宜而審播種也南北異地九土異質風氣異感故草木異族而百穀亦異産矣繇條漸包夭喬者草木因土性之故别非由治水而始然也當洪水汜濫之時草木暢茂榛蕪薉塞土荒獸逼故益焚山澤務芟除而不務蕰崇之林氏乃謂洪水為患草木不得其生至是始遂其性豈知草木之性遂適以害嘉穀塞塗徑深沮洳釀嵐蠱蕃禽獸以與人爭命乎古之建國者以拔木通道為事詩所謂拔柞棫春秋所謂啓山林是巳如以草木蕪盛為平成之績則今猺之有洞苗之有箐其將平成於中土哉則經紀草木以物土而非序績可知巳繇亭茂也草之莖生者也漸進長也進而漸長不已草之蔓生者也夭少長也草之臺生者也條長也細而長也木之孤幹獨擢者也包叢也木之科叢盤生者也喬髙大也木之枝幹兼偉者也三州所産族類之不同如此猶土有白黑墳壤之異也土不因水已治而改其質草木亦不因水之治而異其狀也所以惟兖徐揚三州紀草木者此三州平衍之區無髙山大谷草木鮮生可以區别而六州之或山或谷或原或澤不齊其地一州之間各自殊别不可定也王氏炎曰南方地暖草皆少長而木多上竦河朔地寒雖合抱之木不能高也得之矣大野蔡注引地志在山陽巨野縣北又云鄆州中都西南亦有大野陂中都今汶上縣巨野之北正值汶上之南非有異也大野於宋為梁山泊滙南旺湖而為一及永樂中開運河始畫而為二南旺之東又有蜀山湖亦謂之南旺東湖凡此三湖瀰漫三百六十里皆大野之所瀦也大野之水其源本於汶而不因於濟濟水自由張秋過夀張掠湖而東北以注於濟南大野之水則南下魚臺而注於徐邳山海經云濟水絶巨鹿澤郭注云今在髙平絶者絶而過之之謂非言濟水畢注於此若水經所云濟水至乘氏縣南分為二南為菏北為濟酈道元謂一水東北流入巨野澤蓋當後魏時濟水之枝流偶注焉而桑欽所云菏水者下又云東過湖陸縣今魚臺入於泗則亦與汶俱流至魚臺而南未嘗絶而無所往也天下無絶而無所往之水蔡氏以菏為巨野既徇末失本而又以為濟水所絶則尤不審於山海經絶字之義若何承天云北連清濟則連濟而非原於濟承天初未有失而濟水掠大野之北徐定盡於大野之南岸徐終不得有濟也蔡氏生於東南當山東淪陷之後一惑於道元之説雖以當時顯著之梁山泊且不之察而况其他乎蠙珠蠙説文正作玭宋𢎞云淮水出玭珠即此古之珠皆以玉為之後世南粵即通中國合浦之珠始登服飾而謂之真珠真云者言其不假琢而圓也若以蚌甲為珠則物賤而色黯古謂之蜃以飾器物所在有之不必淮夷按説文玭即瑀也琢美石以為珠赤者曰琚白者曰瑀大戴禮所謂玭珠以納其間蓋佩玉之一也佩以象德而有玭珠豈佩蚌甲而可以象德乎蠙珠之貢蓋以供佩玭之為蠙者借用也若蠙字正音蒲邉切蝨也唐張蠙夢名蝨登第而改名蠙以應之則蠙固非蚌蔡氏之踈兩失之矣浮於淮泗汳汴通水至蒙為灉水東入於泗者漢河南徙之道也泗入淮故淮合泗汶入泗故泗合汶汶在巨野合濟之支流濟合灉灉源於河則經所謂浮於淮泗逹於河之道也蔡氏兩引許慎説文未決所從當以後説為定蓋禹河故道自雒汭孟津北過懷慶合衛河而入濬魏初未自河隂南下經滎陽祥符之境則汳水隂溝水皆無從得受河以成流當禹之時無汴水漢河南徙而濮州無灉時異水遷不可強同巳三江經於此言三江後導漢云北江導江云中江傳注家合二為一故徒滋繁訟以實求之彼云東為北江東為中江自上遊而言潯陽以西之江也此云三江者自下遊而言蕪湖以下之水也知然者以經云三江既入震澤底定猶徐州所云大野既瀦東原底平大野瀦而東原平大野者東原之浸三江入而震澤定三江者震澤之源與支流也蘇子瞻惟不知此乃欲以味辨之其亦細矣江水自蕪湖而東其下采石過應天儀真鎮江至通州入海者所謂揚子江大江之經流也乃海潮之上直至小孤山則小孤東北水𫝑巳平漫特江南有鴈山九華諸山麓以束之江北有石鏡巢山諸山麓以束之則岸髙而不能旁㵼至牛渚之南敬亭一帶山𫝑巳盡采石北阻不能盡納大江之流而蕪湖東南地𫝑汚下可容旁溢故分水别注自髙淳溧陽抵於宜興之南所在瀦積為丹陽固城長蕩諸湖而注於太湖其一則分自貴地徑寧國縣由廣德長興而注於太湖水經所謂東至石城縣南分為二南江又東南徑宣城之臨城縣今青陽又東與桐水合廣德之桐池又東徑寧國縣南又東北為長瀆東則松江出焉者是巳是震澤三江之首也今其水之徑溧陽者中江之名固存也而既入太湖以後其經流上承中江徑直之𫝑自鮎魚口經蘇州太倉入海者一江也今婁江其自吳縣長橋東北合龎山湖過松江上海之北入海者一江也今松江自大姚分支過青浦之溆山湖東至嘉定縣界合上海之黃浦經嘉定江灣自上海之南入海者一江也今東江凡此三江皆太湖之委也委流順則從出之澤亦平故三江入海而震澤以定也史記正義及吳地記之説皆確有可據要其上流則皆自蕪湖東南分大江之支流者也朱子以薛士龍之言為信與蔡氏所引唐仲初之説要為不誣故水經亦云江水竒分謂之三江口其與後所紀之北江中江相去千餘里強而合之則愈迷亂而不知所從矣若大江自采石東下之經流經不紀者自然之瀆未之加治也九江孔殷殷之為言中也盛也物中則盛故殷亦為盛也九江孔殷者言九江之流甚盛也所以然者以江漢朝宗九江孔盛文義相連漢合於江江行以緩故九江為之盛也漢九江郡治在夀州其地則今鳯陽和州是已至隋始以尋陽為九江而漢地理志云尋陽南有九江東合為大江者則尋陽之小水也漢尋陽縣在江北今之望江宿松也若今九江府之德化縣在漢為柴桑縣然則漢志之九江蓋皖水之源其出有九云尋陽南者縣在懷寧之南望江之北皖自其南而入江也若尋陽記所稱烏蚌諸江則洲渚之分誠有如蔡氏所駁者而朝公武乃云一江而稱九江猶太湖一湖而稱五湖昭餘祁一澤而稱九澤殊不知昭餘祁者九澤之一或不審而名之曰九湖之有五則長蕩湖射貴湖上湖滆湖與太湖而五本非一也湖本有五澤别有八而九江安得一也乃朱蔡以洞庭為九江尤有疑者經云過九江至於東陵東陵者巴陵也九江在巴陵之西而為江水之所經過若洞庭則在巴陵之南江水未嘗過之也水經九江在長沙下雋縣西北下雋亦巴陵也洞庭在巴陵之南固不在其西北亦明矣楚地記曰巴陵瀟湘之淵在九江之間初不言九江在巴陵瀟湘之間又經云岷山之陽至於衡山過九江至於敷淺原經文雖簡而衡山之於九江九江之於敷淺原雖限以大江其山𫝑必有相因者洞庭之浦東西相去四百餘里山形濶絶不相連接經蓋言衡山自長沙嶽麓而下順洞庭西岸沿石門慈利濱江東北行至荆江口逾江而為蒲圻興國諸山過德化以訖於廬阜則過九江者非過洞庭亦明矣唐詩落日九江秋注云江自荆南而合於漢沔間者有九一曰川江即大江二曰清江源出施州衛之西至長陽入於江三曰魯洑江四曰潛江出自漢水而會於江五曰沱江夏水也六曰漳江出南漳合於江七曰沮江出房縣八曰直江公安之油水也九曰漢江蓋此九水自長陽而東漸合於江至漢口而後江漢水合則漢陽以南城陵磯以西皆為九江合流之地江𫝑大盛故曰孔殷也而此上下三百里間正在巴陵之西北故水經云在下雋西北乃九江之首起於長陽故經云過九江至於東陵而湖北諸山隨江西下放於江漢之間然後逾江而過武昌之南嶽州之北於導山之文亦無不合契者斯以為禹貢九江之定論也皖口柴桑洞庭之釋要於經文無取沱潛既道濰淄其道濰水淄水至夀光而合入於海也道之為言通也沱潛既道沱潛合一而江漢通也沱者今之夏水楚莊王滅陳鄉取一人以歸謂之夏州居之於此水之側故曰夏夏水首出於江在江陵縣東過華容今監利至雲杜縣今潛江入於沔蓋潛水分漢於潛江之南而沱水自監利北注之江漢之支流早巳相通於漢口之上時其岸狹渠小故江漢之經流必至於漢口而始大合但有水可道則漕貢之舟取其徑直平夷可以捷至漢水而避自荆嶽逹鄂浮江泝漢七八百里迂險之衝故下云浮於江沱潛漢此之謂也雲夢江北為雲江南為夢蓋平原大澤地𫝑相連而江水分畫其中也其地在江南者為松滋石首公安安鄉在江北者為監利以西至於江陵之東跨江瀕湖南盡於澧而北盡於漢也漢地理志華容有雲夢澤華容至梁始徙縣於南平郡之南安則今縣是而故華容今為監利故水經亦云雲夢澤在華容縣東而郭璞爾雅注以為巴邱湖者今俗謂之西湖其濱則江南之夢而雲在其北也子虛賦所云方八九百里雖為侈言要盡漢南湖北亦幾幾近之矣蔡氏所云華容枝江者良是而又云江夏安陸則跨江而東踰漢而北𫝑巳遼絶且江夏有黃鵠鳯皇諸山峙立江岸安陸居章山陪尾之麓為原為阜亦不得謂之為澤德安之有雲夢縣則西魏侵地漢上欲誇其境土之逺而以江介澤藪之名被之於漢北南北分爭僑置郡縣名實相謬沿而不改若此類者衆矣杶幹蔡氏謂杶木可為弓幹而以杶幹為一木不知杶即椿也其木脆而易折不中弓幹之用人家田園所植芽為人采多不易長深山所有者或大至十餘圍色赤而理堅可鋸為材用性辟蝨蚤故今人以作牀榻莖葉固如蔡氏所云似樗者貢之以為什器爾此木惟荆土多有閩廣人不食其芽動見砍伐固宜蔡氏之不識而又當宋末武備弛廢之時抑不知弓幹之不可以椿為杶自杶幹自幹孔氏以幹為柘當之柘而云幹者猶詩言伐柘而云伐輪也伊山海經言熊耳之山伊水出焉郭璞云熊耳在上雒縣南漢地理志盧氏有熊耳山伊水出蔡氏以郭説辨地志之非不知𢎞農商雒之間有三熊耳山一在陜州之南盧氏之北逹磨之所葬蔡氏疑盧氏止有此熊耳因謂伊水不出其下固是一在商州之南武關之西與郭璞所云在上雒縣南者相亂蔡氏遂以為伊水出此而疑其與盧氏相逺因以闢地志之非者也南召之西內鄉之北雒水之南有熊耳山與東關鸞堂毛葫盧之地相接水經所云雒水東徑熊耳山北者此則伊水所出其地亦𨽻於盧氏而斜繫商州之東南則郭璞所云與漢地志本一而非二也水經云伊水出南陽縣西蔓渠山今謂之悶頓嶺地𨽻盧氏從此而東過陸渾今嵩縣新城伊闕俱伊陽以入於雒蓋山海經漢地志所言熊耳者統紀其地而水經之蔓渠今之悶頓則直􅑴其源也要以伊水所自出在武關之東而不在其西繫之商雒則失其實矣滎波滎波言豬必有聚水蓋濟溢南流至於滎陽之東以地𫝑平下而聚則所謂滎澤是巳至漢巳堙為平地而不復有澤波自雒出者水經所謂雒水徑宜陽縣故城南又東北出散關南又東枝瀆左出者也迹其下流居宜陽之左則必在雒汭之西而與河會去滎絶遠乃經合滎言豬又繫於伊雒瀍澗入河之後其在雒東可知固當以山海經之波水為正蓋雒東小水合於滎澤者也菏澤導者因𫝑而下導之也水之東流水之𫝑也北之西髙而東下地之𫝑也蔡氏以曹州之菏水為此菏澤則水本在東逆西上而被孟諸豈理也哉荷澤者濄水也許慎曰濄水受扶溝浪蕩渠東入淮水經云隂溝水出河南陽武縣蒗𦿆渠東南至沛為濄水又東至下邳淮陵縣入於淮蓋此荷澤由陽武東徑祥符之銅瓦箱東南過蘭陽北又東過儀封南又東過睢州北又東至虞城被孟諸而過之又東過夏邑東南過豐縣東至沛州飛雲橋乃得濄名東由徐逹邳而入於淮今其下流謂之濄其上流謂之隂溝亦云浪蕩而經則即浪𦿆而豫以荷澤之名爾出於豫經於豫而入於徐若曹州之菏東北會汶與孟諸濶絶且源出於徐不宜紀於豫也漢志睢水受浪𦿆渠東至取慮音秋閭入於泗則荷澤在漢蓋與睢合或自徐州小浮橋注於吕梁矣雖古今遷徙於沙壤者流委不一然孟諸為下流荷為上流源發於豫不發於徐則經文之不可易者其為銅瓦箱所分之河渠無疑矣黃河南徙則此荷澤為其經流也蒗𦿆渠之荷從草下何曹州之菏從草下河經文自别嶓東西二漢水其下流皆名曰漢其所出之山皆曰嶓冡相承淆訛合而為一者緣經言嶓冡導漾與水經以西漢水為漾東漢水為沔而云漾出嶓冡沔出沮縣東狼谷遂使古今失據合二漢水二嶓冡而一之也杜佑通典云嶓冡有二一在天水一在漢中在天水者西漢水之所出在漢中者東漢水之所出也以地考之無有如佑之切者漢地志漢陽郡西縣故屬隴西有嶓冡山西漢水此杜佑所謂一在天水者也若經所云嶓冡導漾東流為漢又東為滄浪之水至大别入江者杜佑所謂一在漢中者也蓋西縣天水今併入秦州在南條山脊之北於禹貢屬雍而不屬梁則此既藝之嶓其在天水之嶓可知而天水嶓冡所出之西漢水自秦州嶓冡之南流經鳯縣大散關南過略陽之西又南過階州之東又南過昭化劒州廣元閬中又東南過南充鄰水又南至江津之北入於江其始出也雖近於東漢而其過漢中既限以青泥雞頭之阻其入川北又隔以金牛褒斜之險則終不得合逮其下流早巳合岷江於重慶之西不隨東漢為滄浪過三澨至大别而後入江也則經之言漾非西漢之源而經之言嶓非秦州之嶓明矣若東漢水之下流既一一與經為合而所出之嶓既此既藝之嶓在梁而不在雍其以東漢為沔西漢為漾者水經之失也孔氏曰泉始出山為漾水東流為沔水至漢中東流為漢水如淳曰北人謂漢曰沔漾沔漢蓋東漢一水而三名西漢不得為漾也此之嶓冡在今寧羌州之北兩當縣之南宋王仁裕放猿之地兩當在漢為武都故華陽國志曰東漢水出武都縣固梁州之北境也漢水始出為漾南過寧羌又南過略陽之東始與沔合沔水一曰河池水略陽漢沮縣也故華陽國志曰沮縣河池水所出東狼谷也桑欽之紀沔水與國志同特不知沔非東漢之源東漢自出於寧羌之嶓冡在略陽之北謂之漾至略陽合沔水乃謂之沔至沔縣而東過漢中府始名曰漢經云嶓冡導漾東流為漢者此也其不言沔者沔入漢而非漢之源也桑欽不逹於漾為東漢源沔合於漾而以漾名加之於西漢酈道元乃昏於二漢之源流各别乃云東西兩川俱出嶓冡同為漢水桑欽知有秦州之嶓冡而不知禹貢所藝梁州寧羌之嶓冡酈道元遂合二嶓冡而為一乃不知西漢之自雍南入梁而逹於江今謂之嘉陵江東漢自梁之北境東沿雍梁之界入荆而後逹於江今固謂之漢江也蔡氏既知西漢水徑葭萌入江矣又惑於酈説強二漢以同歸合兩嶓而為一而曰嶓冡一山跨於兩縣不知秦州之去寧羌相去三百餘里中隔西和成縣兩邑二百餘里之原隰又有空同天井仇池朱圉諸山之間隔兩縣不相為接壤而亦安得為跨乎秦州之嶓冡北連汧隴其為雍地無疑寧羌之嶓冡在漢中之西與巴蜀共為益州共為華陽則亦共為梁州也沱潛水自江出者皆為沱蔡氏以郫縣汶江皆有沱而不知沱之大者在新繁也蓋江水始發未為峽束隨平壤而四溢沱不一矣水經云沱在湔口之東都安之上湔口在石泉縣都安今之灌縣沱之在郫西者也華陽國志云大江自湔堰至犍為有五津始曰白華津二曰里津三曰江首津四曰涉頭津五曰江南津五津之地上􅑴石泉下汔井研皆江沱之道旋出旋入而共合於嘉定也舊云水自漢出為潛按經所紀漢皆東漢也東漢之潛自在荆土今此繫之梁州則此潛者非自漢出而即西漢之别名西漢不見於經蓋在古謂之潛而不謂之漢地志所云巴郡宕渠縣西南潛水入江者是巳宕渠西南今鄰水縣嘉陵江之入江也於此酈道元潛水入大穴之語細碎而不經蓋不足信唯西漢之即潛故下云逾於潛者言􅑴潛而上至於略陽鳯縣之間西漢水與東漢水相去巳近而二水不相為通則陸運至略陽之東而後復浮於漢亦可證經之不混二漢為一水矣道元亦知西漢之即潛而非漾故又曰自西漢遡流而屆於晉夀界阻漾枝津南歷岡北迤邐接漢沔則以明潛漾之源委各别不相通矣而為説紛紜自相矛盾蓋雜採他説以成書得失並存而不知所裁蔡氏惑其所失而不考其所得徒知沔渭之間絶水百餘里乃不知東漢西漢之間絶水亦百餘里乃以疑經逾於沔之文不亦踈與和夷和水出天全六番招討地天全六番宋之和州也和水下流注於青衣水朝氏徑以為青衣江者亦誤朝氏又曰夷水出魚復至夷道入江此乃施州衛所出之清江至長陽縣入江者與和川相去東西三千餘里和在梁而夷在荆不得連類並紀如覃懷原隰之文而屬之蔡蒙旅平之後和夷者和川之夷猶言島夷萊夷曽氏所云嚴道有和川夷人居之是巳天全六番至西魏始入版圖禹因平蔡蒙而及之以循水之源而為治江水之資也西傾西傾在洮州衛之南與松潘接壤因桓是來者因於桓水而來貢也桓水今謂之羌水自文縣千戶所繞南山太白而入於西漢水經以桓水入於南海者誤羌水西南正當坤維之脊地𫝑極髙而又有西番之一西八思今河董卜韓胡之黑馬出河皆東流合於江桓水安能絶之以南耶西傾不屬雍而屬梁者雖在岷洮之西而實太白劍門南北相值也渭汭蔡氏云汧源縣弦蒲藪有汭水即詩之芮鞠今按詩言芮鞠之即紀公劉遷邠之事芮自在邠去隴州之弦蒲藪幾四百里公劉之國其疆域不至汧西則芮者乃邠州之小水今所謂宜祿川是巳若弦蒲藪所出之水乃汧水也汧自寶雞入渭而不與涇屬使以汧為汭而汧不連涇徑逹於渭則當云涇汭屬渭不得言涇屬渭汭也汭在邠而涇過邠東汭水因東流注之故曰涇屬汭宜言涇屬汭渭乃先渭而後汭者則以汭小而渭大爾漆沮雍州有二漆水其一出永夀縣東過同官北至耀州東合於沮沮水出中部縣南過宜君今子午水東南至耀州合於北雒水此二水皆非徑入於河而由北雒北雒合二水直入於河而不由渭以逹河蔡注云入渭者誤乃經文云既從攸同則皆主渭而言而非以河言然則此漆者蓋扶風杜陽之漆水而沮水無考則或麟遊水湋水之類古今異名也朝氏之言深為有據乃程氏以經序渭水節次不合疑之不知由涇而汭由汭而漆沮由漆沮而灃自北迤南以紀入渭之諸水節次未有亂焉何得屈由雒逹河之漆沮強所本不然者而誣之入渭乎吉日之詩曰漆沮之從蓋亦謂此朱子以北雒當之周王不應度涇而北從禽於三百里之外也原隰豬野三危黑水蔡注因詩以原隰為邠之隰原據地志以豬野為涼州之休屠澤今按邠之去涼幾三千里而中又間之以涇渭限之以黃河不得言至於豬野也經所紀者因近漸遠𫝑必相鄰若覃懷之於衡漳是巳上志鳥鼠下紀邠地則既越隴坂之阻逆回而東者千里又遽北折而西及於涼土迂回遼濶序次乖張禹貢一篇無此義例則原隰豬野皆在鳥鼠之西南無疑巳鳥鼠以上紀洮東原隰以下紀洮西則此豬野皆洮州衛之青海也西寧亦有青海俗呼之訛爾廣平曰原下濕曰隰原隰所在而有非有適名冷地峪以西臨洮以南濵河以至於青海其地平下皆原隰也三危山漢書注以為在沙州燉煌縣以地按之蓋亦失實後漢書曰西羌之本出自三苗薑姓之别也其國近南嶽及舜流四凶徙之三危河關之西羌地是也濵於賜支至乎河首綿地千里賜支者經之析支也漢河關縣屬金城郡今蘭州後改屬隴西郡今鞏昌今之河州衛是巳地志云積石山在河關西南河水所出三危在河關之西當與積石相近以地度之則亦在河州之南洮州之西疊溪之北濵於大河之東而非在涼州亦審矣水經云在燉煌縣南遠紀之也實則有湟南湟北河東河西之别而相去幾千里矣意河西四郡當禹之時未入中國而雍梁二州極西之地止於積石非能逺至瓜沙之境故導山之文始於岍而卒於岷北不逾湟水而南不至越嶲也黑水為梁雍二州之界而梁州斷無跨河以北之理云導黑水至於三危則三危亦梁之西北而雍之西南皆足徴其為岷洮之境也舊志謂黑水在肅州者其亦誤耳山海經之言黑水者屢矣見於西山經者曰崑崙之邱河水出焉西南流東注於無逹郭云水出山之東北隅黑水出焉而西流於大杅郭云出西北隅所謂崑崙邱者去泑澤四百里也泑澤亦青海見於海內經者曰西南黑水之間有都廣之野后稷葬焉又曰流沙之東黑水之西有鼂雲之國司彘之國黃帝生昌意降若水生韓流黑水既為后稷墓田必不能遠在嘉峪之西而與若水相邇則固在西南而不在西北也王制言自西河至於流沙千里而遙西河者同韓之間去流沙止千里而遙黑水又在其東則必非酒泉之黑水愈明是以孔頴逹亦以居延之流沙去中國太遠而辨地志之非則黑水必更在流沙之東者從可知己蔡氏不能為之折衷隨其篇册既登水經出張城南至燉煌之説又雜採地志出犍為南廣今敘州之文或疑樊綽之指為麗江而終取夫程氏西洱河之言以為定不知在張掖肅州則既不得為梁境在犍為則去三危絶逺不能越峩眉岷嶓而挽之北行且瀘敘不應為雍土若麗江洱河其差彌遠又不待言矣出南廣者瀘水也麗江者出騰衝衛徼外茶山長官司至雲南巨津州為金沙江者也西洱河者出鶴慶府為備江至大理府為滇海者也瀘水入江而不入南海麗水洱水雖徑交趾逹南海而皆在梁州極南之境去三苖所居之三危山川修阻幾五千里樊程拘於入南海之文而蔡氏生於宋季雲南不入版圗因以忖度滇北之連乎西羌而不知其舛之甚矣以實求之黑水當在西傾積石之間或脫桚河出河之類又或其即為湟水古今異名遂無可考其云入於南海者由文字之訛以入於南河為南海河在積石之外行於畨夷當中國之坤位故曰南河守文以核地不如按地以定經要以黑水既至於三危則川陜西陲近自岷山瓦屋大相小相逺則大雪山而極於于闐天竺崇髙連亘斷無可至於南海之理此經文之必當傳疑而不可強為遷就者也以黑水在肅州則洮河積石臨洮鞏昌甘涼西寧俱應為梁州之地而雍之西界應在亦集乃是雍不當有弱水三危以西洱為黑水則全川皆雍州之地而大理以南始為梁州凡此皆悖謬之尤隨文立詁而不相通也奚可哉以後漢書定三危之所在而原隰豬野弱水黑水崑崙析支皆相櫛比不致滋古今之大惑矣崑崙崑崙一山古今積為夸遠之説倡始於漢之術士而成於王嘉之誕説蔡氏破羣迷而曰臨羌者定論也臨羌於漢屬金城郡在今金縣之西河州之東與積石密邇山海經所云崑崙之邱河水出焉者據其入中國之始直謂之出則以內夏外夷而不必窮其源也經以崑崙與析支渠搜並敘者亦知其為附徼西戎之地矣桑欽惑於邪説乃云去嵩髙五萬里使其在五萬里之外安能與西戎同其就緒哉司馬遷不知近有崑崙在雍州之境顧逺徴之張騫而曰烏覩所謂崑崙好竒之過曾不察夫禹貢之本文為岡而已山海經之言崑崙者曰邱非有崇髙莫並之山也必求其地則臨洮之胭脂嶺蘭州之臯蘭山河州之普􅐌山洮州之雪山皆足以當之古今異名無從定耳後人不察乃指肅州玉門以西之山為崑崙而崑崙之實愈晦據禹貢之本文守蔡氏之定説其尚求崑崙於河洮之間哉渠搜蔡氏據水經謂渠搜地近朔方不知朔方之渠搜在河湟豐州之東受降之南於中國為北於種類為狄而下云西戎即敘則與析支同為西戎其非朔方之渠搜明矣夷狄以部落顯不以地著遷徙而仍其故號或此戎當商周之世徙於朔方秦漢有其地因築為城抑或當秦之時斥地河湟徙渠搜於北河之南俱未可知要之虞夏之世渠搜固在崑崙析支之間也析支西去河關千里蓋今邈州貴德之壤渠搜非北近宗哥則南瀕朋拶世移事易名實互貿我知其為西戎而已其他闕疑可也導山導山之説王鄭以三條四列分之蔡氏辨其非是也而蔡氏南北二條復分為二則亦與王鄭之説相去無幾蓋以我測經不若以經釋經之為當經云九州滌源者一弱水二黑水三河四漾五江六沇七淮八渭九雒也弱水黑水皆雍川也河亘雍豫冀而瀕於兖漾出梁瀕雍而入荆江出梁過荆而入揚淮出豫過徐而入揚渭在雍雒在豫非九州之各自為川而青本無川亦不能張皇小水以與大川亢衡禹貢紀治水因所滌以為川不似周禮職方因已定之土各立川浸強小大而比之同則九山刋旅亦非一州之各有一山審矣青徐揚兖下流平衍之區一行所謂四戰之國也必欲於無山之州立岡阜之雄者以敵崇髙之嶠官天府地者之所不為也夫導者有事之辭水流而禹行之云導可也山峙而不行奚云導哉然則導者為之道也洪水被野草木暢茂下者沮洳瀦停軌迹不通禹乃循山之麓因其髙燥刋木治道以通行旅刋旅之云正導之謂矣青兗徐揚或本無山即有山而亦為孤巒不能取道雍冀豫梁荆則山相連屬附其麓而可屆乎逺乃以崖壑崟欹草木荒塞振古而為荒術禹乃刋除平夷始成大道由西迄東其道凡九也岍岐嶓冡言導而他不言者其故未有道則禹導之其故有道因而修之者不言導也非自禹而導之也九山者一岍為首而屬岐荆二壺口為首而屬雷首太嶽三底柱為首而屬析城王屋太行四恆山為首而屬碣石五西傾為首而屬朱圉鳥鼠太華六熊耳為首而屬外方桐柏陪尾七嶓冡為首而屬荆山八內方為首而屬大别九岷山為首而屬衡山過九江至於敷淺原者九山之餘也近者詳之遠者略之恆山去碣石千餘里岷山至衡三千餘里中無所紀略也九江之東紀以敷淺原而匡廬東南不之紀者非禹貢之幅員也恆山西北飛狐句注五臺賀蘭不之紀者北塞而非旅道也徐揚之潛霍青之大峴福山成山經不之及兗之岱山僅見於州壤而不著於導山者孤嶂不可為道也梁之峩眉荆之二酉五嶺不之紀者南塞而非旅道也若謂九山各於其州為旅祭告成之明祀則當如職方所紀隨州分志不應别紀三條四列而反遺九山之宜載見者矣九山之次第自西北而東南均乎南北則先西均乎西則先北導岍及岐至於荆山岍在隴州視壺口底柱恆山則西視西傾則北自岍而西北禹迹不至地本狄戎因此足見瓜沙甘肅之弱水黑水三危崑崙豬野非禹甸而後人蒙之以名也導岍自隴坂東至於岐又東而至於富平之荆山皆在渭北雖間以涇水而雲陽之山與醴泉相接故岍岐荆雖三山而為渭北之道一也逾於河而山窮矣導岍之次宜紀西傾而及壺口者因逾河之道壺口與荆南北相值即以順而東也始壺口河岸自吉州九原玉壁而南以至於雷首雖間以汾水而兩岸相接形𫝑均髙則折而東北沿羊角三堯以至霍太山其東北為太原平衍之區水嘗灌之矣故壺口雷首太嶽三山為河東之道一也由此而南畫之以安邑平陸舄鹵之地山𫝑既絶中條初起則底柱為河北諸山之首由底柱循河岸而東北至垣曲而為析城至陽城而王屋至澤州而大行軹關天井道以通焉由此以東至於彰衛而山絶故底柱析城王屋太行四山而為河北之道一也於是而與岍岐南北相值之山窮矣魏博邢趙放乎山東平衍之區水落則道出而無所事於刋通矣於是而北則燕趙迤北逹於榆關者以恆山為首以東西計宜後於西傾以南北計則先於西傾且因太行之所絶迤東而順及之也恆山以西出倒馬關緣繁峙而底乎岢嵐偏關以逾河而放於延綏非禹甸也恆山而東北歷飛狐居庸天夀密雲逾灤以東盡於碣石為舜幽州之境繞塞以逹島夷凡千餘里而山相屬其為幽燕之道一也入於海者盡詞也逾隴而西秦徽階文之間重山疊嶂相仍而西窮雍梁之疆域所止則西傾為之首其西則戎也從西傾而東秦州則朱圉北而臨洮則鳥鼠順渭水之南雞頭空同大散斜谷太白甘泉終南子午逹臨潼而出乎華嶽山麓相屬又東放乎殽函而山𫝑盡故西傾朱圉鳥鼠以逹太華叢山之以名著者四而為關西渭南之道一也出關而東河雒為水國而抑為平壤惟雒表為荆豫之脊則以熊耳為首熊耳者盧氏之熊耳非永寧之熊耳熊耳以東自陸渾以逹偃師雖間以伊水而伊闕之山與偃師相接循之以東得嵩山為外方嵩山之南自女几沿汝水又南至寶豐岡𫝑未斷迤平氏而底乎桐柏若桐柏之東裕州之野汝寧之郊皆平壤而山絶矣不復東行而為之南通楚塞過平靖應山以終乎德安之陪尾泗水亦有陪尾非此陪尾其南則江漢之澤國也由此而東穆陵黃土潛霍司空南盡於江禹蓋未之道也熊耳外方桐柏陪尾起豫抵荆而為雒南楚塞之道一也西傾之東梁北之山嶓冡為首以東西計岷先於嶓以南北計嶓先於岷也嶓冢東下為漢南沿褒斜而東自漢中放乎西鄉興安平利白河東逹於均或麓或谷山道以通循武當而盡乎南漳之荆山故嶓荆千餘里而為漢南蜀北之道一也其為山𫝑至南漳而盡東出襄陽則又為平壤矣內方之山北界以襄宜不屬於荆山南界以荆門長坂不屬於岷陽故江北之山以內方為首內方大别相去無幾而得名一山者江漢下濕賴此道以通荆土故為漢南江北之道一也岷山之陽云者猶言岷陽也山南曰陽岷山按劍門以東下其南麓自成都過順慶廣安萬州而扺夔州乃歸巴巫山之險不可踰則避峽中之厄自夔渡江南過石柱又南至銅仁出辰沅東下寶慶以逹於衡山而為自梁入荆南之道焉其間雖紆回數千里而山𫝑相接有通谷巨壑以逹之其為川湖之道一也重慶而南放乎滇黔則固為禹甸之所不至以此益知以麗江洱海為黑水之非矣若過九江至於敷淺原則因衡山而紀荆州東北入揚之山道以衡山之餘西繞湘西連屬不絶故不得别紀一山以為首而自衡山東北至長沙則地𫝑卑下漸為澤國故為依山開道自湘鄉而北至於常澧循洞庭之西岸渡江至荆州沿江而過雲夢之北復渡江以抵通山大冶而盡於柴桑九江之過雖無髙山崇阜而於江漢之中為脊則江湘之水即泛固可通也乃自辰沅徑可逹常澧不必南至衡山則經本互文自衡可循山至澧而自辰亦可出澧而過九江故為岐路之詞言自岷陽而東南可至衡而東可過九江至於敷淺原也乃其統為岷陽可通之道則二而一也若夫兖青徐揚地本卑濕在治水之先則於四載唯舟行在水治之後則平野而可容方軌道不循山無所事於刋除雖有陵阜不勞紀載矣導山之説必此為正若夫三條二條之説則青烏不經之論禹非楊救貧賴布衣之流為人審龍以相宅阡葬亦何用遠捕沙水若此之勤哉何似即下文之九山順本文至於之次序為九旅旅猶館驛也之得耶敷淺原鄱陽縣彭蠡之東隔以太湖山不相屬朝氏謂敷淺原在彼其説固非乃蔡氏以廬山當之亦未為得髙平曰原匡廬矗起壁立不得謂之原也水經云敷淺原在歷陵縣西南漢之歷陵今之德安廬山在九江之東德安在九江之西敷淺原更在德安之西則武寧寧州之境矣蓋湖廣武嶽之東北興國大冶九宫鍾台諸山迤東而至於九江之西南山𫝑巳盡而垂乎德安之博陽又東則章水之瀕復為澤國其東北之為匡廬者亦孤嶂瀕湖而無所往也蔡氏以廬阜最髙所當紀志不知經之所詳非水所待治則陸道所經若非水陸之衝則冀之五臺揚之黃山白嶽雍之褒斜梁之峨眉巫峽荆之武當徐之天柱俱不見於篇一匡廬云乎哉朱子謂人過而非山過道所不過禹不之導則塊然匡廬亦何足以登於經弱水合黎甘州鎮夷所有合黎山舊云禹導弱水至此漢隋地志皆云弱水出刪丹縣今按山丹在甘州東百二十里合黎在甘州之西至於合黎合黎山下有水即謂之合黎河一統志乃謂合黎之水為黑水而以瓜州之且樂水為合黎河其謬甚矣餘波入於流沙者水經流沙在張掖居延縣東北亦甘州也弱之經流導之至鎮夷所而止鎮夷而西地屬畨夷禹所不至亦不問其何所歸矣餘波則自刪丹分支導之至甘州而止要以導弱水入夷地絶其東流毋滋河𫝑其下流所委則一聽之不疲弊中國以治夷狄之水也甘州雖在涼州之西而於河湟為近禹因治黑水之便渡湟治之若西而酒泉燉煌地屬西畨北而莊浪寧夏地屬北狄皆四載之未至隋志謂流沙在燉煌杜佑云在沙州西八十里蓋誤以沙州之鳴沙山為流沙其為荒遠不足信也同為逆河同之為言皆也同為逆河言丸州之皆為逆河也凡水之行以上流高而下流下上流淺而下流深上流狹而下流廣為順反是為逆水之入海其從來雖陡速而近海必平且淖落則順下潮生則逆上其隨淖而逆上也上流狹淺則近海之地必且涌溢而漫流故禹疏九河於淖所可至之地深濶其上流以受淖之逆上故曰逆河所以救海濵之地岸不為海蝕也而九河之尾皆逆非合而為一可知己既播為九以殺水𫝑復從而一之一不足以納九則河以歸墟不快又泛濫旁溢以為害且九河之地南北相去三四百里強九成一則迂曲而必潰圮欲並三四百里之地瀦為一河功既浩大而難施且徒以召海水之入而棄壤土於河其於河之疏塞則固無益即使盡壑冀兗以為海亦不足飽海之貪而適以逆河之路是平天成地者適以裂地而滔天也故經言同而不言會其亦九河皆為逆河而非一亦審矣為云者人為之也東為北江入於海鄭樵以東為北江入於海為衍文朱蔡據以為是今按江漢之東下者與禹貢正無少差特經文錯綜不易讀曉故穿鑿者引水味以強分之而泥著者不知通經文之變而誣為失也經言東滙澤為彭蠡又云會於滙則滙者他水之聚而非謂漢之瀦也滙澤云者所以紀章江也章江上流瀕乎百粵禹迹所不至故不見於經而就其下流入江之次紀之曰滙澤於彭蠡又曰會於滙言章江之會江漢也乃本文之連江漢而為詞者章江之不能自謂彭蠡猶瀟湘之不能自為洞庭也江水東出之𫝑扼瀟湘而為洞庭江漢東下之流至小孤為淖水所阻屯壅以扼章江而滙為彭蠡則為彭蠡者章水而使之為彭蠡者江漢也朱子曰彭蠡非有所仰於江漢而衆流之積日遏月髙𫝑已不復容江漢之入是未詳會於滙之文初非謂漢之入為彭蠡而抑不知小孤之淖逐江漢而郤行即時溢入彭蠡亦𫝑之所必有也經云南入於江則漢於此已為江所並而滙澤之日不復獨歸之漠矣朱子曰漢果滙於彭蠡則漢水入江之後便須有一洲介於其間以為江漢之别又當各分為二以為出入之辨是又未詳於經之本文上言入江下言北江而不復繫漢之旨也經言南入於江則紀漢之事巳畢而漢自入江以後江不得獨有其流故自大别以東入海之水可名為江亦可名為漢則武昌以下通州以上水所經過不妨見於導漾之下故於漢有入海之文於江又有會於滙之紀互舉而並存焉以著江漢之兩大也彭蠡之滙可屬於導江之下亦何不可屬於導漢之下繫漢則失江繫江則失漢而漢在下流故兩存而詳於所近出者非謂僅一漢水入為彭蠡而復出為北江而江不與也其言東為北江者南人通謂水為江此又以著北江中江之稱以明地從主人之義言漢在略陽以北謂之漾略陽以東謂之漢均州以東謂之滄浪漢口以東謂之北江一水而四名也山海經云大江出汶山北江出曼山南江出髙山南江者青衣江也故山海經又云髙山在成都西北者漢也曼山或即嶓冢大江者中江也遡其所出則嶓在岷北及其東下則漢口在前江口之北故漢曰北江青衣江出於黎雅其與江合在敘州於江為南南江合中江於敘及其東下巳併為一而南江源小不足亢江故經但言中江而不及南江漢合流以後荆人之稱之者不復目言江漢而以漢為北江江為中江經於其下流悉其異名以著土人之稱謂有然者為之為言謂也猶言漢為滄浪為濟為滎之云初不謂江漢之各自成川於會滙之後也其言入於海者江入海而漢與之俱入也渭雒紀入河而不重言入海河不與渭雒敵也漾沇紀入江入河而重言入海漢濟與江河敵也江與漢敵故江漢各立入海之文而漢微遜於江其東下又江先而漢後故於漢水又著入江之目使不先言入江則失江漢合流之實不各言入海則大别以東揚子之水漢實居半義不得全屬之江也經文為起錯舉之例兩言而並著之猶濟之業巳入河其溢為滎者河濟合溢也乃不欲使濟為河掩且屈河之支流以從濟况江漢之潔大爭雄並紀南國者乎特彼則河有經流故獨繫滎於濟之下而於河不再見此則江全合漢故必再著會滙入海之文經之體物立義其精如此讀者草次不察欲擅大别以東之水全歸之江而誣經為衍然則春秋之會盟同地而再言葵邱首止詩之七月流火而一篇三及者其又何以通之也耶澧九江東陵澧謂洞庭之末流也九江者起清江至漢江要其終於漢口而言之也過者言江水之經過而因與之合也東陵者武昌以東瑞昌以西江之東岸諸山也所以然者蔡氏謂澧為山澤既舍著明之水别求無名之澤胡朝以九江為洞庭不知江水實未嘗經過洞庭至巴陵而後東迤北也禹貢之文詳內而略外詳近而略遠彭蠡源於章江不言章江而言滙洞庭實兼九水西莫西於沅南莫南於湘不言洞庭沅湘而言澧則以虔吉為百粵之地而當湖口者我止知其為滙也洞庭之納九水微者既不足紀沅湘出於黔粵苗猺之地而澧最居九水之末則亦止知洞庭之為澧也故王逸離騷注云洞庭謂之澧口猶河之所出張騫所不能窮而禹貢則斷以積石為始內中國故詳外夷狄故略此聖人以義裁物之精意也滙言彭蠡而澧不言洞庭者彭蠡湖瀕於江故湖水入江水𫝑平緩泛江而下過彭蠡故彭蠡有與於江洞庭自君山以北不復為湖髙下殊𫝑故巴陵之水迅流以逹於荆江口者四十餘里泛江順下不見洞庭故割洞庭而無與於江也水經云江水至長沙下雋縣澧水沅水合東流注之湘水從南來注之蓋水落洪出之後實有然者而無所謂洞庭矣洞庭者夏秋則有冬春則無抑不如彭蠡之常為湖也水經且不於江而著洞庭况經之簡核以立言者乎朱子身遊其地乃不知江水之未過洞庭屈從胡朝之説况蔡氏之遙為忖度固守專家之學者哉沇濟沇水出今澤州之陽城縣析城山下有神池伏流地下至懷慶府濟源縣復出為濟水經以為出垣縣者析城在漢𨽻於垣今垣曲而後割入於陽城也若其東至溫縣以後則為河水所亂古今差異而不可刻舟以求劍矣漢築石門而濟隨河合流不入滎瀆王莽時大旱濟源枯絶而不復有濟逮後復通流而為河所奪則河之經流與濟莫辨雖滎澤再通要不能析之為濟矣當宋之季黃河南徙濟水徑流方回所云清濟貫濁河遂成虛論宋金之代則然若今黃河之流雖南而自溫至汴而與濟並流者數百里禹河在北南溢而為滎今河徙南北出而為儀封曹城之小黃河濟為河水所挾以後自張秋北去經武定濵州利津為今大清河以入海今河南徙而𫝑弱則循禹故道自華不注之北徑青城博興為小清河以入海要之濟小而河大相去懸絶為河所亂則或南或北亦不可復識其為濟矣經云入於河者巳明著濟水之不能自逹於海矣其云東溢為滎則以河東來而濟南出適際其衝與溢為滎澤相與比近則河固溢而濟亦溢雖不可執滎為濟之下流亦不可徑指為河之支流故上冠以入於河而下繼以溢為滎是河濟合溢可以繫之河而亦可以繫之濟也其不以繫之河者河大以經流為正濟小則溢流可存可以繫之濟固不必繫之河矣朱蔡以蘇子瞻江漢辨味之説為童騃而徒於濟水之性求辨於徑疾旁證於趵􅊳引驗於阿膠則猶夫蘇之騃也程大昌謂溢出者非濟而欲絶濟於滎蔡氏乃欲謂溢出者非河而絶滎於河程不知上固連濟蔡亦不知下已言入河也蓋自廣武以東訖乎海北至東昌南至徐夀地既平衍當洪荒之世水初定位即播為數渠南起金末項城之河北而正統間亳州之河又北而梁靖口之河又北而虞城之河又北而曹州之小黃河即滎也又北而定陶之河皆河所分濟亦有時隨之俱往間或河移於溫而濟水特逹要亦未能始終而與河離孟子曰疏九河瀹濟漯九河為河下流之分支濟漯為河上流分受之大渠自非全河注滎則滎雖兼受河濟而岸狹水小則河之濁者以漸就安流而嚮於清今徐州懷逺以下河之入淮者亦不似汴宋以西之混雜泥滓亦若江漢之初出乘漲混濁至揚州石頭而泓然一碧也故不必泥水之清者以為濟矣若阿膠之性徑重則或驢鞹使然而青州非濟所經所合白丸子用彼中之水亦與阿膠同功要以地濕下而水鹹則質重不因濟也使濟有疏痰之力則何不於濟源造膠乘沇伏流之初出者其效為尤大乎此方技之巵言不可熒聽者也漯受河則濟亦受河滎受河則亦受濟兩水既合誰與辨之泥沙隨瀑流而徙且解散而四出况其俱為水而同流耶夫油輕而水重水輕而泔重此較然者今以一甕之油一石之泔投之溪流不逾尋丈而已散亂濟獨何能紀其類以自遠於河哉况濟既徑下則必趨其尤下者乃捨大河經流之瀆而旁溢於支流則必濟水輕緩為河所浮若溪流之有芥羽則集於洄也若趨下而清者之必不旁溢亦審矣畫滎為濟非戲論與經於此一以志沇一以志河之支流故别其名曰滎而不曰濟禹貢志約而義精類如此因以知禹河雖北未嘗不南從古無納黃河於一瀆之理則載河於山之説益信其妄若四瀆之云則以河分為二在北合漳為河在南入滎為濟通計中國之大川凡四禮家謂之四瀆猶四竅也劉熙曰瀆獨也亦纎陋之見九澤大陸一雷夏二大野三彭蠡四震澤五雲夢六菏澤七孟豬八豬野九凡此九澤見於經文者具為縷悉揚豫􅋻下平衍之地本有二澤不得故黜其一青瀕海地狹源短流疾梁處叢山互峽之中皆不容有澤無容強而使有與九川九山不以州分者同孔蔡泥上九州之文别著山澤信傳固不如信經也五服禹貢之書成於舜之中年蓋禹受命治水在舜殛鯀之後八年之後而兖州之作又十有三載矣蔡氏以堯都冀州為五服之中者也然舜都於蒲其正北直大同而正西直河州臨洮府屬亦無二千五百里之遠若南扺衡山之陽則且四千里矣大同以北沙漠之野黃茅白葦朔風飛雪蒙古固有其地而不能耕而洮湟之外河西四郡其山川不見於經文則非禹之所甸可知蓋中國之幅員本非截然而四方絶長補短移彼就此東西南北原不相若則五服之亦以大略言爾且以王畿言之而太康畋於雒表則南贏而北縮是甸服固有出於五百里之外者亦可以納米為之通例也又先儒疑五千之服狹於周漢蔡氏又謂荒服之外别有區畫不知漢之以里計者道路禹貢之以里計者土田方五千里之田方千里者二十五以提封之井地計之為畝者二百二十五億萬畝較之王制八十一億萬畝為多三之二或夏后氏之田一夫五十畝方里之田四百五十畝猶當一百一十二億五千萬畝扺二百四十步之畝四十六億八千七百五十萬畝而多於開元田數者尚三之一又或古今步尺之長短有差要以今六當古十猶得二十八億一千二百五十萬畝而多於開元十四億萬畝有竒者尚倍之方疑禹甸之太遙非唐全盛之所及若漢之方田止於七億萬畝有竒者又勿論已或古之治道明而民情願朴唐則法圯民姦而多所隱射要以世遠而無從核實乃禹甸之非狹而荒服之外無區畫則不足疑也甘誓三正三正者子丑寅三統之正而非但以嵗首之建也古者作厯必立厯元以為五星聨珠日月合璧之辰而因推其數以定將來自宋以上皆然至郭守敬而後罷以甲子嵗仲冬甲子朔夜半冬至為元者日月五星皆會於室是謂天正以甲寅嵗孟春甲寅朔平旦冬至為元者日月五星皆會於虛是謂人正後世蓋兩用之惟地正後不復用故亦無從而考以二正推之則當以劉歆三統之説自合於地統地化自丒畢於辰而用甲辰嵗孟春丙寅前月季冬乙丒甲辰朔雞唱冬至為元日月五星皆會於斗為地正之元也三元異建而厯小異然三元異見而厯亦大同者則以人生之會上逮地闢地闢之會上逮天開嵗差所積日月五星之合厯一會而差一辰揆之一元之全則固合也顓頊之後堯舜以前帝嚳之厯蓋以甲子為元天統也堯以甲辰為元地統也三正異元而授受有其合符故古之帝王雖用一正而不廢二正猶春秋以夏時冠周月用子正而二三月皆稱王也舜承堯統在璿璣玉衡以齊七政所以修明堯法而甲辰之厯未改故曰紹堯無為禹受終而易堯舜之厯用甲寅為元以上同顓頊為法以近而密故孔子稱行夏之時禹之為功平天成地平天莫大於三正成地莫大於五行有扈氏之擅命不恭生今反古疑禹之革唐虞之正朔不如舜之承堯故不用夏政威侮而怠棄之以藉口而生亂當禹之時懾不敢動禹崩啓立稱兵以與天子大戰固小人乘喪草竊之恆其或如孔頴達所謂繼父不服者亦非臆度由其不用夏后五行三正之法則以與子為稱亂之名亦其𫝑也蔡注於此大屬未詳攻左攻右蔡氏曰攻治也今按車左之射車右之刺皆蒞之平日其治不治非待方戰而始飭之攻擊也左之攻左右之攻右古戰之法也兩車相當我之左值敵之右我之右值敵之左相值而相攻於𫝑雖近而執弓者左手握弓弝左足必視所射者而斜向之右手彄弦必曲而之外使以左射左則左足既為左箱所蹙右手向後而為車後蔽所迫矣右之執矛左手近鋒右手近鐓近鐓之手力所從發必曲而向外若正刺則向後而無力近鋒之手必直而向前若正刺則曲向內而不審且擊兵在手七在外一在握二在內順之以向敵則鐓必礙胸抑或轉鐓使左而右手之力為虛設矣故兩車相值𫝑必錯攻而具不正相值也使敵車在左其右為箱之所隱則可射者惟左敵車在右其左為箱之所隱則可刺者惟右彼隱而不能攻我我亦攻其所相為攻者而已古之行陳因其自然而使得盡攻之用既畫為一定之法特當車馳馬􅊳之際則有不盡於攻者然猶使之必此為法蓋不令倉猝或亂致失巳之長而輕攻以取敗若在追奔逐北之際有必勝之𫝑可以因利乘便而亦終不聽其違法刺射以濫殺而無巳斯左必攻左右必攻右古人立法之精非後世恃勇野戰之所及猶御必馬之正不得邀利取徑則敗不致於僨車而勝不致於貪殺也春秋傳所記兩將相敵皆左射左而不射右亦古法之僅存者也胤征仲康肇位肇建始也羿距太康夏紀欲絶仲康就大河之南復正大位中興之業同於創始夏民驚喜若非所得且不承國於先君故不可云即位而云肇位史氏之例也建始曰肇以紀夏復興之始下云胤后承王命徂征初不承肇位之文則命胤侯掌六師者在肇位之初而承命徂征則他年之事蔡氏信虞􅒠之説以為仲康之元年與皇極經世同其實非也竹書紀年一編固多附會不經而其紀甲子也則精密而不可易皇極經世以仲康元年為壬戌嵗上距堯元年甲辰一百九十九年下距宣王元年甲戌一千三百三十三年今以劉炫一行郭守敬厯法參考之仲康五年癸巳九月朔庚辰日食於房二度則知仲康元年嵗在巳丑上距堯元年丙子一百四十九年下距周宣元年甲戌經世與竹書至此始合一千一百二十六年而厯法所推正得九月朔日食於房是則竹書以堯元年為丙子仲康元年為己丒而記五年癸巳九月朔日食仲康始命胤侯徂征羲和其有徴而非妄矣竹書出於晉太康之世非厯家之言而與劉炫一行郭守敬之法合符則皇極經世以堯元年為甲辰仲康元年為壬戌推之無日食於房之事其誤審矣蓋堯用地正以甲辰為厯元甲辰者堯所推上古日月合璧五星聨珠之元而非堯之元年也注疏之精於厯者莫如劉炫厯之徵今而信古者莫如一行與守敬三家合符以證竹書之確賢於蔡之宗邵邵之宗虞其巳遠矣謂堯以甲辰為元者猶顓頊厯之以甲寅為元周厯之以甲子為元也而顓頊元年嵗在乙卯而非甲寅且以顓頊元年乙卯如竹書所紀厯一百二十一年正得丙子又厯一百九十四年正得己丒又四年而正得癸巳於法當以九月朔日食則其編年之有所本也明矣虞邵之説漫無徴據徒延其年嵗以合於宣王元年之甲戌遂使堯之元年丙子降二百一十三年而為夏后相之二年仲康之元年己丒降二百有九年而為夏王不降之二十九年又四年而得癸巳則為不降之三十三年不知不降之二十九年己丒日不以季秋食於房則蔡氏之説為非而皇極經世所紀仲康元年之壬戌上差二百有八年乃竹書堯未即位以前十四年之嵗自壬戌以至丙寅五年之九月日亦不食於房二度則以辰弗集於房徴胤征在仲康五年癸巳以癸已九月朔庚戌日食限在房二度徴辰弗集於房之文竹書之與經合而可為經釋也觀乎武王克商之嵗在辛邜竹書所紀與國語􅘈合而一行守敬之術亦相協無異惟皇極經世以為己邜者則與國語不合知三代以上之編年紀事惟竹書之為可信巳又孔氏謂仲康為羿所立蔡氏從之其説亦非使然則仲康得國於仇賊之手亦安足紀且羿豈肯以兵權授之胤后耶劉炫謂仲康為五子之一徯於雒汭太康不返而仲康立其説是也尚書稗疏卷二
