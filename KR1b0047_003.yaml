body:
  text: 尚書稗疏卷三嶽州王夫之撰商書湯誥商亳自契至湯號商而八遷都亳其名實淆亂𫝊注不能有畫一之說乃所謂商者有二一曰商今陜西之商州舜封契之地也故詩曰帝立子生商而鄭康成云商在太華之陽是已一曰商邱則今為縣𨽻歸德府堯遷閼伯於此至武王克殷乃以其地封微子故鄭氏詩譜云武王伐紂乃以陶唐氏火正閼伯之墟封紂兄微子為宋公而子産所言商人是因故辰為商星猶言唐人是因故參為晋星商宋也唐晋也此皆自周室分封而言非謂殷周以前也其曰以服事夏商者則専言唐而不言商且謂服夏商先代之祀事非云在夏而有此侯服也杜預泥於文句因有湯先相土封商邱之說史記亦惑焉不知商在微子以前實未嘗一日立國於歸德之商邱蓋商雒之商去歸雎遠殆千里而詩稱相土烈烈亦止頌其入為王官出長侯伯未嘗如公劉亶父有遷國之事此以徴相土無自商徙商邱之實矣按竹書仲康七年世子相出居於商邱緣太康失河北仲康居斟鄩使世子處於商邱漸西以圖夏邑乃出土於文相近遂訛出為土而云相土封商邱不知商之為商自契已然何待相土而始受封耶竹書攢釘失實又惑於帝相十五年立商侯相遷於商邱之文夫商邱既為帝相之都矣則相土又安得據天子之都而遷之或即鄭氏所謂入為王官者當帝相之世相土蓋嘗官於商邱而其國則固在太華之陽也八遷之地既不可考以地𫝑度之則亦西起武關東盡成臯北訖偃師南極盧氏要為雒表之國不能東北遠至雎歸也若所謂亳者固有三亳北亳考城也南亳亳州也西亳偃師也春秋㑹楚子於薄南亳也知然者以在盂與鹿上之南也考城直亳州之北故曰北亳若湯所都則西亳也故椒舉曰湯有景亳之命李善文選注云景山在緱氏縣西南七里杜預亦云鞏縣西南有湯亭湯之居偃師也無疑而或以為湯都在濟隂之亳縣今曹州去考城為近則是以北亳為湯都又漢書注以景亳在䝉縣杜預亦云薄縣有湯冡抑以南亳為湯都其誤均矣詩云景員維河夏商之世黃河北出不合於濟䝉縣安得有維河之景亳哉皇覽云偃師有湯亭湯廟而伊尹自夏歸商㑹女鳩女方於北門使湯居南北二亳則伊尹之歸當自西而不自北矣湯之征也嘗伐有雒滅過矣溫直偃師之北有雒直偃師之南蓋遠交近攻必然之𫝑特孟子有亳與葛鄰之說而後人誤以寧陵為不祀之葛因疑考城寧陵之相接壤不知寧陵之葛乃春秋同邾牟覲魯之葛人周之葛而非夏之葛也然則與亳為鄰之葛蓋亦溫與有雒之儔與以實求之契封於商州八遷而湯居偃師逮後仲丁遷囂囂敖也河隂之敖倉也皆在河南河亶甲渡河以北而居相相彰德也祖乙遷耿耿河津之耿鄉也祖辛遷庇庇弼也汲縣之弼城也皆在河北南庚渡河以南而遷奄奄曲阜也當殷之世黃河循禹故道自大伾北流則曲阜固在河南而或自東平南决則奄亦被水害故盤庚復渡河以北而遷殷殷淇縣也河在大伾以西合濟東流則亦與今河大同而淇殷固在河北故盤庚云惟涉河以民遷南涉而北非北涉而南也自盤庚以後至於紂而未嘗復遷於河南至殷之亡宋始受封於商邱此自契至紂商邑所都之大略總未嘗一日立國於南北二亳北亳固帝嚳之都而非湯都南亳於商周之際則淮夷之壤也北亳自帝嚳以後為閼伯之封至周而後為微子所有南亳至春秋為吳楚之爭地一曰城父西亳則在周為王畿井然自有其不易昧於三亳之分以亂二商之辨又以周之葛為夏之葛不祀之葛疑即長葛或繻葛或鄭地相沿積訛豈有艾哉伊訓祠於先王祇見厥祖孔氏以太甲元年湯崩逾月太甲即位奠殯而告為祠居位主喪為見祖其失也蔡氏辨之詳矣而朱子徒守皇極經世之所紀以為無外丙仲壬嗣立之事故於孟子注雜用程徽菴之說以證太甲之嗣湯而非嗣仲壬今按程氏之說其謬實甚商道親親故立弟檀弓微子舍其孫腯而立衍也春秋宋公之舍子立弟亦不一而足則外丙仲壬雖幼而殷禮不可亂猶成王幼冲而周道尊尊必不可舍子而立弟也皇極經世用虞鄺不驗之厯隨意伸縮以就堯元年之為甲辰自不如竹書以丙子定堯元年之合於𦙍征國語竹書所紀外丙元年乙亥仲壬元年丁丑太甲元年辛巳合於日月五星之厯數昭然可據而湯夀百嵗亦無既崩而有二嵗四嵗之子蓋男子八八六十四而天壬竭故古者六十而閉房後世雖有耆艾生子之事要君子之飬性凝命者自其不爾而謂武王九十而生成王者亦小戴徴夢之駁說實則武王未必有九十三齡之事也蔡氏廢邵朱而從岐鄉其於理合矣且在禮三年喪畢祔於廟而後父稱考大父稱祖故喪禮卜葬命龜之詞稱父某甫虞祔皆稱爾稱父稱爾而不稱考為不忍亡之之詞則亦知大父方殁嫡孫為喪主亦當稱大父而不得稱祖矣此曰祇見厥祖知在成湯祔廟之後三年喪畢之餘矣三年之喪不祭者蓋推父為嫡子服三年之義以體祖考之心仁慈其子孫之死亦不忍聞樂而食㫖所謂事亡如事存也陳大猷云不以凶服入宗廟蓋亦未逹禮意今此仲壬之喪未及小祥而祠於先王者則以仲壬非嫡長於湯之恩為殺而殷道親親兄終弟及既為常典則與周之嫡長嗣絶其弟與從子以小宗繼大宗為人後者為之子其義不同而禮亦别故太甲雖繼仲壬以為君實不嗣仲壬而為後故居憂之制雖從其隆而不廢吉祭亦自别有其義不得引周禮以證商制也若太甲果以為人後者為之子之服服仲壬則不特親祭不可而尹之攝行亦未為得矣經文曰祠於先王奉太甲祇見厥祖同繫於乙丑之日則因祭而奉甲以見亦太甲之主祭而攝云乎哉伊尹舊說伊尹名摯不知所出蔡氏云伊姓尹字則尤不典尹之言於太甲者一則曰尹躬再則曰尹躬豈人臣而以其字稱於君前乎生而字死而諡自是周禮商以前無之然一人而或有異名若吕尚之為太公望臯陶之或為庭堅是也則曰摯曰尹要皆名耳屈大夫名平而抑曰名豫以正則亦此類也要不可以後人一定之名字為古人分限造攻自鳴條孔氏曰始攻桀伐無道我始修德於亳朱子用之以注孟子而蔡氏乃云造可攻之釁者由桀積惡於鳴條夫上云皇天降災假手於我有命則已言湯而不言桀矣假手於湯故湯伸天誅而往攻造往也自當音七到反自于也往攻于鳴條天假之手也若朕哉自亳則以起下文惟我商王而别為一意言我之始受天命於亳則惟湯之昭聖武而懷兆民也孟子偶斷章取義孔蔡遂聨為一節則文義隔塞不諧且上已云子孫弗率不當復及於桀之造釁也若孫莘老所云造為攻伐自放鳴條則尤不通鳴條在安邑夏之都也使桀終老鳴條固巳保其國都矣而何云放哉太甲上桐桐宫密邇先王之墓而逺於亳今偃師縣有湯陵蓋非也使湯墓在偃師則太甲未嘗一日去亳但可云自野歸庭不得言歸亳矣成湯之墓實在山西榮河縣元癸未嵗淪於河今祀湯陵猶於此而不於偃師湯所以逺葬於彼者以湯既克夏夏之王畿不以分封而仍為商千里之邦畿伊尹葬湯於彼亦以鎮撫夏民即周公營雒之意故後祖乙因之以遷耿而太甲所徂之桐則在今聞喜縣與榮河接壤𫝊注未為之考固失之踈而杜預以南亳有湯冡尤為差忒盤庚遷於殷殷在盤庚以前稱商而不稱殷殷者盤庚以所遷之邑為號也殷墟之在淇縣見於經史者班班可攻雖以姚馥老羌亦知朝歌之為殷而朱子曰殷者亳之别名蔡氏曰殷在河南偃師何其踈而不察耶殷之為字本或作郼音於機反古者因依聲近轉借為殷其地之在河北沫水之濵羅長源考之已確朱蔡不審涉河以民遷之文誤以涉河而北為涉河而南蓋惑於書序祖乙圯於耿連屬盤庚五遷之上乃不知有祖辛遷庇南庚遷奄之事而盤庚所云我王來者謂南庚來奄而非謂祖乙來耿也大河在商至大伾而北流奄在河南使盤庚遷亳無事涉河矣序云盤庚五遷倘無奄庇二都不足五遷之數孔氏以湯居亳我往居亳當五遷之二則湯固居亳不得云遷而盤庚誓衆之日尚未遷之於新邑亦不得云於今五邦緣祖辛南庚雖遷而無誥衆之書故書序略而不紀孔氏泥於序而屈經五邦之明文以從之其亦陋矣蔡氏亦疑盤庚之前當有五遷而以史記祖乙遷邢當之乃其以湯所舊居之亳為一遷則弊與孔同若書序謂之亳殷者或亦承訛而自盤庚遷殷之後既未嘗有再遷沫都之事直至於紂終始稱殷則紂所居武王所克之殷即盤庚所遷之殷可知己且經之稱述先王以警臣民者不一而足使返居湯之故都則當昌言此為興王之地烈祖締造之艱難宜在先復以為飭正浮言之大義何乃幽質鬼神而不一述舊德先疇也哉况湯居亳而號商盤庚反亳而踐湯之蹟固不宜革故號以作民疑惟殷本為郼而地在沫邑故可就新邑以立新名而示更始則殷在河南之說其誤明矣說命上說築傅巖之野孔傳謂傅氏之巖有澗水壞道常使胥靡築護之說代胥靡築以供食按自周以前無有刑人築作之法舜典所謂流宥五刑金作贖刑者流止於徒贖止於金逮周穆王而未有改也周禮之被刑者亦但使守而不使作以刑人充作役則漢城旦鬼薪之律耳且當高宗之世商法未骩信令刑人操築亦不當使得雇人代作且說既賢者縱令乏食自可就傭民間何至辱身毁體代罪人以求食乎是知孔說之妄也但孟子固云傅說舉於版築之間而蔡氏以築為卜築則似過為說護困乏之短而失其實矣築非居也今人言卜築者亦謂作室之始非言固居之也趙岐曰傅說築傅巖亦謂親操畚築所以孟子云勞其筋骨蓋說方貧處操築室之事適與武丁往求之人相遇固不知其為自築或為人傭築或舊為營築之匠而要其舍畚杵而應弓旌則同此一日之事也若史記胥靡之說則子長好竒之過與孔氏同其失也又傅說之說本當如字讀或讀作悅者非悅非美德古人不以命名唐張說字道濟取傅說濟川之義而亦作失爇切其可證也說命中大夫師長王制月令昏義皆有九卿之文鄭氏以為夏殷之制甘誓稱六卿賈公彥云六卿並三孤而為九卿白虎通曰內爵公卿大夫不變質文內者為本不改內也是殷之有卿明矣殷有卿而此不言卿云承以大夫者蓋天子之卿或以諸侯入為之或受地視侯而有百里之邦則統謂之君公而不謂之卿也若諸侯之卿自上大夫耳不得稱卿后王有天下君公有國大夫有邑有天下國者建之邦有邑者設之都卿或上視諸侯而有邦或下視大夫而有都卿為虛位而無定祿職守在廷之法紀而不親民事故此言建邦設都以亂民皆為有定土者言上不及卿而下不及士也師者官師秩亞於上士而為有邦者治下邑者也長室老也秩亞於中士而為有都者宰私邑者也大小相承總為親民分土之官則士之仕於廷者宜不得與卿雖貴而亦可略而不舉也此與虞書所言有邦有家之義同而非泛叙羣爵古人義例精嚴蓋如此說命下遁於荒野入宅於河自河徂亳河云入當是河內亳云徂亦以見小乙武丁之都於沫土故居亳言往而不言來也髙宗之所以遁者以殷禮立弟自祖丁之後諸弟子爭相代立比九世亂盤庚崩弟小辛立小辛崩弟小乙立小乙崩子武丁立以殷立弟以及嫡長子之序正之則當立者盤庚之子而非武丁也所不當立而嫌於得立故其在小乙存之時不能安於國而必出遁以遠嫌也入宅於河則漸逼矣自河徂亳則據先王之故都而植之固矣故小乙崩得有所奉以入繼而廢盤庚之子以立焉無逸曰舊勞於外爰暨小人作其即位即位而言作者非所必承作起而踐大位也故與祖甲之不義惟王舊為小人同詞而非但如孔頴逹所云其父欲使知民之艱苦蓋亦分義與時𫝑所迫如漢孝宣唐宣宗之事矣小乙終廢殷法舍其兄之子而立其子是謂私恩若髙宗所承之大宗則終宜以盤庚為正乃髙宗過隆其父居喪則亮隂典祀則豐昵其亦顧私恩而違公議雉雊之變實為之應故祖乙亟以為不正而亦有難於顯言者特戒之曰罔非天𦙍則推崇盤庚以折髙宗之邪心亦可謂婉而至矣髙宗之顛末見於書者極為詳核要其遁於荒野則小乙之始念束於家法與公議且亦如宋繆公屬國於與夷而使其子馮出居於鄭特漸引之以入而又樹之於故都則其父子之密謀有不可掩者矣竹書稱小乙命世子武丁居於河亦紀之失實武丁固不得有世子之稱也而髙宗於此追述巳事雖以自歎其失學而殊有追憾巳往欣幸今日之意且其在野在河在亳密謀汲汲而無暇日亦可想見其窺伺天位之實則卜相而先佯為不言又托之夢以服衆要亦其巧心之熟試也周公以之與太戊祖甲並稱而易譏之憊髙宗非三代之令主也夫惟賢非后不食食舊皆以為食祿之食今按髙宗即非令主然何至以富貴驕人而慢士如此食之為言用也舉也舉而起收用之如六博之食子也亦猶茹之釋度羞之釋進也后須賢以治賢待后而羞其行故相須之急焉不然代食維好賢者其憂終餒而以口腹纍人哉西伯戡黎西伯吕伯恭諸儒皆以西伯為武王朱蔡以為不然顧未有確證其非武王者竹書記周之伐黎在殷紂四十四年為武王嗣位之三年與史記異顧經編戡黎於微子一篇之前而祖巳所指陳紂之失德亦未若微箕所云之甚使在文王既沒之後紂在位已久惡已貫盈而焚炙忠良斫脛剖心之事已習於毒祖伊其能盡言不諱而免於禍乎且祖伊於紂末年而尚存則武王克商訪箕子式商容而何不一及於伊耶則祖伊已先殷亡而非乘黎奔告之後周師即至於牧野之西矣况使武王因乘黎之𫝑而師遂東則下上黨出王屋徑按河北又何迂道而渡孟津則竹書之不足信審矣史以文王脫羑里專征伐之後紂用費仲惡來諸侯益踈紂歸周西伯乃大舉戡黎在比干未死之先而比干死於文王未薨之日於書之次序為合蓋紂已釋文王賜之弓矢鈇鉞既置文王於膜外而因諸侯歸周則又有忌周之心故序曰殷始咎周而文王之伐黎則以塞殷西嚮之路使不得由汾晋而窺河右蓋亦以自固而非以為取商之竒術則亦不害其為至德矣必謂文王不宜有伐黎之事則密崇之役亦非敵國不相征之義又將何以曲為之諱哉尚書稗疏卷三
