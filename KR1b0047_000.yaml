body:
  text: 尚書稗疏書類提要臣等謹案尚書稗疏四卷國朝王夫之撰夫之有周易稗疏已著録是編詮釋經文亦多出新意其間有失之太鑿者如謂虞書自戛擊鳴球以下至庶尹允諧皆韶樂之譜以詠二字貫下祖考來格三句為升歌以配笙瑟之詩鳥獸蹌蹌為下管之所舞鳯凰來儀為第九成吹簫之所舞百獸率舞庶尹允諧為樂終擊磬之所舞又謂作歌賡歌即大韶升歌之遺音䕫以被之管弦者故繫之庶尹允諧之後前數語不用韻如樂府之有艷有和有唱其三句一韻者如樂府之有詞其說附㑹支離全無文義其論洛書配九疇之數以履一為五皇極而以居中之五為一五行雖推衍百端畫圖立說終于經文本數相戾其于地理至以崑崙為洮州之胭脂嶺尤為武斷然如蔡𫝊引爾雅水北曰汭實無其文世皆知之夫之則推其致誤之由以為訛記孔安國涇屬溈汭之𫝊謂禋非周禮之禋類非周禮之類五服五章亦不以周制解虞制與陳第論周之五玉不可解虞之五玉者同一為古人所未發引矍相之射證侯以明之謂以與射不與射為榮辱非以射中不射中為優劣因引周禮日月辰次正泰誓十三年為辛卯引說文大戴禮記證蠙珠非蚌珠蔡傳不知古字假借引周禮王府供王食玉證玉食引左𫝊證奄與淮夷為二引喪大記證狄人引說文美字之訓以解美若駁蘇軾傳及蔡傳之失則大抵詞有根據不同游談雖醇庛互見而可取者較多焉乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:797f74450c94f110d0c4adddc6fd54afa4bd87a7e5acb5c1e75a576cfbaa1da9
